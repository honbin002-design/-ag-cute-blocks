<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>AG Cute Blocks 修復更新</title><style>html,body{margin:0;width:100%;height:100%;background:#9ed9ff;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#36515d}body{display:grid;place-items:center;text-align:center}.card{background:#fffde8ee;border-radius:22px;padding:24px 28px;box-shadow:0 8px 30px #0002;font-weight:800;max-width:78vw}.small{font-size:13px;margin-top:8px;opacity:.78;line-height:1.5}</style></head><body><div class="card">AG Cute Blocks 更新中…<div class="small" id="state">正在更新離線核心，請勿關閉此頁</div></div><script>
(async()=>{
 const state=document.getElementById('state');
 const TARGET='ag-cute-blocks-v045-runtime152';
 const sleep=ms=>new Promise(r=>setTimeout(r,ms));
 try{
   if(!('serviceWorker' in navigator)||!('caches' in window))throw new Error('unsupported');
   const keys=await caches.keys();
   await Promise.all(keys.filter(k=>k.startsWith('ag-cute-blocks-v045-runtime')).map(k=>caches.delete(k)));
   state.textContent='舊版快取已移除，正在強制取得 V0.4.91…';
   const regs=await navigator.serviceWorker.getRegistrations();
   const scoped=regs.filter(r=>r.scope.includes('/-ag-cute-blocks/'));
   for(const reg of scoped){try{await reg.update()}catch{}}
   let ready=false;
   for(let i=0;i<30;i++){
     const now=await caches.keys();
     if(now.includes(TARGET)){
       const cache=await caches.open(TARGET);
       const hit=await cache.match('./index.html',{ignoreSearch:true});
       if(hit){const text=await hit.clone().text();if(text.includes('V0.4.91')){ready=true;break}}
     }
     await sleep(250);
   }
   if(!ready){
     const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});
     try{await reg.update()}catch{}
     for(let i=0;i<30;i++){
       const now=await caches.keys();
       if(now.includes(TARGET)){
         const cache=await caches.open(TARGET);const hit=await cache.match('./index.html',{ignoreSearch:true});
         if(hit){const text=await hit.clone().text();if(text.includes('V0.4.91')){ready=true;break}}
       }
       await sleep(250);
     }
   }
   if(!ready)throw new Error('V0.4.91 cache verification failed');
   state.textContent='V0.4.91 已驗證，正在開啟遊戲…';
   await sleep(500);
   location.replace('./index.html');
 }catch(e){
   state.textContent='自動更新尚未完成，請保留此頁並重新整理一次。';
 }
})();
</script></body></html>
