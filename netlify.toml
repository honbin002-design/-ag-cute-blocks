[build]
  publish = "netlify-test-proxy"
  command = "echo 'AG Cute Blocks TEST proxy build'"

[[redirects]]
  from = "/*"
  to = "https://cdn.jsdelivr.net/gh/honbin002-design/-ag-cute-blocks@758f19dd6686e7b1f94928cdb0b9a352ca73165e/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-AGCB-Environment = "TEST"

[build.processing]
  skip_processing = true
