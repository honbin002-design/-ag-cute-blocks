[build]
  publish = "netlify-test-proxy"
  command = "echo 'AG Cute Blocks TEST proxy build'"

[[redirects]]
  from = "/*"
  to = "https://raw.githubusercontent.com/honbin002-design/-ag-cute-blocks/dev-v0.1/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-AGCB-Environment = "TEST"

[build.processing]
  skip_processing = true
