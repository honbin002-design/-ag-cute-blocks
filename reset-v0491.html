<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AG Cute Blocks 更新中</title>
<style>html,body{margin:0;width:100%;height:100%;background:#9ed9ff;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#36515d}body{display:grid;place-items:center;text-align:center}.card{background:#fffde8ee;border-radius:22px;padding:24px 28px;box-shadow:0 8px 30px #0002;font-weight:800}.small{font-size:13px;margin-top:8px;opacity:.75}</style>
</head>
<body>
<div class="card">AG Cute Blocks 更新中…<div class="small" id="state">正在清除舊版 V0.4.76 快取</div></div>
<script>
(async()=>{
  const state=document.getElementById('state');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(r=>r.scope.includes('/-ag-cute-blocks/')).map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('ag-cute-blocks-') && k!=='ag-cute-blocks-character-assets-v1').map(k=>caches.delete(k)));
    }
    state.textContent='舊快取已清除，正在開啟 V0.4.91…';
  }catch(err){
    state.textContent='正在重新載入最新版…';
  }
  const target='./?fresh=v0.4.91-reset-20260904-2345';
  setTimeout(()=>location.replace(target),700);
})();
</script>
</body>
</html>
