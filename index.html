<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AG Cute Blocks</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#9ed9ff}canvas{display:block;touch-action:none}.hud{position:fixed;inset:0;pointer-events:none}.title{position:absolute;top:max(12px,env(safe-area-inset-top));left:16px;background:#fff9;padding:8px 12px;border-radius:16px;font-weight:800;color:#36515d}.tip{position:absolute;top:max(58px,calc(env(safe-area-inset-top) + 48px));left:16px;background:#fff9;padding:7px 10px;border-radius:12px;color:#48606b;font-size:13px}.cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;color:#fff;text-shadow:0 1px 3px #555}.joy{position:absolute;left:22px;bottom:max(90px,calc(env(safe-area-inset-bottom) + 76px));width:118px;height:118px;border-radius:50%;background:#fff6;border:3px solid #fff9;pointer-events:auto;touch-action:none}.knob{position:absolute;left:34px;top:34px;width:46px;height:46px;border-radius:50%;background:#fff}.actions{position:absolute;right:18px;bottom:max(96px,calc(env(safe-area-inset-bottom) + 82px));display:grid;gap:10px;pointer-events:auto}.btn{border:0;border-radius:50%;width:62px;height:62px;background:#fffdd;font-size:25px;box-shadow:0 3px 10px #0002}.bar{position:absolute;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto}.slot{width:48px;height:48px;border:3px solid #fff;border-radius:12px;box-shadow:0 2px 8px #0003}.slot.on{outline:4px solid #ffe66d;transform:translateY(-4px)}
</style>
</head><body>
<div class="hud"><div class="title">🌈 AG Cute Blocks <small>V0.1</small></div><div class="tip">左邊移動・右邊拖曳看世界・＋放置・⛏拆除</div><div class="cross">＋</div><div id="joy" class="joy"><div id="knob" class="knob"></div></div><div class="actions"><button id="add" class="btn">＋</button><button id="del" class="btn">⛏</button><button id="jump" class="btn">⬆️</button></div><div id="bar" class="bar"></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ed9ff);scene.fog=new THREE.Fog(0x9ed9ff,24,65);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,100);camera.position.set(7,6,9);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xfff7dc,0x7aa66d,2.2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(10,18,8);sun.castShadow=true;scene.add(sun);
const colors=[0x8ed081,0xd9b38c,0xb6b9c1,0xf4a6b8,0xffd66b,0x93d8df,0xc8a8e9,0xffffff];let selected=3;
const geo=new THREE.BoxGeometry(1,1,1),blocks=new Map();const key=(x,y,z)=>`${x},${y},${z}`;
function block(x,y,z,c=0){if(blocks.has(key(x,y,z)))return;const m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:colors[c]}));m.position.set(x,y,z);m.userData={block:true,c};m.castShadow=m.receiveShadow=true;scene.add(m);blocks.set(key(x,y,z),m)}
for(let x=-12;x<=12;x++)for(let z=-12;z<=12;z++){block(x,0,z,0);if((x+z)%13===0&&Math.abs(x)>3)block(x,1,z,1)}
// cute sample house
for(let x=-2;x<=2;x++)for(let z=-2;z<=2;z++)block(x,1,z,1);for(let y=2;y<=4;y++)for(let x=-2;x<=2;x++){if(!(x===0&&y<4))block(x,y,-2,3);block(x,y,2,3)}for(let y=2;y<=4;y++)for(let z=-1;z<=1;z++){block(-2,y,z,5);block(2,y,z,5)}for(let x=-3;x<=3;x++)for(let z=-3;z<=3;z++)if(Math.abs(x)+Math.abs(z)<6)block(x,5,z,4);
const bar=document.querySelector('#bar');colors.forEach((c,i)=>{let b=document.createElement('button');b.className='slot'+(i===selected?' on':'');b.style.background='#'+c.toString(16).padStart(6,'0');b.onclick=()=>{selected=i;[...bar.children].forEach(x=>x.classList.remove('on'));b.classList.add('on')};bar.appendChild(b)});
let yaw=-.65,pitch=-.25,moveX=0,moveY=0,vy=0;const ray=new THREE.Raycaster();function aim(){ray.setFromCamera(new THREE.Vector2(0,0),camera);return ray.intersectObjects([...blocks.values()],false)[0]}
document.querySelector('#add').onclick=()=>{let h=aim();if(!h)return;let p=h.object.position.clone().add(h.face.normal);block(Math.round(p.x),Math.round(p.y),Math.round(p.z),selected)};document.querySelector('#del').onclick=()=>{let h=aim();if(!h||h.object.position.y===0)return;scene.remove(h.object);blocks.delete(key(...h.object.position.toArray()))};document.querySelector('#jump').onclick=()=>{if(camera.position.y<=2.05)vy=.12};
const joy=document.querySelector('#joy'),knob=document.querySelector('#knob');function jm(e){let r=joy.getBoundingClientRect(),t=e.touches[0],x=t.clientX-(r.left+r.width/2),y=t.clientY-(r.top+r.height/2),d=Math.hypot(x,y)||1,s=Math.min(38,d)/d;x*=s;y*=s;knob.style.transform=`translate(${x}px,${y}px)`;moveX=x/38;moveY=y/38}joy.ontouchstart=jm;joy.ontouchmove=e=>{e.preventDefault();jm(e)};joy.ontouchend=()=>{moveX=moveY=0;knob.style.transform=''};
let look=null;renderer.domElement.addEventListener('touchstart',e=>{for(const t of e.changedTouches)if(t.clientX>innerWidth*.35)look={id:t.identifier,x:t.clientX,y:t.clientY}},{passive:true});renderer.domElement.addEventListener('touchmove',e=>{if(!look)return;for(const t of e.changedTouches)if(t.identifier===look.id){yaw-=(t.clientX-look.x)*.005;pitch-=(t.clientY-look.y)*.004;pitch=Math.max(-1.15,Math.min(.75,pitch));look.x=t.clientX;look.y=t.clientY}},{passive:true});renderer.domElement.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(look&&t.identifier===look.id)look=null});
function loop(){requestAnimationFrame(loop);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;let f=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));camera.position.addScaledVector(f,-moveY*.085);camera.position.addScaledVector(r,moveX*.085);vy-=.006;camera.position.y+=vy;if(camera.position.y<2){camera.position.y=2;vy=0}renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
