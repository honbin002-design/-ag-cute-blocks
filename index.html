<!doctype html>
<html lang="zh-Hant">
<head>

<title>AG Cute Blocks</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;font-family:system-ui,-apple-system,sans-serif;background:#9ed9ff;touch-action:none}body{position:fixed;inset:0}canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}.hud{position:fixed;inset:0;pointer-events:none;overflow:hidden}.title{position:absolute;top:max(8px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));background:#fff9;padding:7px 11px;border-radius:16px;font-weight:800;color:#36515d;white-space:nowrap}.tip{position:absolute;top:max(52px,calc(env(safe-area-inset-top) + 44px));left:max(10px,env(safe-area-inset-left));background:#fff9;padding:6px 9px;border-radius:12px;color:#48606b;font-size:12px;white-space:nowrap}.cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;color:#fff;text-shadow:0 1px 3px #555}.joy{position:absolute;left:max(18px,calc(env(safe-area-inset-left) + 8px));bottom:max(76px,calc(env(safe-area-inset-bottom) + 66px));width:108px;height:108px;border-radius:50%;background:#fff6;border:3px solid #fff9;pointer-events:auto;touch-action:none}.knob{position:absolute;left:31px;top:31px;width:42px;height:42px;border-radius:50%;background:#fff}.actions{position:absolute;right:max(14px,calc(env(safe-area-inset-right) + 8px));bottom:max(82px,calc(env(safe-area-inset-bottom) + 72px));display:grid;gap:8px;pointer-events:auto}.btn{border:0;border-radius:50%;width:56px;height:56px;background:#fffdd;font-size:23px;box-shadow:0 3px 10px #0002;touch-action:manipulation}.bar{position:absolute;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:5px;pointer-events:auto}.slot{width:44px;height:44px;border:3px solid #fff;border-radius:11px;box-shadow:0 2px 8px #0003;touch-action:manipulation}.slot.on{outline:4px solid #ffe66d;transform:translateY(-3px)}.rotate{display:none;position:fixed;inset:0;z-index:50;background:#9ed9ff;align-items:center;justify-content:center;text-align:center;padding:28px;color:#36515d;font-weight:800;font-size:22px}.rotate small{display:block;font-size:14px;font-weight:600;margin-top:8px;opacity:.75}@media (orientation:portrait){.rotate{display:flex}.hud,canvas{visibility:hidden}}@media (max-height:430px){.title{font-size:15px}.tip{font-size:11px}.joy{width:96px;height:96px;bottom:max(66px,calc(env(safe-area-inset-bottom) + 56px))}.knob{left:27px;top:27px;width:38px;height:38px}.actions{bottom:max(68px,calc(env(safe-area-inset-bottom) + 58px));gap:6px}.btn{width:50px;height:50px;font-size:21px}.slot{width:40px;height:40px}}
</style>
</head><body>
<div class="rotate"><div>↻ 請把手機轉成橫向<small>橫向後會自動進入遊戲畫面</small></div></div>
<div class="hud"><div class="title">🌈 AG Cute Blocks <small>V0.1.1</small></div><div class="tip">左邊移動・右邊拖曳看世界・＋放置・⛏拆除</div><div class="cross">＋</div><div id="joy" class="joy"><div id="knob" class="knob"></div></div><div class="actions"><button id="add" class="btn">＋</button><button id="del" class="btn">⛏</button><button id="jump" class="btn">⬆️</button></div><div id="bar" class="bar"></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ed9ff);scene.fog=new THREE.Fog(0x9ed9ff,24,65);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,100);camera.position.set(7,6,9);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xfff7dc,0x7aa66d,2.2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(10,18,8);sun.castShadow=true;scene.add(sun);
const colors=[0x8ed081,0xd9b38c,0xb6b9c1,0xf4a6b8,0xffd66b,0x93d8df,0xc8a8e9,0xffffff];let selected=3;
const geo=new THREE.BoxGeometry(1,1,1),blocks=new Map();const key=(x,y,z)=>`${x},${y},${z}`;
function block(x,y,z,c=0){if(blocks.has(key(x,y,z)))return;const m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:colors[c]}));m.position.set(x,y,z);m.userData={block:true,c};m.castShadow=m.receiveShadow=true;scene.add(m);blocks.set(key(x,y,z),m)}
for(let x=-12;x<=12;x++)for(let z=-12;z<=12;z++){block(x,0,z,0);if((x+z)%13===0&&Math.abs(x)>3)block(x,1,z,1)}
for(let x=-2;x<=2;x++)for(let z=-2;z<=2;z++)block(x,1,z,1);for(let y=2;y<=4;y++)for(let x=-2;x<=2;x++){if(!(x===0&&y<4))block(x,y,-2,3);block(x,y,2,3)}for(let y=2;y<=4;y++)for(let z=-1;z<=1;z++){block(-2,y,z,5);block(2,y,z,5)}for(let x=-3;x<=3;x++)for(let z=-3;z<=3;z++)if(Math.abs(x)+Math.abs(z)<6)block(x,5,z,4);
const bar=document.querySelector('#bar');colors.forEach((c,i)=>{let b=document.createElement('button');b.className='slot'+(i===selected?' on':'');b.style.background='#'+c.toString(16).padStart(6,'0');b.onclick=()=>{selected=i;[...bar.children].forEach(x=>x.classList.remove('on'));b.classList.add('on')};bar.appendChild(b)});
let yaw=-.65,pitch=-.25,moveX=0,moveY=0,vy=0;const ray=new THREE.Raycaster();function aim(){ray.setFromCamera(new THREE.Vector2(0,0),camera);return ray.intersectObjects([...blocks.values()],false)[0]}
document.querySelector('#add').onclick=()=>{let h=aim();if(!h)return;let p=h.object.position.clone().add(h.face.normal);block(Math.round(p.x),Math.round(p.y),Math.round(p.z),selected)};document.querySelector('#del').onclick=()=>{let h=aim();if(!h||h.object.position.y===0)return;scene.remove(h.object);blocks.delete(key(...h.object.position.toArray()))};document.querySelector('#jump').onclick=()=>{if(camera.position.y<=2.05)vy=.12};
const joy=document.querySelector('#joy'),knob=document.querySelector('#knob');let joyId=null;function setJoy(t){let r=joy.getBoundingClientRect(),x=t.clientX-(r.left+r.width/2),y=t.clientY-(r.top+r.height/2),d=Math.hypot(x,y)||1,s=Math.min(34,d)/d;x*=s;y*=s;knob.style.transform=`translate(${x}px,${y}px)`;moveX=x/34;moveY=y/34}joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);setJoy(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)setJoy(e)});joy.addEventListener('pointerup',e=>{if(e.pointerId===joyId){joyId=null;moveX=moveY=0;knob.style.transform=''}});joy.addEventListener('pointercancel',()=>{joyId=null;moveX=moveY=0;knob.style.transform=''});
let lookId=null,lx=0,ly=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX>innerWidth*.35){lookId=e.pointerId;lx=e.clientX;ly=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)}});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;yaw-=(e.clientX-lx)*.005;pitch-=(e.clientY-ly)*.004;pitch=Math.max(-1.15,Math.min(.75,pitch));lx=e.clientX;ly=e.clientY});renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerId===lookId)lookId=null});renderer.domElement.addEventListener('pointercancel',e=>{if(e.pointerId===lookId)lookId=null});
function resize(){const w=visualViewport?.width||innerWidth,h=visualViewport?.height||innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}addEventListener('resize',resize);visualViewport?.addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('touchmove',e=>{if(e.target===document.body||e.target===renderer.domElement)e.preventDefault()},{passive:false});document.addEventListener('contextmenu',e=>e.preventDefault());
function loop(){requestAnimationFrame(loop);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;let f=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));camera.position.addScaledVector(f,-moveY*.085);camera.position.addScaledVector(r,moveX*.085);vy-=.006;camera.position.y+=vy;if(camera.position.y<2){camera.position.y=2;vy=0}renderer.render(scene,camera)}resize();loop();
</script></body></html>
