<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AG 角色實機驗收 V1.0.0</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bdcff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;touch-action:none}#game{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#9bdcff 0 48%,#8acb70 48% 100%)}.sun{position:absolute;right:10%;top:12%;width:72px;height:72px;border-radius:50%;background:#fff2a8;box-shadow:0 0 35px #fff4}.hill{position:absolute;left:-10%;right:-10%;bottom:25%;height:30%;background:#73ba63;border-radius:50% 50% 0 0}.ground{position:absolute;left:0;right:0;bottom:0;height:27%;background:#77b85f;border-top:4px solid #69a951}.platform{position:absolute;width:132px;height:38px;border-radius:8px 8px 4px 4px;background:linear-gradient(#b97843,#91532f);border:3px solid #754329;box-shadow:0 8px 0 #0002}.platform:before{content:"";position:absolute;inset:6px;background:repeating-linear-gradient(90deg,#d39459 0 18px,#a86237 18px 21px);opacity:.55;border-radius:3px}.p1{left:37%;bottom:27%}.p2{left:67%;bottom:41%;width:104px}.tree{position:absolute;right:6%;bottom:25%;font-size:80px;filter:drop-shadow(0 5px 2px #0002)}#shadow{position:absolute;width:70px;height:18px;border-radius:50%;background:#0003;transform:translate(-50%,-50%)}#hero{position:absolute;width:112px;height:220px;transform:translate(-50%,-100%);filter:drop-shadow(0 7px 4px #0004);transform-origin:50% 100%}#hero.walk{animation:bob .24s ease-in-out infinite alternate}@keyframes bob{to{margin-top:-4px}}#hero.walk #armL{animation:armL .48s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:top center}#hero.walk #armR{animation:armR .48s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:top center}@keyframes armL{from{transform:rotate(18deg)}to{transform:rotate(-22deg)}}@keyframes armR{from{transform:rotate(-22deg)}to{transform:rotate(18deg)}}#hero.jump{animation:jumpTilt .18s ease-out}@keyframes jumpTilt{50%{transform:translate(-50%,-100%) rotate(-3deg)}}.hud{position:absolute;z-index:5;inset:0;pointer-events:none}.badge,.hint{position:absolute;top:max(12px,env(safe-area-inset-top));background:#fffde9e8;color:#38545e;border-radius:16px;padding:9px 13px;font-weight:900;box-shadow:0 3px 12px #0002}.badge{left:max(12px,env(safe-area-inset-left));font-size:14px}.hint{right:max(12px,env(safe-area-inset-right));font-size:12px}.status{position:absolute;left:50%;top:max(64px,calc(env(safe-area-inset-top) + 52px));transform:translateX(-50%);background:#17323dcc;color:#fff;border-radius:15px;padding:7px 12px;font-size:12px;font-weight:800;white-space:nowrap}.joy{position:absolute;left:max(20px,env(safe-area-inset-left));bottom:max(24px,env(safe-area-inset-bottom));width:140px;height:140px;border:4px solid #ffffffaa;border-radius:50%;background:#ffffff35;pointer-events:auto}.knob{position:absolute;left:42px;top:42px;width:50px;height:50px;border-radius:50%;background:#fffffff0;box-shadow:0 3px 10px #0003}.jump{position:absolute;right:max(20px,env(safe-area-inset-right));bottom:max(25px,env(safe-area-inset-bottom));width:88px;height:88px;border:0;border-radius:50%;background:#fff4b8;border:4px solid #fff;color:#50706a;font-size:32px;font-weight:900;box-shadow:0 4px 14px #0003;pointer-events:auto}.jump:active{transform:scale(.93)}.legend{position:absolute;left:50%;bottom:max(15px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#fffde9dc;color:#536d63;border-radius:13px;padding:7px 12px;font-size:12px;font-weight:800;white-space:nowrap}
</style>
</head>
<body>
<div id="game"><div class="sun"></div><div class="hill"></div><div class="tree">🌳</div><div class="ground"></div><div class="platform p1"></div><div class="platform p2"></div><div id="shadow"></div>
<svg id="hero" viewBox="0 0 112 220" aria-label="可操作角色">
<defs><linearGradient id="hair" x1="0" x2="1"><stop stop-color="#8b4b35"/><stop offset="1" stop-color="#c4774d"/></linearGradient><linearGradient id="jacket" x1="0" x2="1"><stop stop-color="#ee8e86"/><stop offset="1" stop-color="#c95e70"/></linearGradient></defs>
<ellipse cx="56" cy="207" rx="30" ry="7" fill="#0002"/><path d="M31 42Q24 14 56 10Q88 14 81 44L74 76H38Z" fill="url(#hair)"/><path d="M35 35Q36 13 56 13Q78 14 78 37Q72 27 62 28Q49 31 35 35" fill="#6e3b31"/><ellipse cx="56" cy="48" rx="25" ry="28" fill="#ffd0b0"/><path d="M35 46Q39 25 57 26Q73 25 78 45Q68 37 58 39Q46 39 35 46" fill="url(#hair)"/><circle cx="47" cy="50" r="3.2" fill="#49332f"/><circle cx="65" cy="50" r="3.2" fill="#49332f"/><circle cx="48" cy="49" r="1" fill="#fff"/><circle cx="66" cy="49" r="1" fill="#fff"/><path d="M51 62Q56 66 61 62" fill="none" stroke="#b85d61" stroke-width="2" stroke-linecap="round"/><path d="M34 73Q56 64 78 73L85 127Q56 140 27 127Z" fill="url(#jacket)"/><path d="M43 75L56 91L69 75L67 126H45Z" fill="#fff0d1"/><path d="M49 83H63M48 92H64M48 101H64" stroke="#d89d7b" stroke-width="2"/><g id="armL"><path d="M34 78Q22 91 25 121" fill="none" stroke="#d86d75" stroke-width="12" stroke-linecap="round"/><circle cx="25" cy="126" r="7" fill="#ffd0b0"/><path d="M20 128l-5 5M24 130l-2 7M28 129l2 6" stroke="#ffd0b0" stroke-width="3" stroke-linecap="round"/></g><g id="armR"><path d="M78 78Q90 91 87 121" fill="none" stroke="#d86d75" stroke-width="12" stroke-linecap="round"/><circle cx="87" cy="126" r="7" fill="#ffd0b0"/><path d="M82 129l-3 6M87 130v7M91 128l4 5" stroke="#ffd0b0" stroke-width="3" stroke-linecap="round"/></g><path d="M30 125Q56 137 82 125L78 165Q56 174 34 165Z" fill="#445a43"/><path d="M36 161L54 163L51 195L32 195Z" fill="#ffd0b0"/><path d="M58 163L76 161L81 195L62 195Z" fill="#ffd0b0"/><path d="M29 190Q43 187 53 194L50 207H24Q20 199 29 190" fill="#754331"/><path d="M61 194Q71 187 83 191Q92 199 87 207H62Z" fill="#754331"/><path d="M74 83l15 9-5 7-13-8Z" fill="#dfb23e"/>
</svg>
<div class="hud"><div class="badge">🌈 AG 可操作角色展示 <small>V1.0.0</small></div><div class="hint">雙手走路動畫・平台跳躍</div><div id="status" class="status">請拖曳左下搖桿移動</div><div id="joy" class="joy"><div id="knob" class="knob"></div></div><button id="jump" class="jump" aria-label="跳躍">⬆</button><div class="legend">拖曳搖桿：移動　⬆：跳躍</div></div></div>
<script>
(()=>{const hero=document.querySelector("#hero"),shadow=document.querySelector("#shadow"),joy=document.querySelector("#joy"),knob=document.querySelector("#knob"),jump=document.querySelector("#jump"),status=document.querySelector("#status"),game=document.querySelector("#game");let x=.52,y=.73,vx=0,vy=0,drag=false,last=performance.now(),jumpLock=0;const platforms=()=>[...document.querySelectorAll(".platform")].map(e=>{const r=e.getBoundingClientRect(),g=game.getBoundingClientRect();return{x:r.left-g.left+w()/2,y:r.top-g.top}});function w(){return 0}function draw(){const g=game.getBoundingClientRect();hero.style.left=x*g.width+"px";hero.style.top=y*g.height+"px";shadow.style.left=x*g.width+"px";shadow.style.top=(y*g.height+4)+"px"}function support(){const g=game.getBoundingClientRect(),base=y*g.height;let floor=g.height*.73,best=floor;for(const p of platforms()){if(Math.abs(base-p.y)<18&&x*g.width>p.x-70&&x*g.width<p.x+70)best=p.y}return best/g.height}function doJump(){const s=support();if(y>=s-.018&&performance.now()>jumpLock){vy=-.017;hero.classList.remove("jump");void hero.offsetWidth;hero.classList.add("jump");jumpLock=performance.now()+250;status.textContent="跳躍中・可登上木平台"}}function setJoy(e){const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.min(48,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);knob.style.transform="translate("+(Math.cos(a)*m)+"px,"+(Math.sin(a)*m)+"px)";vx=Math.cos(a)*(m/48);return vyInput=Math.sin(a)*(m/48)}let vyInput=0;function stop(){drag=false;vx=0;vyInput=0;knob.style.transform=""}joy.onpointerdown=e=>{drag=true;joy.setPointerCapture(e.pointerId);setJoy(e)};joy.onpointermove=e=>{if(drag)setJoy(e)};joy.onpointerup=joy.onpointercancel=stop;jump.onpointerdown=e=>{e.preventDefault();doJump()};function loop(t){const dt=Math.min(32,t-last);last=t;const g=game.getBoundingClientRect(),moving=Math.hypot(vx,vyInput)>.08;if(moving){x=Math.max(.08,Math.min(.92,x+vx*.00055*dt));y=Math.max(.22,Math.min(.80,y+vyInput*.00042*dt));hero.classList.add("walk");status.textContent="移動中・雙手交替擺動"}else hero.classList.remove("walk");vy+=.00072*dt;y+=vy*dt;if(y>=support()){y=support();vy=0}draw();requestAnimationFrame(loop)}draw();requestAnimationFrame(loop)})();
</script>
</body>
</html>
