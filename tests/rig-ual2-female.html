<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AG｜UAL2 Female Rig Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9ecff;font-family:system-ui,-apple-system,sans-serif}canvas{display:block}.hud{position:fixed;z-index:3;top:10px;left:10px;width:min(390px,90vw);max-height:88vh;overflow:auto;background:#fffef0ee;padding:10px;border-radius:14px;color:#29434e}.hud h1{font-size:16px;margin:0 0 5px}.small{font-size:11px;line-height:1.4}.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}button,select{border:0;border-radius:9px;padding:8px;background:#fff;font-weight:700}button.on{background:#ffe071}.status{font-size:11px;white-space:pre-wrap;margin-top:7px}</style></head><body><div class="hud"><h1>AG 測試角色2｜UAL2 女性骨架／動作庫</h1><div class="small">獨立測試。來源：Quaternius Universal Animation Library 2 Standard（CC0）。不替換正式角色。</div><div class="row"><select id="anim"></select><button id="play">播放</button><button id="cycle">輪播</button><button id="skel">骨架線</button><button id="spin">旋轉</button></div><div id="status" class="status">載入 130+ 動作庫…</div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';import{GLTFLoader}from'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';const MODEL='https://raw.githubusercontent.com/agentkaerf/FreeModels/main/Universal%20Animation%20Library%202%5BStandard%5D/Unreal-Godot/UAL2_Standard.glb';const scene=new THREE.Scene();scene.background=new THREE.Color(0xd9ecff);const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);camera.position.set(3,2.2,5.5);camera.lookAt(0,1.1,0);const r=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.setSize(innerWidth,innerHeight);document.body.prepend(r.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x668877,2.3));const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(4,6,4);scene.add(dl);const floor=new THREE.Mesh(new THREE.CircleGeometry(3,48),new THREE.MeshStandardMaterial({color:0xe9f2dc}));floor.rotation.x=-Math.PI/2;scene.add(floor);const sel=document.getElementById('anim'),status=document.getElementById('status');let root,mixer,clips=[],action,helper,cycling=false,spinning=false,t=0,i=0;function stats(){let b=0,s=0;root?.traverse(o=>{if(o.isBone)b++;if(o.isSkinnedMesh)s++});return{b,s}}function show(extra=''){const x=stats();status.textContent=`Bones：${x.b}\nSkinnedMesh：${x.s}\nAnimation Clips：${clips.length}${action?'\n目前：'+action.getClip().name:''}${extra?'\n'+extra:''}`}function play(n){if(!clips.length)return;i=(n+clips.length)%clips.length;sel.selectedIndex=i;const a=mixer.clipAction(clips[i]);if(action&&action!==a)action.fadeOut(.15);a.reset().fadeIn(.15).play();action=a;show()}new GLTFLoader().load(MODEL,g=>{root=g.scene;scene.add(root);const box=new THREE.Box3().setFromObject(root),size=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3());root.position.sub(c);root.position.y+=size.y/2;root.scale.setScalar(2.5/Math.max(size.y,.001));mixer=new THREE.AnimationMixer(root);clips=g.animations||[];sel.innerHTML=clips.map((c,j)=>`<option value="${j}">${j+1}. ${c.name||'Animation '+(j+1)}</option>`).join('');clips.length?play(0):show('FAIL：GLB 無 AnimationClip')},undefined,e=>status.textContent='FAIL：'+(e?.message||e));sel.onchange=()=>play(+sel.value);document.getElementById('play').onclick=()=>play(+sel.value);document.getElementById('cycle').onclick=e=>{cycling=!cycling;e.currentTarget.classList.toggle('on',cycling);t=0};document.getElementById('spin').onclick=e=>{spinning=!spinning;e.currentTarget.classList.toggle('on',spinning)};document.getElementById('skel').onclick=e=>{if(!root)return;if(helper){scene.remove(helper);helper.dispose?.();helper=null;e.currentTarget.classList.remove('on')}else{helper=new THREE.SkeletonHelper(root);scene.add(helper);e.currentTarget.classList.add('on')}};const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const d=Math.min(clock.getDelta(),.05);mixer?.update(d);if(root&&spinning)root.rotation.y+=d*.5;if(cycling&&clips.length&&(t+=d)>3){t=0;play(i+1)}r.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})</script></body></html>
