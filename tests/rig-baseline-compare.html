<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AG Rig Baseline Compare</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dcecf6;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#253844}canvas{display:block;width:100%;height:100%}.hud{position:fixed;z-index:5;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));background:#fffef3ef;border-radius:14px;padding:9px 10px;box-shadow:0 4px 18px #0003}.title{font-size:15px;font-weight:900}.sub{font-size:10px;line-height:1.4;opacity:.75;margin-top:2px}.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.row button{border:0;border-radius:10px;padding:7px 10px;background:#fff;font-weight:800;color:#253844}.row button.on{background:#ffe27a}.labels{position:fixed;z-index:5;left:0;right:0;bottom:max(8px,env(safe-area-inset-bottom));display:flex;justify-content:space-around;pointer-events:none}.card{background:#fffef0e8;border-radius:12px;padding:7px 10px;font-size:11px;line-height:1.4;min-width:38vw;box-shadow:0 3px 12px #0002}.name{font-weight:900;font-size:13px}.fail{font-weight:900}.divider{position:fixed;z-index:3;left:50%;top:0;bottom:0;width:1px;background:#0002;pointer-events:none}
</style>
</head>
<body data-test="ag-rig-baseline-compare-v1">
<div class="hud"><div class="title">AG 骨架基線｜Kenney vs Quaternius</div><div class="sub">同頁比較 Rig／Skinning／動畫穩定性；不替換 V0.5.10 正式角色。重點看肩、肘、手腕、髖、膝、腳踝是否分離、扭曲或漂移。</div><div class="row"><button id="prev">上一動作</button><button id="next">下一動作</button><button id="cycle">自動輪播</button><button id="rotate">自動旋轉</button><button id="skeleton">骨架線</button></div></div>
<div class="divider"></div><div class="labels"><div class="card" data-rig="kenney"><div class="name">左｜Kenney CC0</div><div id="leftStatus">載入中…</div></div><div class="card" data-rig="quaternius"><div class="name">右｜Quaternius CC0</div><div id="rightStatus">載入中…</div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';
const MODELS={left:'https://raw.githubusercontent.com/eturner58/game-assets/main/kenney/3D%20assets/Blocky%20Characters/Models/GLB%20format/character-a.glb',right:'https://raw.githubusercontent.com/UMRAM-Bilkent/supine-human-model/main/assets/human.glb'};
const scene=new THREE.Scene();scene.background=new THREE.Color(0xdcecf6);
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.01,100);camera.position.set(0,2.35,7.2);camera.lookAt(0,1.15,0);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x68807a,2.1));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(4,7,5);scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(9,5),new THREE.MeshStandardMaterial({color:0xeaf3df,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.01;scene.add(floor);const grid=new THREE.GridHelper(9,18,0x81949e,0xb9c7cd);grid.position.y=0;scene.add(grid);
const state={left:{x:-1.65,status:document.getElementById('leftStatus')},right:{x:1.65,status:document.getElementById('rightStatus')}};let index=0,cycling=false,spinning=false,showSkeleton=false,cycleT=0;
function describe(s){if(s.error){s.status.innerHTML='<span class="fail">FAIL：載入失敗</span><br>'+s.error;return}if(!s.root){s.status.textContent='載入中…';return}let bones=0,skin=0;s.root.traverse(o=>{if(o.isBone)bones++;if(o.isSkinnedMesh)skin++});const len=s.clips?.length||0;const ci=len?index%len:0;const clip=s.clips?.[ci];s.status.innerHTML=`Bones ${bones}｜Skinned ${skin}｜Clips ${len}<br>目前：${clip?.name||'無動畫'}`}
function normalize(root,x){const box=new THREE.Box3().setFromObject(root),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());const scale=2.55/Math.max(size.y,.001);root.scale.setScalar(scale);root.position.set(-center.x*scale+x,-box.min.y*scale,-center.z*scale)}
function setClip(s,i){if(!s.mixer||!s.clips?.length){describe(s);return}const ci=(i+s.clips.length)%s.clips.length;const next=s.mixer.clipAction(s.clips[ci]);if(s.active&&s.active!==next)s.active.fadeOut(.16);next.reset().fadeIn(.16).play();s.active=next;describe(s)}
function setIndex(i){index=Math.max(0,i);Object.values(state).forEach(s=>setClip(s,index))}
function toggleSkeleton(s,on){if(!s.root)return;if(on&&!s.helper){s.helper=new THREE.SkeletonHelper(s.root);scene.add(s.helper)}else if(!on&&s.helper){scene.remove(s.helper);s.helper.dispose?.();s.helper=null}}
const loader=new GLTFLoader();for(const [key,url] of Object.entries(MODELS)){const s=state[key];loader.load(url,g=>{s.root=g.scene;normalize(s.root,s.x);scene.add(s.root);s.mixer=new THREE.AnimationMixer(s.root);s.clips=g.animations||[];setClip(s,index);toggleSkeleton(s,showSkeleton)},undefined,e=>{s.error=e?.message||String(e);describe(s)})}
document.getElementById('prev').onclick=()=>setIndex(Math.max(0,index-1));document.getElementById('next').onclick=()=>setIndex(index+1);document.getElementById('cycle').onclick=e=>{cycling=!cycling;e.currentTarget.classList.toggle('on',cycling);cycleT=0};document.getElementById('rotate').onclick=e=>{spinning=!spinning;e.currentTarget.classList.toggle('on',spinning)};document.getElementById('skeleton').onclick=e=>{showSkeleton=!showSkeleton;e.currentTarget.classList.toggle('on',showSkeleton);Object.values(state).forEach(s=>toggleSkeleton(s,showSkeleton))};
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);for(const s of Object.values(state)){s.mixer?.update(dt);if(s.root&&spinning)s.root.rotation.y+=dt*.55}if(cycling&&(cycleT+=dt)>3.5){cycleT=0;setIndex(index+1)}renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
