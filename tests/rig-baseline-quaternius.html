<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AG Rig Baseline｜Quaternius CC0</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dff1e3;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}canvas{display:block;width:100%;height:100%}.hud{position:fixed;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));z-index:5;width:min(370px,88vw);background:#fffdf2ee;border-radius:14px;padding:10px;box-shadow:0 4px 18px #0003;color:#304b56}.hud h1{font-size:16px;margin:0 0 6px}.meta{font-size:11px;line-height:1.45;margin-bottom:8px}.row{display:flex;gap:6px;flex-wrap:wrap}.row button,.row select{border:0;border-radius:10px;padding:8px 10px;background:#fff;font-weight:800;color:#304b56}.row button.on{background:#ffe27a}.status{margin-top:8px;font-size:11px;line-height:1.45;white-space:pre-wrap}.note{opacity:.7;font-size:10px;margin-top:6px}.badge{display:inline-block;background:#e7f4df;border-radius:999px;padding:3px 7px;margin:2px 2px 0 0}
</style>
</head>
<body>
<div class="hud">
  <h1>AG 骨架基線測試｜Quaternius CC0</h1>
  <div class="meta">獨立測試，不替換正式 V0.5.10 角色。<br>來源：Quaternius CC0 Human（UMRAM/Bilkent 保存版本）。</div>
  <div class="row"><select id="anim"></select><button id="play">播放</button><button id="cycle">自動輪播</button><button id="rotate">自動旋轉</button><button id="skeleton">骨架線</button></div>
  <div id="badges"></div>
  <div id="status" class="status">模型載入中…</div>
  <div class="note">驗證重點：肩／肘／手腕／髖／膝／腳踝在動作過程不得分離。此頁只驗 Rig／Skinning／動畫，不評角色美術。</div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';

const MODEL='https://raw.githubusercontent.com/UMRAM-Bilkent/supine-human-model/main/assets/human.glb';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xdff1e3);
const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.01,100);camera.position.set(3.2,2.5,5.8);camera.lookAt(0,1.2,0);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x668866,2.2));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(4,7,5);sun.castShadow=true;scene.add(sun);
const floor=new THREE.Mesh(new THREE.CircleGeometry(3.2,48),new THREE.MeshStandardMaterial({color:0xe7f2df,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(6,12,0x668899,0x99aabb);grid.position.y=.004;scene.add(grid);

const status=document.getElementById('status'),animSel=document.getElementById('anim'),badges=document.getElementById('badges');
let root,mixer,clips=[],active,spin=false,cycling=false,cycleTimer=0,cycleIndex=0,helper=null;
function setStatus(extra=''){
  const boneCount=root?(()=>{let n=0;root.traverse(o=>{if(o.isBone)n++});return n})():0;
  const skinned=root?(()=>{let n=0;root.traverse(o=>{if(o.isSkinnedMesh)n++});return n})():0;
  status.textContent=`骨骼：${boneCount}\nSkinnedMesh：${skinned}\n動畫：${clips.length}${active?`\n目前：${active.getClip().name}`:''}${extra?`\n${extra}`:''}`;
}
function playClip(i){if(!clips.length)return;cycleIndex=(i+clips.length)%clips.length;animSel.selectedIndex=cycleIndex;const next=mixer.clipAction(clips[cycleIndex]);if(active&&active!==next)active.fadeOut(.18);next.reset().fadeIn(.18).play();active=next;setStatus();}
new GLTFLoader().load(MODEL,g=>{
  root=g.scene;scene.add(root);root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
  const box=new THREE.Box3().setFromObject(root),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());root.position.sub(center);root.position.y+=size.y/2;
  const targetHeight=2.6,scale=targetHeight/Math.max(size.y,.001);root.scale.setScalar(scale);
  mixer=new THREE.AnimationMixer(root);clips=g.animations||[];
  animSel.innerHTML=clips.map((c,i)=>`<option value="${i}">${i+1}. ${c.name||'Animation '+(i+1)}</option>`).join('');
  let bones=0,skinned=0;root.traverse(o=>{if(o.isBone)bones++;if(o.isSkinnedMesh)skinned++});
  badges.innerHTML=`<span class="badge">Bones ${bones}</span><span class="badge">Skinned ${skinned}</span><span class="badge">Clips ${clips.length}</span>`;
  if(clips.length)playClip(0);else setStatus('⚠️ GLB 未包含動畫 clip');
},e=>{if(e.total)status.textContent=`下載 ${Math.round(e.loaded/e.total*100)}%`;},err=>{console.error(err);status.textContent='FAIL：模型載入失敗\n'+(err?.message||err)});

document.getElementById('play').onclick=()=>playClip(Number(animSel.value)||0);animSel.onchange=()=>playClip(Number(animSel.value)||0);
document.getElementById('cycle').onclick=e=>{cycling=!cycling;e.currentTarget.classList.toggle('on',cycling);cycleTimer=0};
document.getElementById('rotate').onclick=e=>{spin=!spin;e.currentTarget.classList.toggle('on',spin)};
document.getElementById('skeleton').onclick=e=>{if(!root)return;if(helper){scene.remove(helper);helper.dispose?.();helper=null;e.currentTarget.classList.remove('on')}else{helper=new THREE.SkeletonHelper(root);scene.add(helper);e.currentTarget.classList.add('on')}};
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);mixer?.update(dt);if(root&&spin)root.rotation.y+=dt*.55;if(cycling&&clips.length){cycleTimer+=dt;if(cycleTimer>3.2){cycleTimer=0;playClip(cycleIndex+1)}}renderer.render(scene,camera)}loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
