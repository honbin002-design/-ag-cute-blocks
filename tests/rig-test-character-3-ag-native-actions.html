<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AG｜角色3 原生 Fish / Sleep</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef7f3;font-family:system-ui,-apple-system,sans-serif}canvas{display:block}.hud{position:fixed;z-index:3;top:10px;left:10px;width:min(430px,92vw);max-height:90vh;overflow:auto;background:#fffef2ee;padding:10px;border-radius:14px;color:#31433d}.hud h1{font-size:16px;margin:0 0 5px}.small,.status{font-size:11px;line-height:1.45}.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}button{border:0;border-radius:9px;padding:9px 12px;background:#fff;font-weight:800}button.on{background:#cdeedc}.status{white-space:pre-wrap;margin-top:7px}</style></head><body><div class="hud"><h1>AG 角色3｜原生 Fish / Sleep</h1><div class="small">不借用語意不符的第三方 clip。這兩個動作由 AG 直接針對角色3已驗證的 65-joint humanoid 骨架生成。此頁只做視覺驗證，尚未替換正式角色。</div><div class="row"><button data-act="fish">Fish 釣魚</button><button data-act="sleep">Sleep 睡眠</button><button data-act="idle">回原姿勢</button><button id="skel">骨架線</button><button id="spin">旋轉</button></div><div id="status" class="status">載入角色3…</div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';import{GLTFLoader}from'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';const FEMALE='https://raw.githubusercontent.com/agentkaerf/FreeModels/main/Universal%20Animation%20Library%202%5BStandard%5D/Female%20Mannequin/Unreal-Godot/Mannequin_F.glb';const scene=new THREE.Scene();scene.background=new THREE.Color(0xeef7f3);const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);camera.position.set(3.4,2.5,5.8);camera.lookAt(0,1.05,0);const r=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.setSize(innerWidth,innerHeight);document.body.prepend(r.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x72857c,2.4));const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(4,6,4);scene.add(dl);const floor=new THREE.Mesh(new THREE.CircleGeometry(3.4,48),new THREE.MeshStandardMaterial({color:0xf5f1df}));floor.rotation.x=-Math.PI/2;scene.add(floor);const status=document.getElementById('status'),loader=new GLTFLoader();let model,mixer,action,helper,spinning=false;const restQ={},restP={};function qDelta(name,x=0,y=0,z=0){const o=model.getObjectByName(name);if(!o)return null;const base=restQ[name].clone(),d=new THREE.Quaternion().setFromEuler(new THREE.Euler(x,y,z,'XYZ'));return base.multiply(d)}function qTrack(name,times,rots){if(!model.getObjectByName(name))return null;const vals=[];for(const e of rots){const q=qDelta(name,...e);vals.push(q.x,q.y,q.z,q.w)}return new THREE.QuaternionKeyframeTrack(name+'.quaternion',times,vals)}function pTrack(name,times,offs){if(!model.getObjectByName(name))return null;const b=restP[name],vals=[];for(const o of offs)vals.push(b.x+o[0],b.y+o[1],b.z+o[2]);return new THREE.VectorKeyframeTrack(name+'.position',times,vals)}function fishClip(){const t=[0,0.45,0.95,1.45,2.15,2.8,3.4,4.0],tr=[];const add=x=>x&&tr.push(x);add(qTrack('spine_02',t,[[0,0,0],[-.12,0,.05],[.09,0,-.03],[.02,0,0],[.03,0,.02],[.02,0,-.02],[.03,0,.02],[0,0,0]]));add(qTrack('upperarm_l',t,[[0,0,-.35],[-.65,.1,-.55],[-.15,.1,-.4],[-.05,.1,-.38],[-.08,.08,-.35],[-.02,.12,-.4],[-.08,.08,-.35],[0,0,-.35]]));add(qTrack('lowerarm_l',t,[[-.75,0,0],[-1.15,0,0],[-.75,0,0],[-.65,0,0],[-.75,0,.05],[-.58,0,-.05],[-.75,0,.05],[-.75,0,0]]));add(qTrack('upperarm_r',t,[[0,0,.35],[-.55,-.1,.48],[-.12,-.1,.38],[-.04,-.1,.36],[-.1,-.08,.34],[-.02,-.12,.4],[-.1,-.08,.34],[0,0,.35]]));add(qTrack('lowerarm_r',t,[[-.8,0,0],[-1.2,0,0],[-.8,0,0],[-.7,0,0],[-.55,0,-.08],[-.85,0,.08],[-.55,0,-.08],[-.8,0,0]]));add(qTrack('hand_r',t,[[0,0,0],[0,0,.25],[0,0,.05],[0,0,0],[0,.1,.18],[0,-.1,-.15],[0,.1,.18],[0,0,0]]));add(qTrack('hand_l',t,[[0,0,0],[0,0,-.18],[0,0,-.05],[0,0,0],[0,-.08,-.08],[0,.08,.08],[0,-.08,-.08],[0,0,0]]));add(qTrack('Head',t,[[0,0,0],[-.05,0,0],[.03,0,0],[-.04,.06,0],[-.05,-.04,0],[-.04,.05,0],[-.05,-.04,0],[0,0,0]]));return new THREE.AnimationClip('AG_Fish_Rod_Loop',4,tr)}function sleepClip(){const t=[0,1.2,2.0,3.2,4.4],tr=[];const add=x=>x&&tr.push(x);add(qTrack('root',t,[[0,0,0],[0,0,-1.35],[0,0,-1.5],[0,0,-1.5],[0,0,-1.5]]));add(pTrack('root',t,[[0,0,0],[0,-.15,0],[0,-.28,0],[0,-.28,0],[0,-.28,0]]));add(qTrack('spine_01',t,[[0,0,0],[0,.08,.03],[.05,.12,.04],[.05,.12,.04],[.05,.12,.04]]));add(qTrack('spine_03',t,[[0,0,0],[.02,-.08,-.05],[.08,-.12,-.08],[.08,-.12,-.08],[.08,-.12,-.08]]));add(qTrack('Head',t,[[0,0,0],[.05,.1,.08],[.12,.18,.12],[.1,.18,.12],[.12,.18,.12]]));add(qTrack('upperarm_l',t,[[0,0,0],[-.55,.1,-.25],[-.9,.12,-.35],[-.88,.12,-.35],[-.9,.12,-.35]]));add(qTrack('lowerarm_l',t,[[0,0,0],[-.8,0,.08],[-1.15,0,.12],[-1.12,0,.12],[-1.15,0,.12]]));add(qTrack('upperarm_r',t,[[0,0,0],[-.25,-.12,.45],[-.5,-.12,.65],[-.48,-.12,.65],[-.5,-.12,.65]]));add(qTrack('lowerarm_r',t,[[0,0,0],[-.5,0,-.1],[-.75,0,-.15],[-.72,0,-.15],[-.75,0,-.15]]));add(qTrack('thigh_l',t,[[0,0,0],[.18,.04,-.05],[.35,.08,-.1],[.34,.08,-.1],[.35,.08,-.1]]));add(qTrack('calf_l',t,[[0,0,0],[-.2,0,0],[-.45,0,.03],[-.43,0,.03],[-.45,0,.03]]));add(qTrack('thigh_r',t,[[0,0,0],[.08,-.04,.05],[.18,-.08,.08],[.17,-.08,.08],[.18,-.08,.08]]));add(qTrack('calf_r',t,[[0,0,0],[-.12,0,0],[-.28,0,-.03],[-.27,0,-.03],[-.28,0,-.03]]));return new THREE.AnimationClip('AG_Sleep_Side_Loop',4.4,tr)}function makeIdle(){const tr=[];for(const n of Object.keys(restQ)){const q=restQ[n];tr.push(new THREE.QuaternionKeyframeTrack(n+'.quaternion',[0,.3],[q.x,q.y,q.z,q.w,q.x,q.y,q.z,q.w]));const p=restP[n];tr.push(new THREE.VectorKeyframeTrack(n+'.position',[0,.3],[p.x,p.y,p.z,p.x,p.y,p.z]))}return new THREE.AnimationClip('AG_RestPose',.3,tr)}function play(clip,loop=true){if(action)action.fadeOut(.18);const a=mixer.clipAction(clip,model);a.reset().setLoop(loop?THREE.LoopRepeat:THREE.LoopOnce,loop?Infinity:1).fadeIn(.18).play();action=a;status.textContent=`目前：${clip.name}\nTracks：${clip.tracks.length}\n來源：AG 原生骨架動畫\n狀態：僅視覺候選，實機驗證前不得列正式 PASS`}loader.load(FEMALE,g=>{model=g.scene;scene.add(model);const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3());model.position.sub(c);model.position.y+=size.y/2;model.scale.setScalar(2.5/Math.max(size.y,.001));model.traverse(o=>{if(o.name){restQ[o.name]=o.quaternion.clone();restP[o.name]=o.position.clone()}});mixer=new THREE.AnimationMixer(model);status.textContent='角色3已載入\nFish / Sleep 原生動作已建立\n請切換動作檢查肩、肘、腕、髖、膝與躺姿是否自然'},undefined,e=>status.textContent='FAIL：'+(e?.message||e));document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{if(!model)return;const k=b.dataset.act;if(k==='fish')play(fishClip(),true);else if(k==='sleep')play(sleepClip(),true);else play(makeIdle(),false)});document.getElementById('spin').onclick=e=>{spinning=!spinning;e.currentTarget.classList.toggle('on',spinning)};document.getElementById('skel').onclick=e=>{if(!model)return;if(helper){scene.remove(helper);helper.dispose?.();helper=null;e.currentTarget.classList.remove('on')}else{helper=new THREE.SkeletonHelper(model);scene.add(helper);e.currentTarget.classList.add('on')}};const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const d=Math.min(clock.getDelta(),.05);mixer?.update(d);if(model&&spinning)model.rotation.y+=d*.5;r.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})</script></body></html>
