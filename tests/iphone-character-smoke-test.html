<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AG iPhone 角色載入診斷</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eaf4ff;font-family:system-ui,-apple-system,sans-serif}canvas{display:block}.hud{position:fixed;z-index:4;left:10px;top:10px;right:10px;background:#fffff2ee;border-radius:14px;padding:10px;color:#263944}.title{font-weight:900}.bar{height:10px;background:#ddd;border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;width:0;background:#6a9}.s{font-size:12px;white-space:pre-wrap;line-height:1.45}button{border:0;border-radius:10px;padding:9px 12px;font-weight:800;margin-top:8px}</style></head><body><div class="hud"><div class="title">AG｜iPhone 角色載入診斷</div><div class="bar"><i id="bar"></i></div><div id="s" class="s">步驟 1/4：初始化 WebGL…</div><button id="retry" hidden>重新測試</button></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';import{GLTFLoader}from'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';const URL='https://raw.githubusercontent.com/agentkaerf/FreeModels/main/Universal%20Animation%20Library%202%5BStandard%5D/Female%20Mannequin/Unreal-Godot/Mannequin_F.glb';const s=document.getElementById('s'),bar=document.getElementById('bar'),retry=document.getElementById('retry');let renderer,scene,camera,root;function st(n,t){bar.style.width=(n*25)+'%';s.textContent=`步驟 ${n}/4：${t}`}function fail(where,e){s.textContent=`FAIL｜${where}\n${e?.message||e||'未知錯誤'}\n\n這表示卡點已被定位，不會再無限顯示載入中。`;retry.hidden=false}async function run(){retry.hidden=true;try{st(1,'初始化 WebGL…');renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);scene=new THREE.Scene();scene.background=new THREE.Color(0xeaf4ff);camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);camera.position.set(3,2.2,5);camera.lookAt(0,1.1,0);scene.add(new THREE.HemisphereLight(0xffffff,0x667788,2.5));st(2,'下載測試角色3 GLB…');const res=await fetch(URL,{cache:'no-store'});if(!res.ok)throw new Error(`HTTP ${res.status}`);const len=Number(res.headers.get('content-length'))||0;const reader=res.body?.getReader();let data;if(reader){let got=0,chunks=[];while(true){const{x:value,done}=await reader.read();if(done)break;chunks.push(value);got+=value.length;if(len){bar.style.width=(25+got/len*25)+'%';s.textContent=`步驟 2/4：下載 GLB ${(got/1048576).toFixed(2)} / ${(len/1048576).toFixed(2)} MB`}}const all=new Uint8Array(got);let p=0;for(const c of chunks){all.set(c,p);p+=c.length}data=all.buffer}else data=await res.arrayBuffer();st(3,'解析 GLB／骨架…');const gltf=await new Promise((ok,no)=>new GLTFLoader().parse(data,'',ok,no));root=gltf.scene;let bones=0,skin=0;root.traverse(o=>{if(o.isBone)bones++;if(o.isSkinnedMesh)skin++});const box=new THREE.Box3().setFromObject(root),sz=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3());root.position.sub(c);root.position.y+=sz.y/2;root.scale.setScalar(2.5/Math.max(sz.y,.001));scene.add(root);st(4,`完成 ✓\nBones：${bones}｜SkinnedMesh：${skin}\n如果你看得到人物，代表 iPhone 可正常下載＋解析這個 GLB。`);function loop(){requestAnimationFrame(loop);if(root)root.rotation.y+=.004;renderer.render(scene,camera)}loop()}catch(e){fail('載入測試',e)}}retry.onclick=()=>location.reload();run();</script></body></html>
