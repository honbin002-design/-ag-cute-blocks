<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AG iPhone 角色載入診斷 V3</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eaf4ff;font-family:system-ui,-apple-system,sans-serif}.hud{position:fixed;z-index:4;left:10px;top:10px;right:10px;background:#fffff2ee;border-radius:14px;padding:10px;color:#263944}.title{font-weight:900}.bar{height:10px;background:#ddd;border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;width:0;background:#6a9}.s{font-size:12px;white-space:pre-wrap;line-height:1.45}button{border:0;border-radius:10px;padding:9px 12px;font-weight:800;margin-top:8px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><div class="hud"><div class="title">AG｜iPhone 角色載入診斷 V3</div><div class="bar"><i id="bar"></i></div><div id="s" class="s">步驟 0/5：頁面 JavaScript 已啟動</div><button id="retry" hidden>重新測試</button></div><script>const S=document.getElementById('s'),B=document.getElementById('bar'),R=document.getElementById('retry');function st(n,t){B.style.width=(n*20)+'%';S.textContent=`步驟 ${n}/5：${t}`}function fail(w,e){S.textContent=`FAIL｜${w}\n${e&&e.message?e.message:e||'未知錯誤'}`;R.hidden=false}window.onerror=(m,u,l)=>fail('JavaScript',`${m}\n${u||''}:${l||''}`);window.onunhandledrejection=e=>fail('Promise',e.reason);R.onclick=()=>location.reload();(async()=>{try{st(1,'載入 Three.js 模組…');const THREE=await import('three');st(2,'載入 GLTFLoader 模組…');const {GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js');st(3,'初始化 WebGL…');const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color(0xeaf4ff);const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);camera.position.set(3,2.2,5);camera.lookAt(0,1.1,0);scene.add(new THREE.HemisphereLight(0xffffff,0x667788,2.5));st(4,'下載測試角色3 GLB…');const URL='https://raw.githubusercontent.com/agentkaerf/FreeModels/main/Universal%20Animation%20Library%202%5BStandard%5D/Female%20Mannequin/Unreal-Godot/Mannequin_F.glb';const res=await fetch(URL,{cache:'no-store'});if(!res.ok)throw new Error(`GLB HTTP ${res.status}`);const data=await res.arrayBuffer();S.textContent=`步驟 4/5：GLB 已下載 ${(data.byteLength/1048576).toFixed(2)} MB，解析中…`;const gltf=await new Promise((ok,no)=>new GLTFLoader().parse(data,'',ok,no));const root=gltf.scene;let bones=0,skin=0;root.traverse(o=>{if(o.isBone)bones++;if(o.isSkinnedMesh)skin++});const box=new THREE.Box3().setFromObject(root),sz=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3());root.position.sub(c);root.position.y+=sz.y/2;root.scale.setScalar(2.5/Math.max(sz.y,.001));scene.add(root);st(5,`完成 ✓｜Bones ${bones}｜SkinnedMesh ${skin}`);function loop(){requestAnimationFrame(loop);root.rotation.y+=.004;renderer.render(scene,camera)}loop()}catch(e){fail('診斷',e)}})();</script></body></html>
