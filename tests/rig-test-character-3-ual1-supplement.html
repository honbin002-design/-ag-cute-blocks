<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AG｜角色3 UAL1 補動作</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef7f3;font-family:system-ui,-apple-system,sans-serif}canvas{display:block}.hud{position:fixed;z-index:3;top:10px;left:10px;width:min(430px,92vw);max-height:90vh;overflow:auto;background:#fffef2ee;padding:10px;border-radius:14px;color:#31433d}.hud h1{font-size:16px;margin:0 0 5px}.small,.status{font-size:11px;line-height:1.45}.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}button,select{border:0;border-radius:9px;padding:8px;background:#fff;font-weight:700}button.on{background:#cdeedc}.status{white-space:pre-wrap;margin-top:7px}</style></head><body><div class="hud"><h1>AG 角色3｜UAL1 補動作相容性</h1><div class="small">Female Mannequin + UAL1 Standard 驗證副本。只驗證缺口：Run / Sit / Swim / Interact / Roll。Sleep、Fish 目前仍缺，不得冒充。</div><div class="row"><select id="anim"></select><button id="play">播放</button><button id="cycle">輪播</button><button id="skel">骨架線</button><button id="spin">旋轉</button></div><div class="row"><button data-name="Jog_Fwd_Loop">Jog</button><button data-name="Sprint_Loop">Sprint</button><button data-name="Sitting_Enter">Sit Enter</button><button data-name="Sitting_Idle_Loop">Sit Idle</button><button data-name="Sitting_Exit">Sit Exit</button><button data-name="Swim_Fwd_Loop">Swim</button><button data-name="Swim_Idle_Loop">Swim Idle</button><button data-name="Interact">Interact</button><button data-name="Roll">Roll</button></div><div id="status" class="status">載入角色3與 UAL1…</div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';import{GLTFLoader}from'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';const FEMALE='https://raw.githubusercontent.com/agentkaerf/FreeModels/main/Universal%20Animation%20Library%202%5BStandard%5D/Female%20Mannequin/Unreal-Godot/Mannequin_F.glb';const LIB='https://raw.githubusercontent.com/Seyamalam/blood-league-kickoff/main/public/assets/vendor/quaternius/universal-animation-library.glb';const scene=new THREE.Scene();scene.background=new THREE.Color(0xeef7f3);const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);camera.position.set(3,2.2,5.5);camera.lookAt(0,1.1,0);const r=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.setSize(innerWidth,innerHeight);document.body.prepend(r.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x72857c,2.4));const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(4,6,4);scene.add(dl);const floor=new THREE.Mesh(new THREE.CircleGeometry(3,48),new THREE.MeshStandardMaterial({color:0xf5f1df}));floor.rotation.x=-Math.PI/2;scene.add(floor);const status=document.getElementById('status'),sel=document.getElementById('anim'),loader=new GLTFLoader();let root,mixer,clips=[],action,helper,cycling=false,spinning=false,t=0,i=0,diag='';function load(u){return new Promise((res,rej)=>loader.load(u,res,undefined,rej))}function trackNodeName(track){const p=track.name.lastIndexOf('.');return p>0?track.name.slice(0,p):track.name}function diagnose(){const nodes=new Set();root.traverse(o=>{if(o.name)nodes.add(o.name)});let tracks=0,matched=0;const missing=new Set();for(const c of clips){for(const tr of c.tracks){tracks++;const n=trackNodeName(tr);if(nodes.has(n)||root.getObjectByName(n))matched++;else missing.add(n)}}const pct=tracks?matched/tracks*100:0;diag=`動畫軌綁定：${matched}/${tracks}（${pct.toFixed(1)}%）\n未命中節點：${missing.size}`;diag+=pct===100?'\n✓ 結構完全命中；仍須實機看變形':'\n⚠️ 不是完全命中，不得判直接相容'}function show(extra=''){status.textContent=`UAL1 Clips：${clips.length}\n${diag}${action?'\n目前：'+action.getClip().name:''}${extra?'\n'+extra:''}`}function play(n){if(!clips.length)return;i=(n+clips.length)%clips.length;sel.selectedIndex=i;const a=mixer.clipAction(clips[i],root);if(action&&action!==a)action.fadeOut(.15);a.reset().fadeIn(.15).play();action=a;show()}function playName(name){const n=clips.findIndex(c=>c.name===name);n>=0?play(n):show('找不到 clip：'+name)}Promise.all([load(FEMALE),load(LIB)]).then(([f,l])=>{root=f.scene;scene.add(root);const box=new THREE.Box3().setFromObject(root),size=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3());root.position.sub(c);root.position.y+=size.y/2;root.scale.setScalar(2.5/Math.max(size.y,.001));mixer=new THREE.AnimationMixer(root);clips=l.animations||[];sel.innerHTML=clips.map((c,j)=>`<option value="${j}">${j+1}. ${c.name||'Animation '+(j+1)}</option>`).join('');if(!clips.length){show('FAIL：UAL1 無 AnimationClip');return}diagnose();playName('Jog_Fwd_Loop')}).catch(e=>status.textContent='FAIL：'+(e?.message||e));sel.onchange=()=>play(+sel.value);document.getElementById('play').onclick=()=>play(+sel.value);document.getElementById('cycle').onclick=e=>{cycling=!cycling;e.currentTarget.classList.toggle('on',cycling);t=0};document.getElementById('spin').onclick=e=>{spinning=!spinning;e.currentTarget.classList.toggle('on',spinning)};document.getElementById('skel').onclick=e=>{if(!root)return;if(helper){scene.remove(helper);helper.dispose?.();helper=null;e.currentTarget.classList.remove('on')}else{helper=new THREE.SkeletonHelper(root);scene.add(helper);e.currentTarget.classList.add('on')}};document.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>playName(b.dataset.name));const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const d=Math.min(clock.getDelta(),.05);mixer?.update(d);if(root&&spinning)root.rotation.y+=d*.5;if(cycling&&clips.length&&(t+=d)>3){t=0;play(i+1)}r.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})</script></body></html>
