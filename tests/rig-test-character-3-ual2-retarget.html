<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AG｜測試角色3 UAL2 相容性</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3ecff;font-family:system-ui,-apple-system,sans-serif}canvas{display:block}.hud{position:fixed;z-index:3;top:10px;left:10px;width:min(420px,92vw);max-height:90vh;overflow:auto;background:#fffef2ee;padding:10px;border-radius:14px;color:#3d3550}.hud h1{font-size:16px;margin:0 0 5px}.small,.status{font-size:11px;line-height:1.45}.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}button,select{border:0;border-radius:9px;padding:8px;background:#fff;font-weight:700}button.on{background:#ffe071}.status{white-space:pre-wrap;margin-top:7px}</style></head><body><div class="hud"><h1>AG 測試角色3｜UAL2 動作相容性</h1><div class="small">Female Mannequin + UAL2_Standard。新增自動骨骼綁定診斷：不再只看「Clip 有載入」，會計算動畫軌實際能否命中女性模型節點。</div><div class="row"><select id="anim"></select><button id="play">播放</button><button id="cycle">輪播</button><button id="skel">骨架線</button><button id="spin">旋轉</button></div><div class="row"><button data-key="idle">Idle</button><button data-key="walk">Walk</button><button data-key="run">Run</button><button data-key="jump">Jump</button><button data-key="fish">Fish</button><button data-key="farm">Farm</button><button data-key="chop">Chop</button><button data-key="attack">Attack</button><button data-key="dodge">Dodge</button></div><div id="status" class="status">載入女性模型與 UAL2 動作庫…</div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';import{GLTFLoader}from'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';const FEMALE='https://raw.githubusercontent.com/agentkaerf/FreeModels/main/Universal%20Animation%20Library%202%5BStandard%5D/Female%20Mannequin/Unreal-Godot/Mannequin_F.glb';const LIB='https://raw.githubusercontent.com/agentkaerf/FreeModels/main/Universal%20Animation%20Library%202%5BStandard%5D/Unreal-Godot/UAL2_Standard.glb';const scene=new THREE.Scene();scene.background=new THREE.Color(0xf3ecff);const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);camera.position.set(3,2.2,5.5);camera.lookAt(0,1.1,0);const r=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.setSize(innerWidth,innerHeight);document.body.prepend(r.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x777799,2.4));const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(4,6,4);scene.add(dl);const floor=new THREE.Mesh(new THREE.CircleGeometry(3,48),new THREE.MeshStandardMaterial({color:0xf5f1df}));floor.rotation.x=-Math.PI/2;scene.add(floor);const status=document.getElementById('status'),sel=document.getElementById('anim'),loader=new GLTFLoader();let root,mixer,clips=[],action,helper,cycling=false,spinning=false,t=0,i=0,diag='';function load(u){return new Promise((res,rej)=>loader.load(u,res,undefined,rej))}function stats(){let b=0,s=0;root?.traverse(o=>{if(o.isBone)b++;if(o.isSkinnedMesh)s++});return{b,s}}function trackNodeName(track){const p=track.name.lastIndexOf('.');return p>0?track.name.slice(0,p):track.name}function diagnose(){const nodes=new Set();root.traverse(o=>{if(o.name)nodes.add(o.name)});let tracks=0,matched=0;const missing=new Set();for(const c of clips){for(const tr of c.tracks){tracks++;const n=trackNodeName(tr);if(nodes.has(n)||root.getObjectByName(n))matched++;else missing.add(n)}}const pct=tracks?matched/tracks*100:0;diag=`動畫軌綁定：${matched}/${tracks}（${pct.toFixed(1)}%）\n未命中節點：${missing.size}`;if(pct<50)diag+='\n⚠️ 直接相容性偏低，不得判 PASS';else if(pct<95)diag+='\n⚠️ 部分相容，仍需檢查缺失骨骼';else diag+='\n✓ 結構高度相容，仍須實機檢查變形';}function show(extra=''){const x=stats();status.textContent=`Female Bones：${x.b}\nFemale SkinnedMesh：${x.s}\nUAL2 Clips：${clips.length}\n${diag}${action?'\n目前：'+action.getClip().name:''}${extra?'\n'+extra:''}`}function play(n){if(!clips.length)return;i=(n+clips.length)%clips.length;sel.selectedIndex=i;const a=mixer.clipAction(clips[i],root);if(action&&action!==a)action.fadeOut(.15);a.reset().fadeIn(.15).play();action=a;show()}function findClip(k){k=k.toLowerCase();return clips.findIndex(c=>(c.name||'').toLowerCase().includes(k))}Promise.all([load(FEMALE),load(LIB)]).then(([f,l])=>{root=f.scene;scene.add(root);const box=new THREE.Box3().setFromObject(root),size=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3());root.position.sub(c);root.position.y+=size.y/2;root.scale.setScalar(2.5/Math.max(size.y,.001));mixer=new THREE.AnimationMixer(root);clips=l.animations||[];sel.innerHTML=clips.map((c,j)=>`<option value="${j}">${j+1}. ${c.name||'Animation '+(j+1)}</option>`).join('');if(!clips.length){show('FAIL：UAL2 無 AnimationClip');return}diagnose();play(0)}).catch(e=>status.textContent='FAIL：'+(e?.message||e));sel.onchange=()=>play(+sel.value);document.getElementById('play').onclick=()=>play(+sel.value);document.getElementById('cycle').onclick=e=>{cycling=!cycling;e.currentTarget.classList.toggle('on',cycling);t=0};document.getElementById('spin').onclick=e=>{spinning=!spinning;e.currentTarget.classList.toggle('on',spinning)};document.getElementById('skel').onclick=e=>{if(!root)return;if(helper){scene.remove(helper);helper.dispose?.();helper=null;e.currentTarget.classList.remove('on')}else{helper=new THREE.SkeletonHelper(root);scene.add(helper);e.currentTarget.classList.add('on')}};document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{const n=findClip(b.dataset.key);n>=0?play(n):show(`找不到名稱含 ${b.dataset.key} 的 clip`) });const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const d=Math.min(clock.getDelta(),.05);mixer?.update(d);if(root&&spinning)root.rotation.y+=d*.5;if(cycling&&clips.length&&(t+=d)>3){t=0;play(i+1)}r.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})</script></body></html>
