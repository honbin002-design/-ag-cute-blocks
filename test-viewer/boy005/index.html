<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AGCB Boy005 Visual Gate</title><style>html,body{margin:0;height:100%;background:#15171b;color:#fff;font-family:system-ui}#c{width:100%;height:100%;display:block}.ui{position:fixed;left:12px;right:12px;bottom:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.ui button{font-size:16px;padding:10px 16px}.s{position:fixed;top:10px;left:10px;background:#000a;padding:8px;border-radius:8px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body><canvas id="c"></canvas><div class="s" id="s">loading</div><div class="ui"><button data-a="idle">Idle</button><button data-a="walk">Walk</button><button data-a="run">Run</button><button data-a="jump">Jump</button></div><script type="module">
import * as THREE from 'three'; import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';
const status=document.querySelector('#s'),canvas=document.querySelector('#c');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x252a31);scene.add(new THREE.HemisphereLight(0xffffff,0x444444,2.2));const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(3,5,4);scene.add(dl);
const cam=new THREE.PerspectiveCamera(35,1,.01,100);cam.position.set(2.4,1.6,3.7);cam.lookAt(0,.8,0);const grid=new THREE.GridHelper(8,16);scene.add(grid);
let mixer,actions={},current;try{const gltf=await new GLTFLoader().loadAsync('./boy005.glb');const root=gltf.scene;scene.add(root);root.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(root),sz=b.getSize(new THREE.Vector3());root.scale.multiplyScalar(1.55/sz.y);root.updateMatrixWorld(true);const b2=new THREE.Box3().setFromObject(root),ct=b2.getCenter(new THREE.Vector3());root.position.x-=ct.x;root.position.z-=ct.z;root.position.y-=b2.min.y;mixer=new THREE.AnimationMixer(root);for(const c of gltf.animations)actions[c.name.toLowerCase()]=mixer.clipAction(c);const play=n=>{const next=actions[n]||actions.idle;if(current!==next){current?.fadeOut(.12);next.reset().fadeIn(.12).play();current=next}status.textContent='V0.5.208 TEST • '+n.toUpperCase()};document.querySelectorAll('button').forEach(b=>b.onclick=()=>play(b.dataset.a));play('idle');}catch(e){status.textContent='FAIL: '+e.message;throw e}
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);mixer?.update(clock.getDelta());const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();renderer.render(scene,cam)}frame();
</script></body></html>
