name: Third camera zoom check
on:
  push:
    branches: [dev-v0.1]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify guarded third-person ultra-close camera contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app-v0504-fixed-loader.js').read_text()
          b=Path('bootstrap-v0510.js').read_text()
          t=Path('third-camera-touch-zoom-runtime.js').read_text()
          checks={
            'min 0.28':'THIRD_CAMERA_DISTANCE_MIN=0.28' in s,
            'near plane 0.05':"new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.05,260)" in s,
            'safe clearance patch':"id:'third-camera-safe-clearance'" in s and "cameraMode==='third'?.12:.7" in s,
            'safe clearance metadata':'thirdCameraCollisionClearance:0.12' in s,
            'orbit pitch bounds':'THIRD_CAMERA_PITCH_MIN=-.72' in s and 'THIRD_CAMERA_PITCH_MAX=1.16' in s,
            'document touch bridge':"bridge:'touch-to-core-wheel'" in t and "version:'0.5.74'" in t,
            'bridge sensitivity':'const wheelDelta=-delta*3.8' in t,
            'render orbit':'Math.sin(yaw)*Math.cos(thirdPitch)*thirdDistance' in s and 'Math.sin(thirdPitch)*thirdDistance' in s,
            'sit camera unlocked':"id:'furniture-camera-orbit-unlock'" in s and "playerState.mode!=='sit'" in s and 'furnitureOrbit:true' in s,
            'release v0577':'V0.5.77' in b and 'third-camera-safe-clearance-0.12' in b and 'sit-sleep-camera-orbit' in b,
          }
          bad=[k for k,v in checks.items() if not v]
          print(checks)
          if bad: raise SystemExit('FAIL: '+', '.join(bad))
          print('PASS preserved V0.5.74 camera behavior plus V0.5.77 sit/sleep furniture orbit')
          PY
