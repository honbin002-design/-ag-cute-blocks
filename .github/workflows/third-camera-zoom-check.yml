name: Third camera zoom check
on:
  push:
    branches: [dev-v0.1]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify guarded third-person zoom contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app-v0504-fixed-loader.js').read_text()
          b=Path('bootstrap-v0510.js').read_text()
          checks={
            'min 0.55':'THIRD_CAMERA_DISTANCE_MIN=0.55' in s,
            'third distance state':'thirdDistance:THIRD_CAMERA_DISTANCE_DEFAULT' in s,
            'third camera uses distance':'want=state.thirdDistance; safeCamera(' in s,
            'third pinch':'else if(viewMode===2){ state.thirdDistance=clamp(state.thirdDistance-delta*0.012,THIRD_CAMERA_DISTANCE_MIN,THIRD_CAMERA_DISTANCE_MAX); }' in s,
            'third wheel':'else if(viewMode===2){ state.thirdDistance=clamp(state.thirdDistance+e.deltaY*0.004,THIRD_CAMERA_DISTANCE_MIN,THIRD_CAMERA_DISTANCE_MAX); }' in s,
            'release v0570':'V0.5.70' in b and 'third-person-pinch-zoom-0.55' in b,
          }
          bad=[k for k,v in checks.items() if not v]
          print(checks)
          if bad: raise SystemExit('FAIL: '+', '.join(bad))
          print('PASS third-person very-close zoom contract')
          PY
