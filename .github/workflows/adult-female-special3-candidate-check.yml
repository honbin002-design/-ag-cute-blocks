name: Adult female Special3 candidate retirement check
on:
  push:
    paths:
      - 'adult-female-special3-candidate-runtime.js'
      - 'bootstrap-v045.js'
      - '.github/workflows/adult-female-special3-candidate-check.yml'
  workflow_dispatch:
jobs:
  retired-candidate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate invalid Special3 candidate remains detached
        shell: bash
        run: |
          set -euo pipefail
          test -f adult-female-special3-candidate-runtime.js
          grep -Fq "base:'Meshy_AI_Meshy_Merged_Animations.glb'" adult-female-special3-candidate-runtime.js
          grep -Fq "preservesOriginalSpecial3:true" adult-female-special3-candidate-runtime.js
          grep -Fq "The prior Special3-based adult-female candidate is intentionally NOT imported here." bootstrap-v045.js
          grep -Fq "V0.4.80 automated eight-view renders proved Special3 is an anthropomorphic animal" bootstrap-v045.js
          ! grep -Fq "import './adult-female-special3-candidate-runtime.js?v=0.4.92';" bootstrap-v045.js
          grep -Fq "import './character-asset-runtime.js?v=0.4.92';" bootstrap-v045.js
          grep -Fq "import './character-motion-fix-runtime.js?v=0.4.92';" bootstrap-v045.js
