name: Adult female Special3 visual review check
on:
  push:
    paths:
      - 'adult-female-special3-visual-review.js'
      - 'adult-female-special3-visual-review.html'
      - '.github/workflows/adult-female-special3-visual-review-check.yml'
  workflow_dispatch:
jobs:
  review-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Special3 adult female eight-view review
        shell: bash
        run: |
          set -euo pipefail
          test -f adult-female-special3-visual-review.js
          test -f adult-female-special3-visual-review.html
          grep -Fq "SPECIAL3_TOTAL_BYTES=38501928" adult-female-special3-visual-review.js
          grep -Fq "SPECIAL3_PART_COUNT=13" adult-female-special3-visual-review.js
          grep -Fq "look:'chibi-long-curled-hair-white-top-light-pants-v1'" adult-female-special3-visual-review.js
          grep -Fq "views:[0,-45,-90,-135,180,135,90,45]" adult-female-special3-visual-review.js
          grep -Fq "agcb-adult-female-long-curled-hair-review-v1" adult-female-special3-visual-review.js
          grep -Fq "V0.4.79｜Special3 GLB 成年女性候選｜八方向驗收" adult-female-special3-visual-review.js
          grep -Fq "adult-female-special3-visual-review.js?v=0.4.79" adult-female-special3-visual-review.html
          for deg in '0' '-45' '-90' '-135' '180' '135' '90' '45'; do grep -Fq "data-view=\"$deg\"" adult-female-special3-visual-review.html; done
