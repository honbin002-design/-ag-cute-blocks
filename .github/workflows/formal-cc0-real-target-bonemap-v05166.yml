name: Formal CC0 Real Target BoneMap V0.5.166
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/formal-cc0-real-target-bonemap-v05166.yml']
  workflow_dispatch:
jobs:
  real-target-bonemap:
    name: AGCB-V05166-REAL-TARGET-BONEMAP
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Acquire exact pinned target bytes
        run: |
          set -euo pipefail; mkdir -p /tmp/proj/targets
          BASE='https://raw.githubusercontent.com/BoQsc/gpu-marching-cubes/54368c0875c5f72be00160fafb040c6ce5c4e760/models/entities/player/Universal%20Base%20Characters%5BStandard%5D/Base%20Characters/Godot%20-%20UE'
          for f in Superhero_Male_FullBody.gltf Superhero_Male_FullBody.bin Superhero_Female_FullBody.gltf Superhero_Female_FullBody.bin; do curl -fL --retry 3 "$BASE/$f" -o "/tmp/proj/targets/$f"; done
          echo 'e7fcea214ecf8855afbf910b50de6f9c7d1decfb71ca28bad8a4481452dafeb4  /tmp/proj/targets/Superhero_Male_FullBody.gltf' | sha256sum -c -
          echo '459003f9745853ae562a85506a2b94dd56515c1f37728f9fa3d2ce1a3e4cd92f  /tmp/proj/targets/Superhero_Male_FullBody.bin' | sha256sum -c -
          echo 'adedf28000a0716f689b009a70314506fc62f827498f77ba852acb5610f3f3f4  /tmp/proj/targets/Superhero_Female_FullBody.gltf' | sha256sum -c -
          echo '3a8220a485b33d05d879115a50697728b45a151781106033afb8b8c243fca208  /tmp/proj/targets/Superhero_Female_FullBody.bin' | sha256sum -c -
      - name: Acquire Godot 4.5.1
        run: |
          curl -fL --retry 3 'https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip' -o /tmp/g.zip
          unzip -q /tmp/g.zip -d /tmp/godot; chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
      - name: Import and verify real skeleton BoneMap
        run: |
          cat > /tmp/proj/project.godot <<'EOF'
          [application]
          config/name="AGCB V05166"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          EOF
          /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --headless --editor --path /tmp/proj --quit-after 20
          cat > /tmp/proj/probe.gd <<'EOF'
          extends SceneTree
          var target={"Root":"root","Hips":"pelvis","Spine":"spine_01","Chest":"spine_02","UpperChest":"spine_03","Neck":"neck_01","Head":"head","LeftShoulder":"clavicle_l","LeftUpperArm":"upperarm_l","LeftLowerArm":"lowerarm_l","LeftHand":"hand_l","RightShoulder":"clavicle_r","RightUpperArm":"upperarm_r","RightLowerArm":"lowerarm_r","RightHand":"hand_r","LeftUpperLeg":"thigh_l","LeftLowerLeg":"calf_l","LeftFoot":"foot_l","LeftToes":"ball_l","RightUpperLeg":"thigh_r","RightLowerLeg":"calf_r","RightFoot":"foot_r","RightToes":"ball_r"}
          func find_skeleton(n):
              if n is Skeleton3D: return n
              for c in n.get_children():
                  var x=find_skeleton(c); if x!=null: return x
              return null
          func _initialize():
              var report={"evidenceId":"AGCB-V05166-REAL-TARGET-BONEMAP","release":"V0.5.166","environment":"TEST","prodEligible":false,"targets":{},"errors":[]}
              for sex in ["Male","Female"]:
                  var r=load("res://targets/Superhero_"+sex+"_FullBody.gltf"); var inst=r.instantiate(); var sk=find_skeleton(inst)
                  if sk==null: report.errors.append(sex+" skeleton missing"); continue
                  var names={}; for i in range(sk.get_bone_count()): names[str(sk.get_bone_name(i))]=i
                  var profile=SkeletonProfileHumanoid.new(); var bm=BoneMap.new(); bm.profile=profile; var mapped=0
                  for human in target:
                      var bone=target[human]
                      if not names.has(bone): report.errors.append(sex+" missing real bone "+bone); continue
                      bm.set_skeleton_bone_name(human,bone)
                      if str(bm.get_skeleton_bone_name(human))!=bone: report.errors.append(sex+" BoneMap mismatch "+human); continue
                      mapped+=1
                  report.targets[sex]={"boneCount":sk.get_bone_count(),"mappedCore":mapped,"root":str(sk.get_bone_name(0))}
                  if mapped!=target.size(): report.errors.append(sex+" incomplete BoneMap")
                  inst.free()
              report.gate="PASS" if report.errors.is_empty() else "FAIL"; report.nextGate="DONOR_AND_TARGET_LIVE_RETARGET" if report.errors.is_empty() else "HOLD"; report.runtimePlayback="PENDING"; report.visualDeformation="PENDING"; report.prodPromotion="HOLD"
              var f=FileAccess.open("/tmp/AGCB-V05166-REAL-TARGET-BONEMAP.json",FileAccess.WRITE); f.store_string(JSON.stringify(report,"  ")); f.close(); print(JSON.stringify(report)); quit(0 if report.errors.is_empty() else 2)
          EOF
          /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --headless --path /tmp/proj --script res://probe.gd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AGCB-V05166-REAL-TARGET-BONEMAP
          path: /tmp/AGCB-V05166-REAL-TARGET-BONEMAP.json
          retention-days: 3
