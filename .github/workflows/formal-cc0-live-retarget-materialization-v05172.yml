name: Formal CC0 Live Retarget Materialization V0.5.172
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/formal-cc0-live-retarget-materialization-v05172.yml']
  workflow_dispatch:
jobs:
  materialize:
    name: AGCB-V05172-LIVE-RETARGET-MATERIALIZATION
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Acquire pinned donor targets and Godot
        run: |
          set -euo pipefail; mkdir -p /tmp/proj/donor /tmp/proj/targets
          DB='https://raw.githubusercontent.com/J-Ponzo/gltf-universal-animation-library/e24c23cf2a1323488a3faa226ea7ea21f644b73e/glTF'; curl -fsSL "$DB/AnimationLibrary_Godot_Standard.gltf" -o /tmp/proj/donor/AnimationLibrary_Godot_Standard.gltf; curl -fsSL "$DB/AnimationLibrary_Godot_Standard.bin" -o /tmp/proj/donor/AnimationLibrary_Godot_Standard.bin
          TB='https://raw.githubusercontent.com/BoQsc/gpu-marching-cubes/54368c0875c5f72be00160fafb040c6ce5c4e760/models/entities/player/Universal%20Base%20Characters%5BStandard%5D/Base%20Characters/Godot%20-%20UE'; for f in Superhero_Male_FullBody.gltf Superhero_Male_FullBody.bin Superhero_Female_FullBody.gltf Superhero_Female_FullBody.bin; do curl -fsSL "$TB/$f" -o "/tmp/proj/targets/$f"; done
          curl -fsSL 'https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip' -o /tmp/g.zip; unzip -q /tmp/g.zip -d /tmp/g; chmod +x /tmp/g/Godot_v4.5.1-stable_linux.x86_64; printf '[application]\nconfig/name="AGCB V05172"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n' > /tmp/proj/project.godot; /tmp/g/Godot_v4.5.1-stable_linux.x86_64 --headless --editor --path /tmp/proj --quit-after 25
      - name: Materialize six target-path animation resources for both real targets
        run: |
          cat > /tmp/proj/build.gd <<'EOF'
          extends SceneTree
          var clips=["Idle","Walk","Jog_Fwd","Jump","Jump_Start","Jump_Land"]
          var bm={"root":"root","DEF-hips":"pelvis","DEF-spine.001":"spine_01","DEF-spine.002":"spine_02","DEF-spine.003":"spine_03","DEF-neck":"neck_01","DEF-head":"Head","DEF-shoulder.L":"clavicle_l","DEF-upper_arm.L":"upperarm_l","DEF-forearm.L":"lowerarm_l","DEF-hand.L":"hand_l","DEF-shoulder.R":"clavicle_r","DEF-upper_arm.R":"upperarm_r","DEF-forearm.R":"lowerarm_r","DEF-hand.R":"hand_r","DEF-thigh.L":"thigh_l","DEF-shin.L":"calf_l","DEF-foot.L":"foot_l","DEF-toe.L":"ball_l","DEF-thigh.R":"thigh_r","DEF-shin.R":"calf_r","DEF-foot.R":"foot_r","DEF-toe.R":"ball_r"}
          func walk(n,o):
              if n is AnimationPlayer:o.append(n)
              for c in n.get_children():walk(c,o)
          func _initialize():
              var root=load("res://donor/AnimationLibrary_Godot_Standard.gltf").instantiate();var ps=[];walk(root,ps);var src={}
              for ln in ps[0].get_animation_library_list():
                  var lib=ps[0].get_animation_library(ln);for an in lib.get_animation_list():src[str(an)]=lib.get_animation(an)
              DirAccess.make_dir_recursive_absolute("/tmp/out");var report={"evidenceId":"AGCB-V05172-LIVE-RETARGET-MATERIALIZATION","release":"V0.5.172","environment":"TEST","prodEligible":false,"outputs":{},"errors":[]}
              for sex in ["Male","Female"]:
                  var lib=AnimationLibrary.new();var stats={}
                  for cn in clips:
                      var a=src[cn];var b=Animation.new();b.length=a.length;b.loop_mode=a.loop_mode;var kept=0
                      for i in range(a.get_track_count()):
                          var path=str(a.track_get_path(i));var bone=path.get_slice(":",1)
                          if not bm.has(bone):continue
                          var ni=b.add_track(a.track_get_type(i));b.track_set_path(ni,NodePath("Skeleton3D:"+bm[bone]));b.track_set_interpolation_type(ni,a.track_get_interpolation_type(i));b.track_set_interpolation_loop_wrap(ni,a.track_get_interpolation_loop_wrap(i));b.track_set_enabled(ni,a.track_is_enabled(i))
                          for k in range(a.track_get_key_count(i)):b.track_insert_key(ni,a.track_get_key_time(i,k),a.track_get_key_value(i,k),a.track_get_key_transition(i,k))
                          kept+=1
                      lib.add_animation(cn,b);stats[cn]={"tracks":kept,"length":b.length};if kept!=23:report.errors.append(sex+" "+cn+" tracks "+str(kept))
                  var path="/tmp/out/AGCB_"+sex+"_CoreRetarget_v05172.tres";var err=ResourceSaver.save(lib,path);if err!=OK:report.errors.append(sex+" save failed "+str(err));report.outputs[sex]={"path":path,"clips":stats}
              root.free();report.gate="PASS" if report.errors.is_empty() else "FAIL";report.nextGate="RUNTIME_PLAYBACK_SMOKE" if report.errors.is_empty() else "HOLD";report.runtimePlayback="PENDING";report.visualDeformation="PENDING";report.prodPromotion="HOLD";var f=FileAccess.open("/tmp/out/AGCB-V05172-LIVE-RETARGET-MATERIALIZATION.json",FileAccess.WRITE);f.store_string(JSON.stringify(report,"  "));f.close();print(JSON.stringify(report));quit(0 if report.errors.is_empty() else 2)
          EOF
          /tmp/g/Godot_v4.5.1-stable_linux.x86_64 --headless --path /tmp/proj --script res://build.gd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AGCB-V05172-LIVE-RETARGET-MATERIALIZATION
          path: /tmp/out/
          retention-days: 3
