name: Patch character switch atomicity
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-character-switch-atomic.yml']
permissions:
  contents: write
jobs:
  patch-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v0.1
          fetch-depth: 0
      - name: Verify atomic switch and synchronize V0.4.92 entry
        run: |
          node --check character-asset-runtime.js
          grep -q 'u.assetRequestId!==requestId' character-asset-runtime.js
          grep -q 'if(u.visual)u.visual.visible=false' character-asset-runtime.js
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); pairs=[('content=\"V0.4.91\"','content=\"V0.4.92\"'),('<small>V0.4.91</small>','<small>V0.4.92</small>'),('service-worker-register.js?v=0.4.91','service-worker-register.js?v=0.4.92'),('bootstrap-v045.js?v=0.4.91','bootstrap-v045.js?v=0.4.92')]; [(None if a in s or b in s else (_ for _ in ()).throw(AssertionError(a))) for a,b in pairs]; [None for a,b in pairs if not (s:=s.replace(a,b))]; p.write_text(s)"
          grep -q 'content="V0.4.92"' index.html
          grep -q '<small>V0.4.92</small>' index.html
          grep -q 'bootstrap-v045.js?v=0.4.92' index.html
      - name: Commit live entry sync
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'release: synchronize live entry to V0.4.92'
          git push origin HEAD:dev-v0.1
