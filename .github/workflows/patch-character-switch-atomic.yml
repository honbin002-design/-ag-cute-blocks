name: Patch character switch atomicity
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-character-switch-atomic.yml']
permissions:
  contents: write
jobs:
  patch-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v0.1
          fetch-depth: 0
      - name: Guarded atomic latest-request-wins patch
        env:
          OLD_B64: 
          NEW_B64: 
        run: |
          python3 -c "import os,base64,pathlib; p=pathlib.Path('character-asset-runtime.js'); s=p.read_text(); old=base64.b64decode(os.environ['OLD_B64']).decode(); new=base64.b64decode(os.environ['NEW_B64']).decode(); n=s.count(old); assert n==1 or (n==0 and 'u.assetRequestId!==requestId' in s), f'guard failed: {n}'; p.write_text(s.replace(old,new)) if n==1 else None"
          node --check character-asset-runtime.js
          grep -q 'u.assetRequestId!==requestId' character-asset-runtime.js
          grep -q 'if(u.visual)u.visual.visible=false' character-asset-runtime.js
      - name: Commit live patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add character-asset-runtime.js
          git commit -m 'fix: make character switching atomic and latest-request-wins'
          git push origin HEAD:dev-v0.1
