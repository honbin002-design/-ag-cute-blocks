name: AGCB V0.5.204 Formal CC0 Live Overlay Visual Gate
# TEST trigger nonce: 20260923-visual-capture-1
on:
  pull_request:
    branches: [main]
    paths:
      - 'formal-cc0-game-runtime-v05191.js'
      - '.github/workflows/formal-cc0-live-overlay-visual-v05204.yml'
  workflow_dispatch:
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated visual capture
        run: |
          set -euo pipefail
          mkdir -p /tmp/v05204
          cp formal-cc0-game-runtime-v05191.js /tmp/v05204/runtime.js
          cat > /tmp/v05204/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#ddd;font-family:Arial}.grid{display:grid;grid-template-columns:repeat(4,360px);gap:8px;padding:8px}.card{background:#fff;padding:6px}.card h3{margin:3px;font-size:16px}.card img{width:348px;height:520px;object-fit:contain;background:#eef}canvas{position:fixed;left:-9999px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body><div id="status">V0.5.204 visual gate</div><div class="grid" id="grid"></div><script type="module">
          import * as THREE from 'three';import './runtime.js';
          const states=['idle','walk','run','jump'], sexes=['male','female'], grid=document.querySelector('#grid');const result={release:'V0.5.204',captures:[],errors:[],prodPromotion:'HOLD'};
          const scene=new THREE.Scene();scene.background=new THREE.Color(0xeef2f5);scene.add(new THREE.HemisphereLight(0xffffff,0x666666,2.5));const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(3,5,4);scene.add(dl);const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(348,520);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);const cam=new THREE.PerspectiveCamera(30,348/520,.01,100);
          for(const sex of sexes){const c=await globalThis.__AGCB_FORMAL_CC0_RUNTIME.create(sex);scene.add(c.root);for(const state of states){c.play(state);for(let i=0;i<35;i++)c.update(1/60);c.root.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(c.root),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());const finite=[...size.toArray(),...center.toArray()].every(Number.isFinite);const sane=finite&&size.y>.5&&size.y<4&&size.x>0&&size.x<3&&size.z>=0&&size.z<3;if(!sane)result.errors.push(`${sex}:${state}:bounds=${size.toArray()}`);const dist=Math.max(size.y*1.55,2.4);cam.position.set(center.x,center.y,center.z+dist);cam.lookAt(center);cam.updateProjectionMatrix();renderer.render(scene,cam);const url=renderer.domElement.toDataURL('image/png');const card=document.createElement('div');card.className='card';card.innerHTML=`<h3>${sex} / ${state}</h3><img src="${url}">`;grid.appendChild(card);result.captures.push({sex,state,actual:c.action,mappedBones:c.mappedBones,size:size.toArray(),center:center.toArray(),finite,sane});if(c.action!==state)result.errors.push(`${sex}:${state}:actual=${c.action}`);if(c.mappedBones<48)result.errors.push(`${sex}:${state}:mapped=${c.mappedBones}`);}scene.remove(c.root);c.dispose?.();}
          result.gate=result.errors.length?'FAIL':'PASS';result.nextGate=result.gate==='PASS'?'HUMAN_VISUAL_REVIEW':'VISUAL_RUNTIME_FIX';globalThis.__AGCB_V05204=result;document.querySelector('#status').textContent=JSON.stringify(result);</script></body></html>
          HTML
          cat > /tmp/v05204/capture.mjs <<'JS'
          import {chromium} from 'playwright';import fs from'node:fs';const b=await chromium.launch({headless:true,args:['--use-gl=swiftshader']});const p=await b.newPage({viewport:{width:1500,height:1200}});const errors=[];p.on('pageerror',e=>errors.push(String(e)));await p.goto('http://127.0.0.1:8080',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForFunction(()=>globalThis.__AGCB_V05204?.gate,{timeout:90000});const r=await p.evaluate(()=>globalThis.__AGCB_V05204);r.pageErrors=errors;fs.writeFileSync('/tmp/v05204/report.json',JSON.stringify(r,null,2));await p.screenshot({path:'/tmp/v05204/formal-cc0-live-overlay-v05204.png',fullPage:true});console.log(JSON.stringify(r,null,2));await b.close();if(r.gate!=='PASS'||errors.length)process.exit(1);
          JS
      - name: Capture adult male female idle walk run jump
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --directory /tmp/v05204 >/tmp/v05204/http.log 2>&1 &
          npx --yes playwright@1.55.0 install chromium >/tmp/v05204/install.log 2>&1
          cd /tmp && npm init -y >/dev/null 2>&1 && npm install playwright@1.55.0 --no-save >/dev/null 2>&1
          node /tmp/v05204/capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AGCB-V05204-LIVE-OVERLAY-VISUAL
          path: |
            /tmp/v05204/formal-cc0-live-overlay-v05204.png
            /tmp/v05204/report.json
            /tmp/v05204/http.log
          retention-days: 3