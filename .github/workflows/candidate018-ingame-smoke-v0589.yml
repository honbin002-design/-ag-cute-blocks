name: Candidate 018 In-game Smoke V0.5.89
on:
  push:
    branches: [dev-v0.1]
    paths:
      - 'candidate018-game-runtime.js'
      - 'test-character-game-integration.js'
      - 'bootstrap-v0510.js'
      - 'index.html'
      - '.github/workflows/candidate018-ingame-smoke-v0589.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run full game Candidate 018 smoke
        run: |
          cat > /tmp/c018-ingame.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--disable-gpu-sandbox']});
          const page=await browser.newPage({viewport:{width:932,height:430},deviceScaleFactor:1});
          page.setDefaultTimeout(120000);
          const consoleErrors=[],pageErrors=[],failedRequests=[];
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
          page.on('pageerror',e=>pageErrors.push(String(e)));
          page.on('requestfailed',r=>failedRequests.push({url:r.url(),error:r.failure()?.errorText||''}));
          await page.addInitScript(()=>localStorage.setItem('ag_cute_blocks_test_character_v1','ual3'));
          await page.goto('http://127.0.0.1:8000/index.html?v=0.5.89',{waitUntil:'domcontentloaded',timeout:120000});
          await page.waitForFunction(()=>globalThis.__AGCB_BOOTSTRAP?.release==='V0.5.89',{timeout:120000});
          await page.waitForFunction(()=>globalThis.__AGCB_UAL_CHARACTER3_RUNTIME?.candidate==='018',{timeout:120000});
          await page.waitForFunction(()=>globalThis.__AGCB_TEST_CHARACTER_INTEGRATION?.player,{timeout:120000});
          await page.evaluate(async()=>{await globalThis.__AGCB_TEST_CHARACTER_INTEGRATION.select('ual3')});
          await page.waitForFunction(()=>globalThis.__AGCB_TEST_CHARACTER_INTEGRATION?.candidate?.mappedBones>=48,{timeout:120000});
          const settle=ms=>page.waitForTimeout(ms);
          const snap=()=>page.evaluate(()=>({release:globalThis.AG_GAME_VERSION,runtime:globalThis.__AGCB_UAL_CHARACTER3_RUNTIME?.release,candidate:globalThis.__AGCB_UAL_CHARACTER3_RUNTIME?.candidate,mappedBones:globalThis.__AGCB_TEST_CHARACTER_INTEGRATION?.candidate?.mappedBones,selected:globalThis.__AGCB_TEST_CHARACTER_INTEGRATION?.selected,locomotion:globalThis.__AGCB_TEST_CHARACTER_INTEGRATION?.locomotion,action:globalThis.__AGCB_TEST_CHARACTER_INTEGRATION?.candidate?.action,style:globalThis.__AGCB_TEST_CHARACTER_INTEGRATION?.candidate?.styleStatus,indicator:document.getElementById('agTestCharacterIndicator')?.textContent||''}));
          const states={};
          await settle(500);states.idle=await snap();
          await page.evaluate(()=>{const p=globalThis.__AGCB_TEST_CHARACTER_INTEGRATION.player;p.position.x+=0.08});await settle(140);states.walk=await snap();
          await settle(400);states.stop=await snap();
          await page.evaluate(()=>{const p=globalThis.__AGCB_TEST_CHARACTER_INTEGRATION.player;p.userData.motion='run';p.position.x+=0.10});await settle(120);states.run=await snap();
          await page.evaluate(()=>{const p=globalThis.__AGCB_TEST_CHARACTER_INTEGRATION.player;p.userData.motion='';globalThis.__AGCB_TEST_CHARACTER_INTEGRATION.force('jump',850);p.position.y+=0.08});await settle(120);states.jumpEarly=await snap();
          await settle(450);states.jumpHold=await snap();
          await page.evaluate(()=>{const p=globalThis.__AGCB_TEST_CHARACTER_INTEGRATION.player;p.position.y-=0.08});await settle(650);states.afterLand=await snap();
          await page.screenshot({path:'/tmp/candidate018-ingame-v0589.png',fullPage:true});
          const report={states,consoleErrors,pageErrors,failedRequests:failedRequests.filter(x=>!x.url.includes('favicon'))};
          fs.writeFileSync('/tmp/candidate018-ingame-v0589.json',JSON.stringify(report,null,2));
          await browser.close();
          const ok=states.idle.release==='V0.5.89'&&states.idle.candidate==='018'&&states.idle.mappedBones>=48&&states.idle.selected==='ual3'&&states.idle.action==='idle'&&states.walk.action==='walk'&&states.stop.action==='idle'&&states.run.action==='run'&&states.jumpEarly.action==='jump'&&states.jumpHold.action==='jump'&&states.afterLand.action==='idle'&&pageErrors.length===0&&consoleErrors.length===0&&report.failedRequests.length===0;
          if(!ok){console.error(JSON.stringify(report,null,2));process.exit(2)}
          console.log(JSON.stringify(report,null,2));
          JS
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/c018-ingame-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          sleep 2
          node /tmp/c018-ingame.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate018-ingame-v0589
          path: |
            /tmp/candidate018-ingame-v0589.png
            /tmp/candidate018-ingame-v0589.json
            /tmp/c018-ingame-http.log
          retention-days: 3
