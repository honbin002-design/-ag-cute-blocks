name: Install V0.5.82 world task bridge
on:
  push:
    branches: [dev-v0.1]
    paths: ['.github/workflows/one-time-v0582-world-task-bridge.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v0.1
      - name: Add guarded authoritative harvest bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app-v0504-fixed-loader.js')
          s=p.read_text()
          marker="}lifeUI.interact.onclick=interact;"
          bridge=r'''function taskObjectById(id){return objects.find(o=>String(o.userData?.id||'')===String(id||''))||null}
function listMatureCrops(){return objects.filter(o=>o.userData?.crop&&Number(o.userData.growth||0)>=.95).map(o=>({id:o.userData.id,itemId:o.userData.crop,x:o.position.x,z:o.position.z,growth:Number(o.userData.growth||0)}))}
function harvestMatureCropById(id){const o=taskObjectById(id);if(!o||!o.userData?.crop)return{ok:false,reason:'missing-crop'};if(Number(o.userData.growth||0)<.95)return{ok:false,reason:'not-ready'};const itemId=o.userData.crop;addInventory(economy,itemId,1);o.userData.growth=.15;rebuildCrop(o);changed=true;renderLife();saveSettings();saveWorld();return{ok:true,id:o.userData.id,itemId,qty:1,inventory:Number(economy.inventory[itemId]||0)}}
globalThis.__AGCB_WORLD_TASK_API={version:1,status:'AUTHORITATIVE_CORE_ONLY',inventoryOwner:'economy-system/addInventory',listMatureCrops,harvestMatureCropById};'''
          replacement=marker+"\n"+bridge
          if '__AGCB_WORLD_TASK_API' in s:
              print('bridge already installed')
          else:
              if s.count(marker)!=1: raise SystemExit(f'marker count {s.count(marker)}')
              old='''  {\n    id:'active-furniture-state-bridge',\n    from:\"const playerState={mode:'free',anchor:null,previousCamera:null};\",\n    to:\"const playerState={mode:'free',anchor:null,previousCamera:null};globalThis.__AGCB_ACTIVE_FURNITURE_STATE={version:1,get mode(){return playerState.mode},get anchor(){return playerState.anchor},get type(){return playerState.anchor?.userData?.type||''},get active(){return playerState.mode!=='free'&&!!playerState.anchor}};\"\n  }\n];'''
              new='''  {\n    id:'active-furniture-state-bridge',\n    from:\"const playerState={mode:'free',anchor:null,previousCamera:null};\",\n    to:\"const playerState={mode:'free',anchor:null,previousCamera:null};globalThis.__AGCB_ACTIVE_FURNITURE_STATE={version:1,get mode(){return playerState.mode},get anchor(){return playerState.anchor},get type(){return playerState.anchor?.userData?.type||''},get active(){return playerState.mode!=='free'&&!!playerState.anchor}};\"\n  },\n  {\n    id:'authoritative-world-task-bridge',\n    from:\"}lifeUI.interact.onclick=interact;\",\n    to:'''+repr(replacement)+'''\n  }\n];'''
              if old not in s: raise SystemExit('patch-array signature mismatch')
              s=s.replace(old,new)
              p.write_text(s)
          PY
          node --input-type=module --check < app-v0504-fixed-loader.js
      - name: Commit bridge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-v0504-fixed-loader.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: expose authoritative harvest task bridge"
          git push origin HEAD:dev-v0.1
