name: One-time V0.5.91 artificial water core

on:
  push:
    branches: [dev-v0.1]
    paths:
      - '.github/workflows/one-time-v0591-artificial-water.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v0.1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch artificial water into guarded core
        shell: python
        run: |
          from pathlib import Path

          p=Path('app-v0504-fixed-loader.js')
          s=p.read_text(encoding='utf-8')
          anchor="// Sit and lie should lock player movement, not the third-person camera."
          if s.count(anchor)!=1:
              raise SystemExit(f'loader insertion anchor mismatch: {s.count(anchor)}')
          if 'terrain-artificial-water-v0591' in s:
              raise SystemExit('V0.5.91 terrain patch already present')
          terrain_patch=r'''
// AG V0.5.91: persistent artificial water uses the existing objects/worldIndex store.
const terrainPatches=[
  {
    id:'terrain-artificial-water-v0591',
    from:"function inWater(x,z){const rx=-38+z*.1,dx=(x-42)/1.35,dz=(z+38)/.78;return Math.abs(x-rx)<7||dx*dx+dz*dz<324}",
    to:"function artificialWaterCellAt(x,z){return objects.find(o=>o.userData?.type==='waterCell'&&Math.abs(o.position.x-x)<.91&&Math.abs(o.position.z-z)<.91)||null}function removeTerrainObject(o){if(!o)return false;unregisterSolid(o);unregisterCameraTarget(o);unregisterInteractionTarget(o);unregisterBuildAimTarget(o);unregisterWorldEntity(o);world.remove(o);const i=objects.indexOf(o);if(i>=0)objects.splice(i,1);changed=true;return true}function inWater(x,z){const rx=-38+z*.1,dx=(x-42)/1.35,dz=(z+38)/.78;return Math.abs(x-rx)<7||dx*dx+dz*dz<324||!!artificialWaterCellAt(x,z)}function digTerrainAt(x,z){x=Math.round(x);z=Math.round(z);if(inWater(x,z))return{ok:false,reason:'already-water',x,z};const soil=objects.find(o=>o.userData?.tilled&&Math.abs(o.position.x-x)<.2&&Math.abs(o.position.z-z)<.2);if(soil){removeTerrainObject(soil);const water=addObject({type:'waterCell',x,z,rot:0});saveWorld();saveWorldIndex();return{ok:true,stage:'water',id:water?.userData?.id||null,x,z}}const plot=addObject({type:'soilPlot',x,z,rot:0});saveWorld();saveWorldIndex();return{ok:true,stage:'soil',id:plot?.userData?.id||null,x,z}}function listArtificialWaterCells(){return objects.filter(o=>o.userData?.type==='waterCell').map(o=>({id:o.userData.id,x:o.position.x,z:o.position.z}))}globalThis.__AGCB_TERRAIN_API={version:1,status:'PERSISTENT_ARTIFICIAL_WATER_SAME_WORLD_STORE',worldOwner:'objects/worldIndex',digAt:digTerrainAt,isWater:(x,z)=>inWater(Number(x),Number(z)),listArtificialWaterCells,removeWaterById(id){const o=objects.find(x=>x.userData?.type==='waterCell'&&String(x.userData.id)===String(id));if(!o)return{ok:false,reason:'missing-water'};removeTerrainObject(o);saveWorld();saveWorldIndex();return{ok:true,id}}}"
  },
  {
    id:'terrain-watercell-model-v0591',
    from:"}else return null;world.add(g);objects.push(g);registerWorldEntity(g,'object');",
    to:"}else if(t==='waterCell'){const w=new THREE.Mesh(new THREE.BoxGeometry(1.82,.045,1.82),mats.water);w.position.y=.015;w.receiveShadow=true;w.userData={waterCell:true,solid:false};g.add(w);g.userData.solid=false;g.userData.terrain=true;g.userData.waterCell=true}else return null;world.add(g);objects.push(g);registerWorldEntity(g,g.userData.terrain?'terrain':'object');"
  },
  {
    id:'terrain-hoe-two-stage-v0591',
    from:"if(category==='農具'&&selected==='hoe'){const x=Math.round(p.x),z=Math.round(p.z);if(inWater(x,z))return toast('水面不能開墾');if(objects.some(o=>o.userData.tilled&&Math.abs(o.position.x-x)<.2&&Math.abs(o.position.z-z)<.2))return toast('這格已經挖好土');addObject({type:'soilPlot',x,z,rot:0});toast('已用鋤頭開墾土地 ✓');return}",
    to:"if(category==='農具'&&selected==='hoe'){const r=digTerrainAt(p.x,p.z);if(!r.ok)return toast(r.reason==='already-water'?'這裡已經是水域':'目前不能挖掘');toast(r.stage==='water'?'⛏️ 再挖一層，形成水格 ✓':'已用鋤頭開墾土地；同一格再挖一次可形成水格 ✓');return}"
  }
];
for(const patch of terrainPatches){const count=source.split(patch.from).length-1;if(count!==1)throw new Error(`V0.5.91 terrain patch signature mismatch (${patch.id}): expected 1, got ${count}`);source=source.replace(patch.from,patch.to);applied.push(patch.id)}

'''
          s=s.replace(anchor,terrain_patch+anchor,1)
          p.write_text(s,encoding='utf-8')

          b=Path('bootstrap-v0510.js')
          t=b.read_text(encoding='utf-8')
          if "const release='V0.5.90'" not in t or "version:'0.5.90'" not in t:
              raise SystemExit('bootstrap V0.5.90 signature missing')
          t=t.replace('V0.5.90','V0.5.91').replace('0.5.90','0.5.91')
          target='persistent-realtime-1to3min-tree-stump-regrowth+read-only-forest-regrowth-status'
          if target not in t:
              raise SystemExit('bootstrap target anchor missing')
          t=t.replace(target,target+'+persistent-artificial-water-terrain-cells+two-stage-hoe-digging',1)
          b.write_text(t,encoding='utf-8')
      - name: Validate syntax and contract
        run: |
          node --check app-v0504-fixed-loader.js
          node --check bootstrap-v0510.js
          grep -q "terrain-artificial-water-v0591" app-v0504-fixed-loader.js
          grep -q "type:'waterCell'" app-v0504-fixed-loader.js
          grep -q "__AGCB_TERRAIN_API" app-v0504-fixed-loader.js
          grep -q "const release='V0.5.91'" bootstrap-v0510.js
          grep -q "persistent-artificial-water-terrain-cells" bootstrap-v0510.js
      - name: Commit V0.5.91
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-v0504-fixed-loader.js bootstrap-v0510.js
          git commit -m "feat(terrain): persistent artificial water cells v0.5.91"
          git push origin HEAD:dev-v0.1
