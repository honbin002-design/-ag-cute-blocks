name: Patch V0.4.98 hard cache bust
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-v0498-hard-cache-bust.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v0.1
          fetch-depth: 0
      - name: Apply V0.4.98 unique runtime URLs
        shell: python
        run: |
          from pathlib import Path
          app=Path('app-v043.js').read_text()
          app=app.replace("const VERSION='V0.4.97'","const VERSION='V0.4.98'")
          Path('app-v0498.js').write_text(app)

          boot=Path('bootstrap-v045.js').read_text()
          boot=boot.replace("./app-v043.js?v=0.4.97","./app-v0498.js?v=0.4.98")
          boot=boot.replace("0.4.97","0.4.98").replace("V0.4.97","V0.4.98")
          Path('bootstrap-v0498.js').write_text(boot)

          p=Path('index.html'); s=p.read_text()
          s=s.replace('V0.4.97','V0.4.98')
          s=s.replace('./bootstrap-v045.js?v=0.4.97','./bootstrap-v0498.js?v=0.4.98')
          s=s.replace('id="agcb-v0497-sw-retire"','id="agcb-v0498-sw-retire"')
          p.write_text(s)
      - name: Validate V0.4.98
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'V0.4.98' index.html
          grep -Fq './bootstrap-v0498.js?v=0.4.98' index.html
          grep -Fq "const VERSION='V0.4.98'" app-v0498.js
          grep -Fq "./app-v0498.js?v=0.4.98" bootstrap-v0498.js
          node --check app-v0498.js
          node --check bootstrap-v0498.js
      - name: Commit V0.4.98
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app-v0498.js bootstrap-v0498.js
          git commit -m 'release: V0.4.98 hard-bust Safari module cache with unique runtime filenames'
          git push origin HEAD:dev-v0.1
