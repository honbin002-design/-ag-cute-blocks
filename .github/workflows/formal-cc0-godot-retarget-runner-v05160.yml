name: Formal CC0 Godot Retarget Runner V0.5.160

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/formal-cc0-godot-retarget-runner-v05160.yml'
  workflow_dispatch:

jobs:
  godot-retarget-runner:
    name: AGCB-V05160-GODOT-RETARGET-RUNNER
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot editor from Ubuntu repository
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y godot3 || true
          command -v godot3 || command -v godot || true
      - name: Probe runner and lock retarget implementation contract
        shell: python
        run: |
          import json,shutil,subprocess,pathlib
          exe=shutil.which('godot4') or shutil.which('godot') or shutil.which('godot3')
          version=None
          if exe:
            p=subprocess.run([exe,'--version'],capture_output=True,text=True); version=(p.stdout or p.stderr).strip()
          report={
            'evidenceId':'AGCB-V05160-GODOT-RETARGET-RUNNER','release':'V0.5.160','environment':'TEST','prodEligible':False,
            'runnerExecutable':exe,'runnerVersion':version,
            'requiredEngine':'Godot 4 editor/headless',
            'reason':'Godot 4 retarget requires BoneMap/SkeletonProfileHumanoid and Bone Rest aware import; Godot 3 is not accepted as materialization engine.',
            'targetMapping':{'Root':'root','Hips':'pelvis','Spine':'spine_01','Chest':'spine_02','UpperChest':'spine_03','LeftUpperLeg':'thigh_l','LeftLowerLeg':'calf_l','LeftFoot':'foot_l','LeftToes':'ball_l','RightUpperLeg':'thigh_r','RightLowerLeg':'calf_r','RightFoot':'foot_r','RightToes':'ball_r','LeftShoulder':'clavicle_l','LeftUpperArm':'upperarm_l','LeftLowerArm':'lowerarm_l','LeftHand':'hand_l','RightShoulder':'clavicle_r','RightUpperArm':'upperarm_r','RightLowerArm':'lowerarm_r','RightHand':'hand_r'},
            'donorMapping':{'Root':'root','Hips':'DEF-hips','Spine':'DEF-spine.001'},
            'gate':'PASS_GODOT4_AVAILABLE' if version and version.startswith('4') else 'HOLD_GODOT4_NOT_AVAILABLE',
            'binaryMaterialization':'READY' if version and version.startswith('4') else 'BLOCKED_RUNNER_ENGINE',
            'runtimePlayback':'PENDING','visualDeformation':'PENDING','prodPromotion':'HOLD'}
          pathlib.Path('/tmp/AGCB-V05160-GODOT-RETARGET-RUNNER.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf8'); print(json.dumps(report,ensure_ascii=False,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: AGCB-V05160-GODOT-RETARGET-RUNNER
          path: /tmp/AGCB-V05160-GODOT-RETARGET-RUNNER.json
          retention-days: 3
