name: Rig baseline validation

on:
  push:
    branches: [dev-v0.1]
    paths:
      - 'tests/rig-*.html'
      - 'tests/character-test-index.html'
      - '.github/workflows/rig-baseline-check.yml'
  workflow_dispatch:

jobs:
  rig-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify rig test pages and invariants
        shell: python
        run: |
          import pathlib, sys
          required = {
            'tests/rig-baseline-compare.html': [
              'ag-rig-baseline-compare-v1','data-ready="false"','Kenney CC0','Quaternius CC0',
              'LOAD PASS','STRUCTURE FAIL','SkeletonHelper','character-a.glb','assets/human.glb'
            ],
            'tests/rig-baseline-test-character-3.html': [
              'UAL2 Female Mannequin','Mannequin_F.glb','SkeletonHelper','Bones：','SkinnedMesh：'
            ],
            'tests/rig-test-character-3-ual2-retarget.html': [
              'UAL2 動作相容性','Mannequin_F.glb','UAL2_Standard.glb','動畫軌綁定',
              '直接相容性偏低，不得判 PASS','結構高度相容','data-key="idle"','data-key="walk"',
              'data-key="run"','data-key="jump"','data-key="fish"','data-key="farm"',
              'data-key="chop"','data-key="attack"','data-key="dodge"'
            ],
            'tests/character-test-index.html': [
              '測試角色1','測試角色2','測試角色3','rig-baseline-test-character-3.html',
              'rig-test-character-3-ual2-retarget.html'
            ]
          }
          failures=[]
          for name,tokens in required.items():
            p=pathlib.Path(name)
            if not p.exists():
              failures.append(f'missing file: {name}')
              continue
            text=p.read_text(encoding='utf-8')
            for token in tokens:
              if token not in text:
                failures.append(f'{name}: missing invariant {token!r}')
          if failures:
            print('\n'.join(failures)); sys.exit(1)
          print('Rig baseline test pages and diagnostic invariants passed.')

      - name: Verify remote GLB candidates are reachable and valid GLB containers
        shell: python
        run: |
          import urllib.request, struct, sys
          urls={
            'Kenney':'https://raw.githubusercontent.com/eturner58/game-assets/main/kenney/3D%20assets/Blocky%20Characters/Models/GLB%20format/character-a.glb',
            'Quaternius':'https://raw.githubusercontent.com/UMRAM-Bilkent/supine-human-model/main/assets/human.glb',
            'UAL2 Female':'https://raw.githubusercontent.com/agentkaerf/FreeModels/main/Universal%20Animation%20Library%202%5BStandard%5D/Female%20Mannequin/Unreal-Godot/Mannequin_F.glb',
            'UAL2 Library':'https://raw.githubusercontent.com/agentkaerf/FreeModels/main/Universal%20Animation%20Library%202%5BStandard%5D/Unreal-Godot/UAL2_Standard.glb',
          }
          failures=[]
          for name,url in urls.items():
            req=urllib.request.Request(url,headers={'Range':'bytes=0-11','User-Agent':'AG-rig-baseline-check'})
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                data=r.read(12)
              if len(data)<12 or data[:4]!=b'glTF':
                failures.append(f'{name}: invalid GLB header')
                continue
              version,total=struct.unpack('<II',data[4:12])
              if version!=2 or total<=12:
                failures.append(f'{name}: unexpected GLB version/length v={version} len={total}')
              else:
                print(f'{name}: GLB v{version}, declared bytes {total}')
            except Exception as e:
              failures.append(f'{name}: fetch failed: {e}')
          if failures:
            print('\n'.join(failures)); sys.exit(1)
          print('All remote rig baseline assets are reachable GLB v2 containers.')
