name: Drive Backup Gate
on:
  push:
    branches: [dev-v0.1]
  workflow_dispatch:
jobs:
  drive-backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check current TEST Drive path
        run: |
          node --check save-drive-contract-v05100.js
          node --check save-drive-bridge-v05111.js
          node --check test-drive-backup-setup-v05104.js
      - name: Validate authenticated TEST Drive backup contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          c=Path('save-drive-contract-v05100.js').read_text(encoding='utf-8')
          d=Path('save-drive-bridge-v05111.js').read_text(encoding='utf-8')
          u=Path('test-drive-backup-setup-v05104.js').read_text(encoding='utf-8')
          b=Path('bootstrap-v0510.js').read_text(encoding='utf-8')
          i=Path('index.html').read_text(encoding='utf-8')
          failures=[]
          for token in ["const PROJECT='AG Cute Blocks'","AG Cute Blocks/SAVE/PROD","AG Cute Blocks/SAVE/TEST","envelope-environment-mismatch","test-to-prod-overwrite-forbidden","requireRemoteReadbackVerification:true","preservePreviousProd:true","allowCrossEnvironmentRead:false","allowTestToProdOverwrite:false","VERIFY_BACKWARD_COMPAT","UPLOAD_PRE_UPDATE","READBACK_PRE_UPDATE","VERIFY_REMOTE"]:
              if token not in c: failures.append('contract missing: '+token)
          for token in ["AGCB_PRIVATE_DRIVE_BRIDGE_CONFIG_V1","bridge-token-too-short","drive-endpoint-not-configured","action:'BACKUP'","action:'READBACK'","action:'LIST_HISTORY'","remote-environment-mismatch","remote-sha256-mismatch","test-bridge-requires-test-runtime","async function probe(","async function listHistory(","async function readbackHistory(","/api/agcb-drive-bridge"]:
              if token not in d: failures.append('bridge missing: '+token)
          for token in ["const ENV='TEST'","test-drive-ui-requires-test-runtime","bridge().configure","bridge().probe","bridge().backup({role:'HISTORY'})","TEST_ONLY_FIRST_RUN_SAVE_INIT_BACKUP_NO_RESTORE"]:
              if token not in u: failures.append('setup ui missing: '+token)
          for forbidden in ['localStorage.clear(', 'localStorage.removeItem(', "action:'RESTORE'", "action:'DELETE'", 'new MutationObserver']:
              if forbidden in d or forbidden in u: failures.append('client/setup contains forbidden operation: '+forbidden)
          m=re.search(r'bootstrap-v0510\.js\?v=([0-9.]+)',i)
          if not m: failures.append('current bootstrap version missing from index')
          else:
              v=m.group(1)
              for name in ['save-drive-contract-v05100.js','save-drive-bridge-v05111.js','test-drive-backup-setup-v05104.js']:
                  if f'./{name}?v={v}' not in b: failures.append(name+' current cache query missing')
              if f"const release='V{v}'" not in b or f"version:'{v}'" not in b: failures.append('bootstrap release/version owner mismatch')
          if "globalThis.AG_RUNTIME_ENVIRONMENT='TEST'" not in b: failures.append('TEST runtime binding missing')
          if failures: raise SystemExit('\n'.join(failures))
          print('Current TEST Drive BACKUP -> READBACK -> SHA path is wired; PROD/restore/delete remain disabled.')
          PY
