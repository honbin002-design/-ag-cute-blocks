name: One-time V0.5.107 TEST first-save init
on:
  push:
    branches: [dev-v0.1]
    paths:
      - '.github/workflows/one-time-v05107-test-save-init.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v0.1
      - name: Patch V0.5.107 TEST runtime
        shell: python
        run: |
          from pathlib import Path
          # app wrapper: release helper + runtime version
          p=Path('app-v0510.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("import './release-version-v05104.js';","import './release-version-v05107.js';")
          s=s.replace("runtimeVersion:'0.5.104'","runtimeVersion:'0.5.107'")
          s=s.replace('V0.5.104 keeps bootstrap','V0.5.107 keeps bootstrap')
          p.write_text(s,encoding='utf-8')

          # bootstrap: version owner remains bootstrap; add TEST first-save initializer.
          p=Path('bootstrap-v0510.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('V0.5.104','V0.5.107').replace("version:'0.5.104'","version:'0.5.107'")
          marker="'./test-drive-backup-setup-v05104.js?v=0.5.107'"
          addition=marker+",'./test-initial-save-runtime-v05107.js?v=0.5.107'"
          if marker in s and 'test-initial-save-runtime-v05107.js' not in s:
              s=s.replace(marker,addition)
          s=s.replace('+test-drive-setup-ui', '+test-drive-setup-ui+test-first-save-init')
          p.write_text(s,encoding='utf-8')

          # public index markers/cache query.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8').replace('V0.5.104','V0.5.107').replace('bootstrap-v0510.js?v=0.5.104','bootstrap-v0510.js?v=0.5.107')
          p.write_text(s,encoding='utf-8')
      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q "release-version-v05107.js" app-v0510.js
          grep -q "runtimeVersion:'0.5.107'" app-v0510.js
          grep -q "const release='V0.5.107'" bootstrap-v0510.js
          grep -q "test-initial-save-runtime-v05107.js?v=0.5.107" bootstrap-v0510.js
          grep -q '<meta name="ag-runtime-version" content="V0.5.107">' index.html
          grep -q 'AG Cute Blocks <small>V0.5.107</small>' index.html
          grep -q 'bootstrap-v0510.js?v=0.5.107' index.html
          grep -q "WORLD_KEY='ag_cute_blocks_world_v04'" test-initial-save-runtime-v05107.js
          grep -q "SETTINGS_KEY='ag_cute_blocks_settings_v048_special_models_r2'" test-initial-save-runtime-v05107.js
          ! grep -q 'PROD' test-initial-save-runtime-v05107.js || grep -q 'Never reads PROD' test-initial-save-runtime-v05107.js
      - name: Commit V0.5.107 patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v0510.js bootstrap-v0510.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(test-save): initialize canonical TEST records v0.5.107'
          git push origin HEAD:dev-v0.1
