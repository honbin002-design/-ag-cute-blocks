name: Adult female body proportion check
on:
  push:
    paths:
      - 'adult-female-body-proportion-runtime.js'
      - 'bootstrap-v045.js'
      - '.github/workflows/adult-female-body-proportion-check.yml'
  workflow_dispatch:

jobs:
  body-proportion-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate adult female body proportion v1
        run: |
          set -euo pipefail
          f='adult-female-body-proportion-runtime.js'
          b='bootstrap-v045.js'
          test -f "$f"
          grep -Fq "c?.gender==='girl'&&c?.age==='adult'" "$f"
          grep -Fq "agcb-hips" "$f"
          grep -Fq "agcb-spine" "$f"
          grep -Fq "agcb-chest" "$f"
          grep -Fq "agcb-neck" "$f"
          grep -Fq "agcb-head" "$f"
          grep -Fq "agcb-upper-arm-l" "$f"
          grep -Fq "agcb-upper-arm-r" "$f"
          grep -Fq "adult-female-balanced-body-v1" "$f"
          grep -Fq "scope:'adult-female-body-only'" "$f"
          grep -Fq "geometry:'balanced-body-v1'" "$f"
          grep -Fq "version:1" "$f"
          grep -Fq "adult-female-body-proportion-runtime.js?v=0.4.92" "$b"
          ! grep -Eq "gender==='boy'.*refineAdultFemaleBody|age==='child'.*refineAdultFemaleBody" "$f"
