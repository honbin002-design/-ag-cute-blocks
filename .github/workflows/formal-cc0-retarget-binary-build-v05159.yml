name: Formal CC0 Retarget Binary Build V0.5.159

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/formal-cc0-retarget-binary-build-v05159.yml'
  workflow_dispatch:

jobs:
  binary-build:
    name: AGCB-V05159-RETARGET-BINARY-BUILD
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned donor and verified target split archive
        run: |
          set -euo pipefail
          BASE='https://raw.githubusercontent.com/J-Ponzo/gltf-universal-animation-library/e24c23cf2a1323488a3faa226ea7ea21f644b73e'
          curl -fL --retry 3 "$BASE/glTF/AnimationLibrary_Godot_Standard.gltf" -o /tmp/ual.gltf
          curl -fL --retry 3 "$BASE/glTF/AnimationLibrary_Godot_Standard.bin" -o /tmp/ual.bin
          mkdir -p /tmp/out
      - name: Materialize deterministic retarget payloads
        shell: python
        run: |
          import json,pathlib,hashlib,struct,sys
          g=json.load(open('/tmp/ual.gltf',encoding='utf8')); donor_bin=pathlib.Path('/tmp/ual.bin').read_bytes(); nodes=g.get('nodes',[])
          mapping={'root':'root','hips':'DEF-hips','spine':'DEF-spine.001','leftThigh':'DEF-thigh.L','rightThigh':'DEF-thigh.R'}
          clips={'Idle':'Idle_Loop','Walk':'Walk_Loop','Run':'Jog_Fwd_Loop','Jump_Start':'Jump_Start','Jump_Loop':'Jump_Loop','Jump_Land':'Jump_Land'}
          names={n.get('name'):i for i,n in enumerate(nodes) if n.get('name')}; anim={a.get('name'):a for a in g.get('animations',[])}
          errors=[]
          if any(v not in names for v in mapping.values()): errors.append('mapping node missing')
          if any(v not in anim for v in clips.values()): errors.append('required clip missing')
          # V0.5.159 produces deterministic self-describing binary payloads only after the verified contract.
          # It intentionally does not claim target mesh deformation until target GLTF/BIN bytes are staged into the runner.
          outputs={}
          for sex,target_sha in [('male','e7fcea214ecf8855afbf910b50de6f9c7d1decfb71ca28bad8a4481452dafeb4'),('female','adedf28000a0716f689b009a70314506fc62f827498f77ba852acb5610f3f3f4')]:
            meta={'format':'AGCB_RETARGET_STAGE_V1','release':'V0.5.159','sex':sex,'targetGltfSha256':target_sha,'donorGltfSha256':hashlib.sha256(pathlib.Path('/tmp/ual.gltf').read_bytes()).hexdigest(),'donorBinSha256':hashlib.sha256(donor_bin).hexdigest(),'mapping':mapping,'clips':clips,'status':'STAGED_NOT_MESH_GLTF'}
            body=json.dumps(meta,sort_keys=True,separators=(',',':')).encode(); payload=b'AGCBRTG1'+struct.pack('<I',len(body))+body
            p=pathlib.Path('/tmp/out')/f'formalCc0-{sex}-retarget-v05159.agrt'; p.write_bytes(payload)
            outputs[sex]={'file':p.name,'bytes':len(payload),'sha256':hashlib.sha256(payload).hexdigest()}
          report={'evidenceId':'AGCB-V05159-RETARGET-BINARY-BUILD','release':'V0.5.159','environment':'TEST','prodEligible':False,'sourceGate':'AGCB-V05158-BINARY-MATERIALIZATION-INPUT','outputs':outputs,'binaryStage':'PASS' if not errors else 'FAIL','meshGltfMaterialization':'BLOCKED_TARGET_BYTES_NOT_STAGED','runtimePlayback':'PENDING','visualDeformation':'PENDING','prodPromotion':'HOLD','errors':errors}
          pathlib.Path('/tmp/out/AGCB-V05159-RETARGET-BINARY-BUILD.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf8'); print(json.dumps(report,ensure_ascii=False,indent=2))
          if errors: sys.exit(1)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AGCB-V05159-RETARGET-BINARY-BUILD
          path: /tmp/out
          retention-days: 3
