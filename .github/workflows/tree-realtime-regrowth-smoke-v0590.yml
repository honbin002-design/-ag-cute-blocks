name: Tree + Terrain Runtime Smoke
on:
  push:
    branches: [dev-v0.1]
    paths:
      - 'app-v0504-fixed-loader.js'
      - 'app-v0510.js'
      - 'terrain-artificial-water-preload-v0591.js'
      - 'tree-regrowth-status-runtime-v0587.js'
      - 'bootstrap-v0510.js'
      - '.github/workflows/tree-realtime-regrowth-smoke-v0590.yml'
  workflow_dispatch:

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run tree and terrain persistence smoke
        run: |
          cat > /tmp/ag-runtime-smoke.mjs <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--disable-gpu-sandbox']});
          const page=await browser.newPage({viewport:{width:932,height:430},deviceScaleFactor:1});
          page.setDefaultTimeout(120000);
          const errors={console:[],page:[],request:[]};
          page.on('console',m=>{if(m.type()==='error')errors.console.push(m.text())});
          page.on('pageerror',e=>errors.page.push(String(e)));
          page.on('requestfailed',r=>errors.request.push({url:r.url(),error:r.failure()?.errorText||''}));
          const wait=(fn,t=30000)=>page.waitForFunction(fn,null,{timeout:t});
          const seed=async objects=>{
            await page.goto('http://127.0.0.1:8000/__agcb_tree_seed__.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.evaluate(objects=>localStorage.setItem('ag_cute_blocks_world_v04',JSON.stringify({version:4.3,savedAt:Date.now(),player:{x:0,y:0,z:8,yaw:0,pitch:0},blocks:[],objects})),objects);
            await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'domcontentloaded',timeout:120000});
            await wait(()=>globalThis.__AGCB_BOOTSTRAP?.version==='0.5.91');
          };
          const report={tree:{},terrain:{}};let fatal=null,stage='init';
          try{
            stage='tree-seed';
            await seed([{id:'ci-tree-v0590',type:'tree',x:12,z:0,rot:0,treeState:'grown',regrowDay:0,regrowAt:0}]);
            await wait(()=>globalThis.__AGCB_WORLD_TASK_API?.version===4);
            await wait(()=>globalThis.__AGCB_WORLD_TASK_API?.listHarvestableTrees?.().some(x=>String(x.id)==='ci-tree-v0590'));
            stage='tree-chop';
            report.tree.chop=await page.evaluate(()=>{const api=globalThis.__AGCB_WORLD_TASK_API,t=api.listHarvestableTrees().find(x=>String(x.id)==='ci-tree-v0590'),r=api.chopTreeById(t.id),saved=JSON.parse(localStorage.getItem('ag_cute_blocks_world_v04')||'{}'),o=(saved.objects||[]).find(x=>String(x.id)===String(t.id));return{r,o,harvestable:api.listHarvestableTrees().some(x=>String(x.id)===String(t.id)),min:api.treeRegrowMinMs,max:api.treeRegrowMaxMs}});
            if(!report.tree.chop.r?.ok||report.tree.chop.r.regrowMs<60000||report.tree.chop.r.regrowMs>180000||report.tree.chop.o?.treeState!=='stump'||report.tree.chop.harvestable)throw new Error('tree chop/persist contract failed');
            stage='tree-reload';
            await page.reload({waitUntil:'domcontentloaded',timeout:120000});
            await wait(()=>globalThis.__AGCB_WORLD_TASK_API?.version===4);
            report.tree.reload=await page.evaluate(at=>{const api=globalThis.__AGCB_WORLD_TASK_API;const before=api.processTreeRegrowth(Number(at)-1);const early=api.listHarvestableTrees().some(x=>String(x.id)==='ci-tree-v0590');const after=api.processTreeRegrowth(Number(at)+1);const grown=api.listHarvestableTrees().some(x=>String(x.id)==='ci-tree-v0590');return{before,early,after,grown,saved:(JSON.parse(localStorage.getItem('ag_cute_blocks_world_v04')||'{}').objects||[])[0]||null}},report.tree.chop.r.regrowAt);
            if(report.tree.reload.early||!report.tree.reload.grown||report.tree.reload.after!==1)throw new Error('tree regrowth contract failed');

            stage='terrain-seed';
            await seed([]);
            await wait(()=>globalThis.__AGCB_TERRAIN_API?.version===1);
            report.terrain.preload=await page.evaluate(()=>globalThis.__AGCB_TERRAIN_PRELOAD||null);
            if(report.terrain.preload?.status!=='PERSISTENT_ARTIFICIAL_WATER_PATCHED'||report.terrain.preload?.applied?.length!==3)throw new Error('terrain preload missing');
            const pos={x:12,z:18};
            stage='terrain-soil';
            report.terrain.first=await page.evaluate(pos=>{const api=globalThis.__AGCB_TERRAIN_API,r=api.digAt(pos.x,pos.z),s=JSON.parse(localStorage.getItem('ag_cute_blocks_world_v04')||'{}');return{r,isWater:api.isWater(pos.x,pos.z),objects:s.objects||[]}},pos);
            if(report.terrain.first.r?.stage!=='soil'||report.terrain.first.isWater||!report.terrain.first.objects.some(o=>o.type==='soilPlot'))throw new Error('first dig must persist soil');
            stage='terrain-water';
            report.terrain.second=await page.evaluate(pos=>{const api=globalThis.__AGCB_TERRAIN_API,r=api.digAt(pos.x,pos.z),s=JSON.parse(localStorage.getItem('ag_cute_blocks_world_v04')||'{}');return{r,isWater:api.isWater(pos.x,pos.z),cells:api.listArtificialWaterCells(),objects:s.objects||[]}},pos);
            if(report.terrain.second.r?.stage!=='water'||!report.terrain.second.isWater||report.terrain.second.objects.some(o=>o.type==='soilPlot')||!report.terrain.second.objects.some(o=>o.type==='waterCell'))throw new Error('second dig must replace soil with water');
            await page.screenshot({path:'/tmp/terrain-water-v0591-after-dig.png',fullPage:true});
            stage='terrain-reload';
            await page.reload({waitUntil:'domcontentloaded',timeout:120000});
            await wait(()=>globalThis.__AGCB_TERRAIN_API?.version===1);
            report.terrain.reload=await page.evaluate(pos=>({isWater:globalThis.__AGCB_TERRAIN_API.isWater(pos.x,pos.z),cells:globalThis.__AGCB_TERRAIN_API.listArtificialWaterCells()}),pos);
            if(!report.terrain.reload.isWater||!report.terrain.reload.cells.length)throw new Error('water did not survive reload');
            stage='terrain-remove';
            report.terrain.remove=await page.evaluate(pos=>{const api=globalThis.__AGCB_TERRAIN_API,c=api.listArtificialWaterCells().find(x=>Math.round(x.x)===pos.x&&Math.round(x.z)===pos.z),r=api.removeWaterById(c?.id);return{r,isWater:api.isWater(pos.x,pos.z),cells:api.listArtificialWaterCells()}},pos);
            if(!report.terrain.remove.r?.ok||report.terrain.remove.isWater||report.terrain.remove.cells.length)throw new Error('water removal failed');
            stage='done';
          }catch(e){fatal=`${stage}: ${String(e)}`}
          const intentionalReloadAbort=x=>x.error==='net::ERR_ABORTED'&&(x.url.includes('/special-character-')||x.url.includes('/three-vrm.module.js'));
          const meaningful=errors.request.filter(x=>!intentionalReloadAbort(x)&&!x.url.includes('favicon'));
          report.stage=stage;report.fatal=fatal;report.errors=errors;report.meaningfulRequestFailures=meaningful;
          fs.writeFileSync('/tmp/ag-tree-terrain-v0591.json',JSON.stringify(report,null,2));
          await browser.close();
          const ok=!fatal&&!report.tree.reload?.early&&report.tree.reload?.grown&&report.terrain.reload?.isWater&&!report.terrain.remove?.isWater&&!errors.console.length&&!errors.page.length&&!meaningful.length;
          console.log(JSON.stringify(report,null,2));if(!ok)process.exit(2);
          JS
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/ag-runtime-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          sleep 2
          node /tmp/ag-runtime-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tree-terrain-runtime-v0591
          path: |
            /tmp/ag-tree-terrain-v0591.json
            /tmp/terrain-water-v0591-after-dig.png
            /tmp/ag-runtime-http.log
          retention-days: 3
