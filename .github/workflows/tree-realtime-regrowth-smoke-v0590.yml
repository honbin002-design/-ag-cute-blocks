name: Tree + Terrain Runtime Smoke
on:
  push:
    branches: [dev-v0.1]
    paths:
      - 'app-v0504-fixed-loader.js'
      - 'app-v0510.js'
      - 'terrain-artificial-water-preload-v0592.js'
      - 'release-version-v0593.js'
      - 'tree-regrowth-status-runtime-v0587.js'
      - '.github/workflows/tree-realtime-regrowth-smoke-v0590.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run tree, connected-water and reload-version smoke
        run: |
          cat > ./ag-runtime-smoke.mjs <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--disable-gpu-sandbox']});
          const page=await browser.newPage({viewport:{width:932,height:430},deviceScaleFactor:1});
          page.setDefaultTimeout(120000);
          const errors={console:[],page:[],request:[]};
          page.on('console',m=>{if(m.type()==='error')errors.console.push(m.text())});
          page.on('pageerror',e=>errors.page.push(String(e)));
          page.on('requestfailed',r=>errors.request.push({url:r.url(),error:r.failure()?.errorText||''}));
          const wait=(fn,t=30000)=>page.waitForFunction(fn,null,{timeout:t});
          const waitRelease=()=>wait(()=>globalThis.__AGCB_VERSION_OVERLAY?.version==='0.5.93'&&globalThis.__AGCB_BOOTSTRAP?.version==='0.5.93'&&globalThis.__AGCB_BOOTSTRAP?.versionOwner==='release-version-v0593.js');
          const seed=async(objects,player={x:0,y:0,z:8,yaw:0,pitch:0})=>{
            await page.goto('http://127.0.0.1:8000/__agcb_tree_seed__.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.evaluate(({objects,player})=>localStorage.setItem('ag_cute_blocks_world_v04',JSON.stringify({version:4.3,savedAt:Date.now(),player,blocks:[],objects})),{objects,player});
            await page.goto('http://127.0.0.1:8000/index.html?v=0.5.93',{waitUntil:'domcontentloaded',timeout:120000});
            await waitRelease();
          };
          const visible=()=>page.evaluate(()=>({badge:document.querySelector('.title small,#menuBtn small')?.textContent||'',meta:document.querySelector('meta[name="ag-runtime-version"]')?.getAttribute('content')||'',gameVersion:globalThis.AG_GAME_VERSION||'',overlay:globalThis.__AGCB_VERSION_OVERLAY?.version||'',owner:globalThis.__AGCB_BOOTSTRAP?.versionOwner||''}));
          const report={tree:{},terrain:{},release:{}};let fatal=null,stage='init';
          try{
            stage='tree-seed';
            await seed([{id:'ci-tree-v0590',type:'tree',x:12,z:0,rot:0,treeState:'grown',regrowDay:0,regrowAt:0}]);
            await wait(()=>globalThis.__AGCB_WORLD_TASK_API?.version===4);
            stage='tree-chop';
            report.tree.chop=await page.evaluate(()=>{const api=globalThis.__AGCB_WORLD_TASK_API,t=api.listHarvestableTrees().find(x=>String(x.id)==='ci-tree-v0590'),r=api.chopTreeById(t.id),saved=JSON.parse(localStorage.getItem('ag_cute_blocks_world_v04')||'{}'),o=(saved.objects||[]).find(x=>String(x.id)===String(t.id));return{r,o,harvestable:api.listHarvestableTrees().some(x=>String(x.id)===String(t.id))}});
            if(!report.tree.chop.r?.ok||report.tree.chop.r.regrowMs<60000||report.tree.chop.r.regrowMs>180000||report.tree.chop.o?.treeState!=='stump'||report.tree.chop.harvestable)throw new Error('tree chop/persist contract failed');
            stage='tree-reload';
            await page.reload({waitUntil:'domcontentloaded',timeout:120000});
            await waitRelease();
            await wait(()=>globalThis.__AGCB_WORLD_TASK_API?.version===4);
            report.tree.reload=await page.evaluate(at=>{const api=globalThis.__AGCB_WORLD_TASK_API;api.processTreeRegrowth(Number(at)-1);const early=api.listHarvestableTrees().some(x=>String(x.id)==='ci-tree-v0590');const after=api.processTreeRegrowth(Number(at)+1);const grown=api.listHarvestableTrees().some(x=>String(x.id)==='ci-tree-v0590');return{early,after,grown}},report.tree.chop.r.regrowAt);
            if(report.tree.reload.early||!report.tree.reload.grown||report.tree.reload.after!==1)throw new Error('tree regrowth contract failed');

            stage='terrain-seed';
            await seed([],{x:0,y:0,z:15,yaw:0,pitch:-0.12});
            await wait(()=>globalThis.__AGCB_TERRAIN_API?.version===2);
            report.release.before=await visible();
            if(report.release.before.badge!=='V0.5.93'||report.release.before.meta!=='V0.5.93'||report.release.before.owner!=='release-version-v0593.js')throw new Error('V0.5.93 visible release owner missing before pond');
            report.terrain.preload=await page.evaluate(()=>globalThis.__AGCB_TERRAIN_PRELOAD||null);
            if(report.terrain.preload?.status!=='CONNECTED_ARTIFICIAL_WATER_VISUALS_PATCHED'||report.terrain.preload?.applied?.length!==3)throw new Error('V0.5.92 terrain preload missing');
            const pond=[[-1,10],[0,10],[1,10],[-1,11],[0,11],[1,11]];
            stage='terrain-pond';
            report.terrain.pond=await page.evaluate(pond=>{const api=globalThis.__AGCB_TERRAIN_API,out=[];for(const [x,z] of pond){const a=api.digAt(x,z),b=api.digAt(x,z);out.push({x,z,a,b,isWater:api.isWater(x,z)})}api.refreshVisuals();const saved=JSON.parse(localStorage.getItem('ag_cute_blocks_world_v04')||'{}');return{out,cells:api.listArtificialWaterCells(),objects:saved.objects||[],visualMode:api.visualMode}},pond);
            if(report.terrain.pond.visualMode!=='neighbor-aware-perimeter-bank'||report.terrain.pond.cells.length!==6||report.terrain.pond.out.some(x=>x.a?.stage!=='soil'||x.b?.stage!=='water'||!x.isWater))throw new Error('3x2 connected pond creation failed');
            if(report.terrain.pond.objects.filter(o=>o.type==='waterCell').length!==6||report.terrain.pond.objects.some(o=>o.type==='soilPlot'))throw new Error('pond persistence shape invalid');
            await new Promise(r=>setTimeout(r,250));
            await page.screenshot({path:'/tmp/terrain-water-v0593-pond-near.png',fullPage:true});
            stage='terrain-reload';
            await page.reload({waitUntil:'domcontentloaded',timeout:120000});
            await waitRelease();
            await wait(()=>globalThis.__AGCB_TERRAIN_API?.version===2);
            report.terrain.reload=await page.evaluate(pond=>{const api=globalThis.__AGCB_TERRAIN_API;api.refreshVisuals();return{cells:api.listArtificialWaterCells(),allWater:pond.every(([x,z])=>api.isWater(x,z))}},pond);
            report.release.afterReload=await visible();
            if(report.release.afterReload.badge!=='V0.5.93'||report.release.afterReload.meta!=='V0.5.93'||report.release.afterReload.gameVersion!=='V0.5.93'||report.release.afterReload.overlay!=='0.5.93'||report.release.afterReload.owner!=='release-version-v0593.js')throw new Error('visible release regressed after reload');
            if(report.terrain.reload.cells.length!==6||!report.terrain.reload.allWater)throw new Error('3x2 pond did not survive reload');
            await new Promise(r=>setTimeout(r,250));
            await page.screenshot({path:'/tmp/terrain-water-v0593-pond-reload.png',fullPage:true});
            stage='terrain-remove';
            report.terrain.remove=await page.evaluate(()=>{const api=globalThis.__AGCB_TERRAIN_API,c=api.listArtificialWaterCells().find(x=>Math.round(x.x)===0&&Math.round(x.z)===10),r=api.removeWaterById(c?.id);return{r,isWater:api.isWater(0,10),count:api.listArtificialWaterCells().length}});
            if(!report.terrain.remove.r?.ok||report.terrain.remove.isWater||report.terrain.remove.count!==5)throw new Error('single pond cell removal failed');
            stage='done';
          }catch(e){fatal=`${stage}: ${String(e)}`}
          const intentionalReloadAbort=x=>x.error==='net::ERR_ABORTED'&&(x.url.includes('/special-character-')||x.url.includes('/three-vrm.module.js'));
          const meaningful=errors.request.filter(x=>!intentionalReloadAbort(x)&&!x.url.includes('favicon'));
          report.stage=stage;report.fatal=fatal;report.errors=errors;report.meaningfulRequestFailures=meaningful;
          fs.writeFileSync('/tmp/ag-tree-terrain-v0593.json',JSON.stringify(report,null,2));
          await browser.close();
          const ok=!fatal&&report.tree.reload?.grown&&report.terrain.reload?.allWater&&report.terrain.reload?.cells?.length===6&&report.terrain.remove?.count===5&&report.release.afterReload?.badge==='V0.5.93'&&!errors.console.length&&!errors.page.length&&!meaningful.length;
          console.log(JSON.stringify(report,null,2));if(!ok)process.exit(2);
          JS
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/ag-runtime-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          sleep 2
          node ./ag-runtime-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tree-terrain-runtime-v0593
          path: |
            /tmp/ag-tree-terrain-v0593.json
            /tmp/terrain-water-v0593-*.png
            /tmp/ag-runtime-http.log
          retention-days: 3

  repair-stale-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v0.1
          fetch-depth: 0
      - name: Rebase to latest branch head
        run: git pull --rebase origin dev-v0.1
      - name: Update stale release-owner assertions only
        shell: python
        run: |
          from pathlib import Path
          files=[
            Path('.github/workflows/js-syntax.yml'),
            Path('.github/workflows/building-extension-check.yml'),
            Path('.github/workflows/fishing-ecology-check.yml'),
          ]
          old="versionOwner:'bootstrap-v0510.js'"
          new="versionOwner:'release-version-v0593.js'"
          total=0
          for p in files:
            s=p.read_text(encoding='utf-8')
            n=s.count(old)
            if n<1: raise SystemExit(f'{p}: expected at least one stale versionOwner assertion, found {n}')
            p.write_text(s.replace(old,new),encoding='utf-8')
            print(f'{p}: replaced {n} stale owner assertion(s)')
            total+=n
          p=Path('.github/workflows/tree-resource-integrity-check.yml')
          s=p.read_text(encoding='utf-8')
          old_tree='for token in ["const release=\'V0.5.90\'","__AGCB_BOOTSTRAP={version:\'0.5.90\'","persistent-realtime-1to3min-tree-stump-regrowth"]:'
          new_tree='for token in ["persistent-realtime-1to3min-tree-stump-regrowth"]:'
          if s.count(old_tree)!=1: raise SystemExit(f'{p}: stale bootstrap-version tree assertion count={s.count(old_tree)}')
          p.write_text(s.replace(old_tree,new_tree),encoding='utf-8')
          print(f'updated {total} release-owner assertions and 1 stale tree bootstrap-version assertion')
      - name: Commit gate maintenance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/js-syntax.yml .github/workflows/building-extension-check.yml .github/workflows/fishing-ecology-check.yml .github/workflows/tree-resource-integrity-check.yml
          if git diff --cached --quiet; then
            echo 'No gate changes required.'
            exit 0
          fi
          git commit -m 'test: align stale gates with v0.5.93 release owner'
          git push origin HEAD:dev-v0.1
