name: Netlify TEST Origin Gate

on:
  push:
    branches: [dev-v0.1]
    paths:
      - 'netlify.toml'
      - 'bootstrap-v0510.js'
      - '.github/workflows/netlify-test-origin-check.yml'
  workflow_dispatch:

jobs:
  test-origin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate direct TEST origin isolation
        run: |
          set -euo pipefail
          test -f netlify.toml
          grep -F 'publish = "."' netlify.toml
          grep -F "command = \"echo 'AG Cute Blocks TEST direct static deploy'\"" netlify.toml
          grep -F 'X-AGCB-Environment = "TEST"' netlify.toml
          grep -F "globalThis.AG_RUNTIME_ENVIRONMENT='TEST'" bootstrap-v0510.js
          if grep -E 'cdn\.jsdelivr\.net|raw\.githubusercontent\.com|honbin002-design\.github\.io' netlify.toml; then
            echo 'TEST must deploy the dev branch directly; external proxy origin is forbidden.' >&2
            exit 1
          fi
          if grep -E 'AGCB_BRIDGE_TOKEN|authToken[[:space:]]*=' netlify.toml; then
            echo 'Secret-like material found in Netlify TEST config.' >&2
            exit 1
          fi
          echo 'Netlify TEST direct deployment is environment-bound, proxy-free, and secret-free.'
