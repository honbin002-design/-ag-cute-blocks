name: JavaScript syntax check

on:
  push:
    branches: [dev-v0.1]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse browser ES modules
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done
