name: JavaScript syntax check

on:
  push:
    branches: [main, dev-v0.1]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parse browser ES modules
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done

      - name: Validate relative named imports
        shell: python
        run: |
          import pathlib,re,sys
          files={p.name:p.read_text(encoding='utf-8') for p in pathlib.Path('.').glob('*.js')}
          failures=[]
          export_re=re.compile(r'export\s+(?:async\s+)?(?:function|class|const|let|var)\s+([A-Za-z_$][\w$]*)')
          export_list_re=re.compile(r'export\s*\{([^}]+)\}')
          import_re=re.compile(r'import\s*\{([^}]+)\}\s*from\s*[\'\"](\./[^\'\"]+)[\'\"]')
          for source_name,source in files.items():
            for names,target in import_re.findall(source):
              target_name=pathlib.Path(target.split('?')[0]).name
              if target_name not in files:
                failures.append(f'{source_name}: missing relative module {target}')
                continue
              target_src=files[target_name]
              exports=set(export_re.findall(target_src))
              for block in export_list_re.findall(target_src):
                for item in block.split(','):
                  raw=item.strip().split(' as ')[0].strip()
                  if raw: exports.add(raw)
              for item in names.split(','):
                imported=item.strip().split(' as ')[0].strip()
                if imported and imported not in exports:
                  failures.append(f'{source_name}: imports {imported} from {target_name}, but it is not exported')
          if failures:
            print('\n'.join(failures)); sys.exit(1)
          print('Relative named-import validation passed.')

      - name: Verify current runtime chain
        shell: python
        run: |
          import pathlib,re,sys
          boot=pathlib.Path('bootstrap-v045.js').read_text(encoding='utf-8')
          index=pathlib.Path('index.html').read_text(encoding='utf-8')
          sw=pathlib.Path('sw.js').read_text(encoding='utf-8')
          motion=pathlib.Path('character-motion-fix-runtime.js').read_text(encoding='utf-8')
          mobile=pathlib.Path('mobile-controls-runtime.js').read_text(encoding='utf-8')
          viewport=pathlib.Path('mobile-viewport-lock-runtime.js').read_text(encoding='utf-8')
          aim=pathlib.Path('aim-reticle-runtime.js').read_text(encoding='utf-8')
          m=re.search(r"__AGCB_BOOTSTRAP=\{version:'([^']+)'",boot)
          if not m: sys.exit('bootstrap version missing')
          v=m.group(1)
          expected=f'V{v}'
          failures=[]
          if expected not in motion: failures.append('visible runtime version does not match bootstrap')
          if f'bootstrap-v045.js?v={v}' not in index and expected not in index: failures.append('index is not aligned with current runtime version')
          for name in ['app-v043.js','building-extension-runtime.js','character-asset-runtime.js','character-motion-fix-runtime.js','mobile-controls-runtime.js','aim-reticle-runtime.js','mobile-input-runtime.js','sleep-routine.js','mobile-viewport-lock-runtime.js']:
            if name not in boot: failures.append(f'bootstrap missing {name}')
          for name in ['mobile-controls-runtime.js','mobile-controls.css','mobile-viewport-lock-runtime.js','aim-reticle-runtime.js','character-motion-fix-runtime.js']:
            if name not in sw: failures.append(f'service worker missing {name}')
          for token in ['gesturestart','gesturechange','gestureend','dblclick','touchmove','controlAwareTouchGuard:true']:
            if token not in viewport: failures.append(f'viewport lock missing {token}')
          if "crosshairVisualOnly:true" not in mobile: failures.append('mobile crosshair visual-only base marker missing')
          for token in ['firstPersonCentered:true','thirdFarmDraggable:true',"setProperty('pointer-events','auto','important')","cross.style.left='50%'","cross.style.top='50%'"]:
            if token not in aim: failures.append(f'aim reticle missing {token}')
          if 'postMixerArmSwing:true' not in motion or 'runClipRouting:true' not in motion: failures.append('walk/run correction markers missing')
          if failures:
            print('\n'.join(failures)); sys.exit(1)
          print(f'Runtime chain checks passed for {expected}.')

      - name: Verify centralized daily progression rules
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {advanceDailyRecord,advanceDailySnapshot} from './daily-progression-system.js';
          const close=(a,b)=>assert.ok(Math.abs(a-b)<1e-9,`${a} != ${b}`);
          let r={type:'carrot',growth:.2};advanceDailyRecord(r,{fromDay:2,toDay:3,season:'spring',weather:'sunny'});close(r.growth,.30);
          r={type:'carrot',growth:.2};advanceDailyRecord(r,{fromDay:2,toDay:3,season:'spring',weather:'sunny',care:{wateredDay:2}});close(r.growth,.38);
          r={type:'carrot',growth:.2};advanceDailyRecord(r,{fromDay:2,toDay:3,season:'spring',weather:'thunderstorm'});close(r.growth,.40);
          const world={objects:[{id:'c1',type:'corn',growth:.2}]},settings={worldDay:5,season:'summer',weather:'rain',economy:{coins:3,shipping:[{itemId:'egg',qty:2,unit:18}]}};
          const result=advanceDailySnapshot(world,settings,{},{});assert.equal(result.toDay,6);assert.equal(result.earned,36);assert.equal(settings.economy.coins,39);
          console.log('Central daily progression checks passed.');
          NODE

      - name: Verify mobile HUD and tool invariants
        shell: python
        run: |
          import pathlib,sys
          app=pathlib.Path('app-v043.js').read_text(encoding='utf-8')
          css=pathlib.Path('mobile-controls.css').read_text(encoding='utf-8')
          ext=pathlib.Path('building-extension-runtime.js').read_text(encoding='utf-8')
          aim=pathlib.Path('aim-reticle-runtime.js').read_text(encoding='utf-8')
          failures=[]
          for token in ["'建材':","'建築':","'家電':","t==='door'","t==='window'","t==='fence'","function standSurfaceY","function stairSurfaceY","globalThis.__AGCB_GAME_ACTIONS"]:
            if token not in app: failures.append(f'app missing {token}')
          if "['stair','🪜','樓梯']" not in app: failures.append('official stair entry missing')
          if 'duplicateStairRemoved:true' not in ext: failures.append('duplicate stair cleanup marker missing')
          if 'directMobileMaterialFix:true' not in ext: failures.append('mobile tile/ceramic fix marker missing')
          if 'data-agcb-build-value="stairs"' in ext: failures.append('duplicate stairs UI still exposed')
          if 'pointer-events:none!important' not in css: failures.append('first-person crosshair base safety missing')
          if 'thirdFarmDraggable:true' not in aim: failures.append('third/farm draggable reticle marker missing')
          for token in ['#add{right:104px;bottom:4px}','#del{right:78px;bottom:88px}','#rot{right:0;top:40px}','#jump{right:0;bottom:0;width:96px;height:96px']:
            if token not in css: failures.append(f'HUD layout missing {token}')
          if failures:
            print('\n'.join(failures)); sys.exit(1)
          print('Mobile HUD, reticle and tool invariants passed.')
