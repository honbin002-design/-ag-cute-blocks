name: Character asset resilience check

on:
  push:
    branches: [main, dev-v0.1]
  pull_request:
    branches: [main]

jobs:
  asset-resilience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse resilience runtime
        shell: bash
        run: |
          node --input-type=module --check < asset-fetch-resilience-runtime.js
          node --input-type=module --check < character-asset-runtime.js
          node --check service-worker-register.js
          node --check sw.js
      - name: Verify current character chain and asset sizes
        run: node tests/release-chain-v104.mjs
