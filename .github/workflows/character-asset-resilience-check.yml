name: Character asset resilience check

on:
  push:
    branches: [main, dev-v0.1]
  pull_request:
    branches: [main]

jobs:
  asset-resilience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parse resilience modules
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < asset-fetch-resilience-runtime.js
          node --input-type=module --check < character-asset-runtime-v0499.js

      - name: Resolve current release files
        shell: python
        run: |
          import pathlib,re,sys
          index=pathlib.Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module" src="\./(bootstrap-v\d+\.js)\?v=([0-9.]+)"></script>',index)
          if not m: sys.exit('current bootstrap reference missing from index')
          boot_name,v=m.groups();boot=pathlib.Path(boot_name).read_text(encoding='utf-8')
          pathlib.Path('/tmp/agcb-current').write_text(f'{boot_name}\n{v}\n',encoding='utf-8')
          print(f'current release: {v} / {boot_name}')

      - name: Verify character loading resilience invariants
        shell: python
        run: |
          import pathlib,sys
          boot_name,v=pathlib.Path('/tmp/agcb-current').read_text().splitlines()
          boot=pathlib.Path(boot_name).read_text(encoding='utf-8')
          index=pathlib.Path('index.html').read_text(encoding='utf-8')
          guard=pathlib.Path('asset-fetch-resilience-runtime.js').read_text(encoding='utf-8')
          asset=pathlib.Path('character-asset-runtime-v0499.js').read_text(encoding='utf-8')
          failures=[]
          if f"asset-fetch-resilience-runtime.js?v={v}" not in boot: failures.append('resilience runtime query version mismatch')
          if 'character-asset-runtime-v0499.js' not in boot: failures.append('current character asset runtime missing from bootstrap')
          if boot.find('asset-fetch-resilience-runtime.js')>boot.find('character-asset-runtime-v0499.js'): failures.append('resilience runtime must load before character asset runtime')
          for token in ["/assets/characters/","RETRY_DELAYS=[220,650]","cache:'reload'","characterOnly:true","retryCount:RETRY_DELAYS.length","offlineIntegrity:true","scopeAwareUrls:true","directPersistentCache:true","offlineCacheFallback:true","__AGCB_VERIFY_CHARACTER_OFFLINE","const CHARACTER_CACHE='ag-cute-blocks-character-assets-v1'","persistCharacterAsset(input,response.clone())","const cached=await cachedCharacterAsset(input);if(cached)return cached","const resolvedBase=g=>new URL(g.base,location.href)","new URL(group.base+String(i).padStart(3,'0'),location.href).href"]:
            if token not in guard: failures.append(f'resilience runtime missing {token}')
          expected_groups={
            'special2':("./assets/characters/special2/model.v051.b64.",17),
            'special3':("./assets/characters/special3/model.v051.b64.",13),
            'special5':("./assets/characters/special5/model.v094.glb.part",14),
            'manus5':("./assets/characters/manus5/chibi_8_variants_rigged.glb.part",16),
            'boy':("./assets/characters/general/boy.v052.glb.part",2),
            'girl':("./assets/characters/general/girl.v052.glb.part",2),
          }
          for key,(base,count) in expected_groups.items():
            if f"{key}:{{base:'{base}',count:{count}}}" not in guard: failures.append(f'offline group mismatch for {key}')
          pending_cleanup="p.then(()=>{if(pending.get(key)===p)pending.delete(key)},()=>{if(pending.get(key)===p)pending.delete(key)})"
          if asset.count(pending_cleanup)!=1: failures.append('settled character pending promise cleanup missing or duplicated')
          # Current V0.5 architecture intentionally retires the old Service Worker and uses direct CacheStorage fallback.
          for token in ["navigator.serviceWorker.getRegistrations()","r.unregister()","caches.keys()"]:
            if token not in index: failures.append(f'legacy Service Worker retirement missing: {token}')
          if 'service-worker-register.js' in index: failures.append('retired Service Worker registration is still active in index')
          if failures:
            print('\n'.join(failures));sys.exit(1)
          print('Direct character cache fallback, scoped asset URLs, pending recovery and retired Service Worker architecture passed.')
