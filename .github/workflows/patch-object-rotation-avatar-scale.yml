name: Patch object rotation and avatar scale
on:
  push:
    branches: [dev-v0.1]
permissions:
  contents: write
jobs:
  patch-live:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v0.1
      - name: Apply V0.4.93 gameplay fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'missing patch anchor in {path}: {old[:100]!r}')
              s=s.replace(old,new) if count is None else s.replace(old,new,count)
              p.write_text(s)

          # Make the rotate button affect the aimed placed object first; when no object is aimed,
          # it still rotates the direction of the next placement.
          replace('app-v043.js',
            "const VERSION='V0.4.77' /* const VERSION='V0.4.42' legacy extension invariant */",
            "const VERSION='V0.4.93' /* const VERSION='V0.4.42' legacy extension invariant */")
          replace('app-v043.js',
            "function rotateBuildSelection(){objRot=(objRot+Math.PI/2)%(Math.PI*2);toast(`放置方向：${Math.round(objRot*180/Math.PI)}°`)}",
            "function rotateBuildSelection(){const h=aim();if(h){let o=h.object;while(o.parent&&o.parent!==world)o=o.parent;if(o?.userData&&(o.userData.kind==='object'||o.userData.kind==='block')){unregisterSolid(o);o.rotation.y=(o.rotation.y+Math.PI/2)%(Math.PI*2);registerSolid(o,o.userData.kind==='block'?.24:.22);changed=true;saveWorld();toast('物品已轉向 90°');return}}objRot=(objRot+Math.PI/2)%(Math.PI*2);toast(`放置方向：${Math.round(objRot*180/Math.PI)}°`)}")

          # Normalize every imported avatar to gameplay dimensions instead of trusting source-model scale.
          replace('character-asset-runtime.js',
            "const requestedHeight=2.18*bodyScale(c),rawHeight=Number.isFinite(rawSize.y)&&rawSize.y>.1?rawSize.y:1,scale=Math.min(2.8,Math.max(.25,requestedHeight/rawHeight));root.scale.setScalar(scale);root.updateMatrixWorld(true);\n  tuneRigForCustomization(root,c);root.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(selectedVariant||root),center=box.getCenter(new THREE.Vector3());",
            "const bodyFactor=c.body==='tall'?1.04:c.body==='petite'?.94:1,requestedHeight=(c.age==='child'?1.48:1.72)*bodyFactor,rawHeight=Number.isFinite(rawSize.y)&&rawSize.y>.1?rawSize.y:1,scale=Math.min(2.8,Math.max(.18,requestedHeight/rawHeight));root.scale.setScalar(scale);root.updateMatrixWorld(true);\n  tuneRigForCustomization(root,c);root.updateMatrixWorld(true);let fitBox=new THREE.Box3().setFromObject(selectedVariant||root),fitSize=fitBox.getSize(new THREE.Vector3()),fit=Math.min(1,1.16/Math.max(.001,fitSize.x),.92/Math.max(.001,fitSize.z));if(fit<1){root.scale.multiplyScalar(fit);root.updateMatrixWorld(true)}const box=new THREE.Box3().setFromObject(selectedVariant||root),center=box.getCenter(new THREE.Vector3());")
          replace('character-asset-runtime.js',
            "u.assetShapeRevision='user-supplied-exact-glb-v1'",
            "u.assetShapeRevision='gameplay-normalized-v2'",1)

          # Synchronize visible/runtime cache-busting version chain.
          for path in ['index.html','bootstrap-v045.js']:
              p=Path(path); s=p.read_text().replace('0.4.92','0.4.93').replace('V0.4.92','V0.4.93'); p.write_text(s)
          PY
          node --check app-v043.js
          node --check character-asset-runtime.js
          node --check bootstrap-v045.js
          grep -q "物品已轉向 90°" app-v043.js
          grep -q "requestedHeight=(c.age==='child'?1.48:1.72)" character-asset-runtime.js
          grep -q 'V0.4.93' index.html
      - name: Commit V0.4.93
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-v043.js character-asset-runtime.js index.html bootstrap-v045.js
          git diff --cached --quiet && exit 0
          git commit -m "release: V0.4.93 object rotation and avatar scale normalization"
          git push origin HEAD:dev-v0.1
