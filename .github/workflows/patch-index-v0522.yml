name: Patch V0.5.22 version sync
on:
  push:
    branches: [dev-v0.1]
    paths:
      - '.github/workflows/patch-index-v0522.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v0.1
      - name: Sync game version and wardrobe cache
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'(<meta name="ag-runtime-version" content=")V0\.5\.\d+("[^>]*>)',r'\g<1>V0.5.22\2',s,count=1)
          s=re.sub(r'(🌈 AG Cute Blocks <small>)V0\.5\.\d+(</small>)',r'\g<1>V0.5.22\2',s,count=1)
          s=re.sub(r'<script[^>]+src=["\'][^"\']*wardrobe-runtime\.js(?:\?[^"\']*)?["\'][^>]*></script>','<script type="module" src="./wardrobe-runtime.js?v=0.5.22"></script>',s)
          p.write_text(s,encoding='utf-8')
      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'content="V0.5.22"' in s
          assert 'AG Cute Blocks <small>V0.5.22</small>' in s
          assert './wardrobe-runtime.js?v=0.5.22' in s
          assert s.count('wardrobe-runtime.js') == 1
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: sync game entrypoint to V0.5.22'
          git push origin HEAD:dev-v0.1
