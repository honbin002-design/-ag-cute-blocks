name: Fishing ecology check

on:
  push:
    branches: [main, dev-v0.1]
  pull_request:
    branches: [main]

jobs:
  fishing-ecology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse fishing modules
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < fishing-ecology-system.js
          node --input-type=module --check < fishing-ecology-runtime-v0505.js
          node --input-type=module --check < fishing-forecast-runtime-v0506.js
          node --input-type=module --check < fishing-journal-runtime-v0510.js
      - name: Verify ecology math and legacy bridge
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {getFishingWeights,chooseFish,fishRollForLegacyThreshold} from './fishing-ecology-system.js';
          for(const ctx of [{season:'spring',weather:'sunny',minute:720},{season:'autumn',weather:'thunderstorm',minute:1080},{season:'winter',weather:'snow',minute:1380}]){
            const w=getFishingWeights(ctx);assert.ok(Math.abs(Object.values(w).reduce((a,b)=>a+b,0)-1)<1e-9);
          }
          const noon=getFishingWeights({season:'summer',weather:'sunny',minute:720});
          const rare=getFishingWeights({season:'autumn',weather:'thunderstorm',minute:1080});
          assert.ok(rare.goldFish>noon.goldFish);
          assert.equal(chooseFish({},()=>0),'smallFish');assert.equal(chooseFish({},()=>.999),'goldFish');
          assert.ok(fishRollForLegacyThreshold('smallFish')<.5);
          assert.ok(fishRollForLegacyThreshold('riverFish')>=.5&&fishRollForLegacyThreshold('riverFish')<.82);
          assert.ok(fishRollForLegacyThreshold('goldFish')>=.82);
          NODE
      - name: Verify catch callback discrimination
        shell: python
        run: |
          import pathlib,sys
          runtime=pathlib.Path('fishing-ecology-runtime-v0505.js').read_text(encoding='utf-8')
          core=pathlib.Path('app-v0504.js').read_text(encoding='utf-8')
          failures=[]
          for token in ["Function.prototype.toString.call(fn)","src.includes('smallFish')","src.includes('riverFish')","src.includes('goldFish')","src.includes('addInventory')","fishingCallback=isFishingCatchCallback(fn)","callbackFilter:'fish-inventory-signature'"]:
            if token not in runtime: failures.append(f'runtime callback discrimination missing: {token}')
          cast="toast('🎣 拋竿… 等魚上鉤');setTimeout(()=>{const roll=Math.random(),fish=roll<.5?'smallFish':roll<.82?'riverFish':'goldFish';addInventory(economy,fish,1)"
          if cast not in core: failures.append('core fishing callback signature/order changed; ecology bridge must be reviewed')
          if failures:
            print('\n'.join(failures));sys.exit(1)
          print('Fishing timeout discrimination safely ignores the preceding toast timer.')
      - name: Verify forecast presentation safety
        shell: python
        run: |
          import pathlib,sys
          forecast=pathlib.Path('fishing-forecast-runtime-v0506.js').read_text(encoding='utf-8')
          failures=[]
          for token in ["selectedFishingRod()","chip.classList.toggle('on',on)","position:fixed","right:max(","pointer-events:none","probabilitiesHidden:true","稀有魚較活躍","河魚較活躍","小魚較活躍"]:
            if token not in forecast: failures.append(f'forecast presentation missing: {token}')
          if '%' in forecast: failures.append('forecast UI must not expose numeric percentages')
          if failures:
            print('\n'.join(failures));sys.exit(1)
          print('Fish forecast remains contextual, right-side, non-blocking and hides numeric probabilities.')
      - name: Verify current-condition match and isolation
        shell: python
        run: |
          import pathlib,re,sys
          journal=pathlib.Path('fishing-journal-runtime-v0510.js').read_text(encoding='utf-8')
          failures=[]
          required=[
            "import {getFishingWeights} from './fishing-ecology-system.js'",
            "const KEY='ag_cute_blocks_fishing_journal_v1'","function guideFor(id)","function currentContext()","function conditionLabel(id)",
            "const season=$('#season')?.value||'spring'","weather=$('#weather')?.value||'sunny'","$('#clock')?.textContent||'08:00'",
            "const ctx=currentContext(),weights=getFishingWeights(ctx),values=Object.values(weights),top=Math.max(...values)",
            "weights[id]>=top-1e-9?'🔥 現在很適合':'・目前普通'",
            "較容易：${guideFor(id)}","${conditionLabel(id)}","currentConditionMatch:true",
            "text.includes('釣到')","const first=journal[id]===0","journal[id]++","if(first)showFirstDiscovery(name,icon)",
            "selectedFishingRod()","btn.classList.toggle('on',selectedFishingRod())"
          ]
          for token in required:
            if token not in journal: failures.append(f'fishing journal behavior missing: {token}')
          for token in ['addInventory(','economy.','settleShipping(','Math.random(']:
            if token in journal: failures.append(f'journal must remain read-only toward fishing/economy: {token}')
          if re.search(r'(較容易|現在很適合|目前普通)[^`\n]*\d+(?:\.\d+)?%',journal):
            failures.append('journal must not expose numeric probabilities')
          if failures:
            print('\n'.join(failures));sys.exit(1)
          print('Current-condition hints use the single ecology source and remain economy-isolated.')
      - name: Verify current release wiring
        shell: python
        run: |
          import pathlib,re,sys
          index=pathlib.Path('index.html').read_text(encoding='utf-8')
          boot=pathlib.Path('bootstrap-v0510.js').read_text(encoding='utf-8')
          wrapper=pathlib.Path('app-v0510.js').read_text(encoding='utf-8')
          failures=[]
          m=re.search(r'bootstrap-v0510\.js\?v=([0-9.]+)',index)
          if not m: sys.exit('current bootstrap version missing from index')
          v=m.group(1);expected=f'V{v}'
          if f'<meta name="ag-runtime-version" content="{expected}">' not in index: failures.append('index meta does not match current release')
          if f'AG Cute Blocks <small>{expected}</small>' not in index: failures.append('visible version does not match current release')
          for name in ['fishing-ecology-runtime-v0505.js','fishing-forecast-runtime-v0506.js','fishing-journal-runtime-v0510.js']:
            if f'{name}?v={v}' not in boot: failures.append(f'bootstrap wiring missing: {name}?v={v}')
          if "import './app-v0504.js'" not in wrapper: failures.append('verified V0.5.04 core wrapper missing')
          if f"const VERSION='{expected}'" not in wrapper: failures.append('wrapper version mismatch')
          if failures:
            print('\n'.join(failures));sys.exit(1)
          print(f'Fishing ecology + forecast + journal wiring passed for {expected}.')
