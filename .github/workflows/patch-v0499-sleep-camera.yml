name: Patch V0.4.99 sleep camera
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-v0499-sleep-camera.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v0.1
          fetch-depth: 0
      - name: Build isolated V0.4.99 runtime
        shell: python
        run: |
          from pathlib import Path

          # Current character normalization is copied to a never-before-cached URL.
          cm=Path('character-models.js').read_text()
          if "'special5'" not in cm: raise SystemExit('special5 missing from current character normalization')
          Path('character-models-v0499.js').write_text(cm)

          # Current special5 asset loader is copied to a never-before-cached URL.
          ca=Path('character-asset-runtime.js').read_text()
          if 'SPECIAL5_TOTAL_BYTES=39650000' not in ca: raise SystemExit('special5 asset loader mismatch')
          Path('character-asset-runtime-v0499.js').write_text(ca)

          # Preserve the corrected sleep button/layout through a unique runtime URL.
          sr=Path('sleep-routine.js').read_text()
          Path('sleep-routine-v0499.js').write_text(sr)

          app=Path('app-v0498.js').read_text()
          app=app.replace("from './character-models.js'", "from './character-models-v0499.js'")
          app=app.replace("const VERSION='V0.4.98'", "const VERSION='V0.4.99'")
          # Role 5 must not fall through to standard/girl.
          app=app.replace("if(['special','special2','special3'].includes(value))", "if(['special','special2','special3','special5'].includes(value))")
          # Sleeping/lying locks movement but must NOT lock camera drag.
          old="renderer.domElement.onpointerdown=e=>{if(playerState.mode!=='free'||e.clientX<=innerWidth*.29)return;"
          new="renderer.domElement.onpointerdown=e=>{if((playerState.mode!=='free'&&playerState.mode!=='lie')||e.clientX<=innerWidth*.29)return;"
          if old not in app: raise SystemExit('camera pointer lock anchor missing')
          app=app.replace(old,new)
          # Do not resurrect the retired root service worker from the main runtime.
          app=app.replace("if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});", "")
          # Remove misleading legacy load message.
          app=app.replace("toast(loaded?'V0.4.77 已接續原世界':'V0.4.77 已建立世界')", "toast(loaded?`${VERSION} 已接續原世界`:`${VERSION} 已建立世界`)")
          Path('app-v0499.js').write_text(app)

          boot=Path('bootstrap-v0498.js').read_text()
          boot=boot.replace("./app-v0498.js?v=0.4.98", "./app-v0499.js")
          boot=boot.replace("./character-asset-runtime.js?v=0.4.98", "./character-asset-runtime-v0499.js")
          boot=boot.replace("./sleep-routine.js?v=0.4.98", "./sleep-routine-v0499.js")
          boot=boot.replace("version:'0.4.98'", "version:'0.4.99'")
          boot=boot.replace('V0.4.98','V0.4.99').replace('v=0.4.98','v=0.4.99')
          Path('bootstrap-v0499.js').write_text(boot)

          # Unique HTML filename bypasses the stale root navigation cache itself.
          html=Path('index.html').read_text()
          html=html.replace('V0.4.98','V0.4.99').replace('v=0.4.98','v=0.4.99')
          html=html.replace('./bootstrap-v0498.js?v=0.4.99','./bootstrap-v0499.js')
          Path('play-v0499.html').write_text(html)

      - name: Validate V0.4.99
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "const VERSION='V0.4.99'" app-v0499.js
          grep -Fq "playerState.mode!=='free'&&playerState.mode!=='lie'" app-v0499.js
          grep -Fq "['special','special2','special3','special5'].includes(value)" app-v0499.js
          grep -Fq "character-models-v0499.js" app-v0499.js
          ! grep -Fq "navigator.serviceWorker.register('./sw.js')" app-v0499.js
          grep -Fq 'SPECIAL5_TOTAL_BYTES=39650000' character-asset-runtime-v0499.js
          grep -Fq 'bootstrap-v0499.js' play-v0499.html
          grep -Fq 'V0.4.99' play-v0499.html
          grep -Fq 'app-v0499.js' bootstrap-v0499.js
          grep -Fq 'character-asset-runtime-v0499.js' bootstrap-v0499.js
          grep -Fq 'sleep-routine-v0499.js' bootstrap-v0499.js
          node --check app-v0499.js
          node --check character-models-v0499.js
          node --check character-asset-runtime-v0499.js
          node --check sleep-routine-v0499.js
          node --check bootstrap-v0499.js
      - name: Commit V0.4.99
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play-v0499.html bootstrap-v0499.js app-v0499.js character-models-v0499.js character-asset-runtime-v0499.js sleep-routine-v0499.js
          git commit -m 'release: V0.4.99 allow sleep camera and isolate Safari runtime'
          git push origin HEAD:dev-v0.1
