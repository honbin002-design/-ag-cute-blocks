name: Import Special5 Once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-special5-once.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v0.1
          fetch-depth: 0
      - name: Download verify and split Special5
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet gdown
          mkdir -p /tmp/ag-special5 assets/characters/special5
          gdown 'https://drive.google.com/file/d/1JDVzeocJfHibjfKh0K__3yuTza3RK9H9/view?usp=drivesdk' -O /tmp/ag-special5/model.glb
          test "$(stat -c%s /tmp/ag-special5/model.glb)" = "39650000"
          python - <<'PY'
          from pathlib import Path
          src=Path('/tmp/ag-special5/model.glb').read_bytes()
          out=Path('assets/characters/special5')
          out.mkdir(parents=True,exist_ok=True)
          for p in out.glob('model.v094.glb.part*'): p.unlink()
          chunk=3_000_000
          for i in range(0,len(src),chunk):
              (out/f'model.v094.glb.part{i//chunk:03d}').write_bytes(src[i:i+chunk])
          assert len(list(out.glob('model.v094.glb.part*'))) == 14
          print('verified',len(src),'bytes; 14 parts')
          PY
      - name: Commit binary parts to live branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/characters/special5
          git commit -m 'asset: import Special Character 5 verified GLB parts'
          git push origin HEAD:dev-v0.1
