name: AGCB V0.5.189 Authoritative World Core Anchor Probe
on:
  push:
    branches: [gate/runtime-integration-v05186]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact V0.5.04 player and animation anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('app-v0504.js'); s=p.read_text(encoding='utf-8')
          terms=['requestAnimationFrame','function animate','const animate','player.position','player.rotation','jump','grounded','move','runToggle','runMode','walk','character','avatar','__AGCB','render()']
          out={'evidenceId':'AGCB-V05189-AUTHORITATIVE-WORLD-CORE-ANCHORS','source':'app-v0504.js','bytes':len(s.encode()),'anchors':{}}
          for term in terms:
            hits=[]; start=0
            while True:
              i=s.find(term,start)
              if i<0: break
              hits.append({'offset':i,'context':s[max(0,i-900):min(len(s),i+1800)]})
              start=i+len(term)
            out['anchors'][term]=hits[:20]
          Path('/tmp/AGCB-V05189-core-anchors.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          focus=[]
          for term in ['requestAnimationFrame','player.position','jump','grounded','runToggle','walk','character','avatar']:
            focus.append('\n===== '+term+' =====')
            for n,h in enumerate(out['anchors'][term]): focus.append(f"--- hit {n+1} offset {h['offset']} ---\n{h['context']}")
          Path('/tmp/AGCB-V05189-core-anchors.txt').write_text('\n'.join(focus),encoding='utf-8')
          summary={k:len(v) for k,v in out['anchors'].items()};print(json.dumps(summary,indent=2))
          if not out['anchors']['requestAnimationFrame'] or not out['anchors']['player.position']:
            raise SystemExit('authoritative movement/render anchors missing')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AGCB-V05189-AUTHORITATIVE-WORLD-CORE-ANCHORS
          path: |
            /tmp/AGCB-V05189-core-anchors.json
            /tmp/AGCB-V05189-core-anchors.txt
          retention-days: 3
