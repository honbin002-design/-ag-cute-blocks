name: Formal CC0 Male Skeleton Routing Diagnostic V0.5.181
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/formal-cc0-male-skeleton-routing-diagnostic-v05181.yml']
  workflow_dispatch:
jobs:
  diagnose:
    name: AGCB-V05181-MALE-SKELETON-ROUTING
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Acquire pinned donor and targets
        run: |
          set -euo pipefail; mkdir -p /tmp/proj/donor /tmp/proj/targets
          DB='https://raw.githubusercontent.com/J-Ponzo/gltf-universal-animation-library/e24c23cf2a1323488a3faa226ea7ea21f644b73e/glTF'; curl -fsSL "$DB/AnimationLibrary_Godot_Standard.gltf" -o /tmp/proj/donor/a.gltf; curl -fsSL "$DB/AnimationLibrary_Godot_Standard.bin" -o /tmp/proj/donor/AnimationLibrary_Godot_Standard.bin
          BASE='https://raw.githubusercontent.com/BoQsc/gpu-marching-cubes/54368c0875c5f72be00160fafb040c6ce5c4e760/models/entities/player/Universal%20Base%20Characters%5BStandard%5D/Base%20Characters/Godot%20-%20UE'
          for f in Superhero_Male_FullBody.gltf Superhero_Male_FullBody.bin Superhero_Female_FullBody.gltf Superhero_Female_FullBody.bin; do curl -fsSL "$BASE/$f" -o "/tmp/proj/targets/$f"; done
          curl -fsSL 'https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip' -o /tmp/g.zip; unzip -q /tmp/g.zip -d /tmp/g; chmod +x /tmp/g/Godot_v4.5.1-stable_linux.x86_64
          printf '[application]\nconfig/name="AGCB V05181"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n' > /tmp/proj/project.godot
          /tmp/g/Godot_v4.5.1-stable_linux.x86_64 --headless --editor --path /tmp/proj --quit-after 20 >/tmp/import.log 2>&1
      - name: Diagnose exact animated skeleton routing
        run: |
          cat > /tmp/proj/diag.gd <<'EOF'
          extends SceneTree
          var map={"root":"root","DEF-hips":"pelvis","DEF-spine.001":"spine_01","DEF-spine.002":"spine_02","DEF-spine.003":"spine_03","DEF-neck":"neck_01","DEF-head":"Head","DEF-shoulder.L":"clavicle_l","DEF-upper_arm.L":"upperarm_l","DEF-forearm.L":"lowerarm_l","DEF-hand.L":"hand_l","DEF-shoulder.R":"clavicle_r","DEF-upper_arm.R":"upperarm_r","DEF-forearm.R":"lowerarm_r","DEF-hand.R":"hand_r","DEF-thigh.L":"thigh_l","DEF-shin.L":"calf_l","DEF-foot.L":"foot_l","DEF-toe.L":"ball_l","DEF-thigh.R":"thigh_r","DEF-shin.R":"calf_r","DEF-foot.R":"foot_r","DEF-toe.R":"ball_r"}
          func scan(n,sk,mesh,ap):
            if n is Skeleton3D: sk.append(n)
            if n is MeshInstance3D: mesh.append(n)
            if n is AnimationPlayer: ap.append(n)
            for c in n.get_children(): scan(c,sk,mesh,ap)
          func _initialize():
            var donor=load("res://donor/a.gltf").instantiate(); var dsk=[];var dmesh=[];var dap=[];scan(donor,dsk,dmesh,dap)
            var src=null
            for ln in dap[0].get_animation_library_list():
              var lib=dap[0].get_animation_library(ln)
              if lib.has_animation("Walk"): src=lib.get_animation("Walk")
            var report={"evidenceId":"AGCB-V05181-MALE-SKELETON-ROUTING","release":"V0.5.181","environment":"TEST","targets":{},"errors":[]}
            for sex in ["Male","Female"]:
              var r=load("res://targets/Superhero_"+sex+"_FullBody.gltf").instantiate();get_root().add_child(r)
              var ss=[];var mm=[];var pp=[];scan(r,ss,mm,pp);var srows=[]
              for sk in ss:
                var names=[]
                for i in range(sk.get_bone_count()): names.append(str(sk.get_bone_name(i)))
                var valid=[]
                for b in map.values():
                  if sk.find_bone(b)>=0: valid.append(b)
                srows.append({"path":str(r.get_path_to(sk)),"boneCount":sk.get_bone_count(),"mappedPresent":valid.size(),"mappedBones":valid})
              var meshes=[]
              for m in mm: meshes.append({"path":str(r.get_path_to(m)),"skeletonRef":str(m.skeleton),"hasSkin":m.skin!=null,"skinBinds":m.skin.get_bind_count() if m.skin else 0})
              var sk=ss[0];var ap=AnimationPlayer.new();r.add_child(ap);ap.root_node=NodePath("..")
              var lib2=AnimationLibrary.new();var a=Animation.new();a.length=src.length
              for i in range(src.get_track_count()):
                var db=str(src.track_get_path(i)).get_slice(":",1)
                if not map.has(db): continue
                var tb=map[db]
                if sk.find_bone(tb)<0: continue
                var ni=a.add_track(src.track_get_type(i));a.track_set_path(ni,NodePath(str(r.get_path_to(sk))+":"+tb))
                for k in range(src.track_get_key_count(i)): a.track_insert_key(ni,src.track_get_key_time(i,k),src.track_get_key_value(i,k),src.track_get_key_transition(i,k))
              lib2.add_animation("Walk",a);ap.add_animation_library("",lib2)
              sk.reset_bone_poses();var before={}
              for b in map.values():
                var bi=sk.find_bone(b)
                if bi>=0: before[b]=sk.get_bone_pose(bi)
              ap.play("Walk");ap.seek(src.length*0.5,true);var changed=[]
              for b in before:
                var now=sk.get_bone_pose(sk.find_bone(b));var old=before[b]
                if old.basis.get_rotation_quaternion().angle_to(now.basis.get_rotation_quaternion())>0.001 or old.origin.distance_to(now.origin)>0.001: changed.append(b)
              report.targets[sex]={"skeletonCount":ss.size(),"skeletons":srows,"meshes":meshes,"selectedSkeleton":str(r.get_path_to(sk)),"walkTrackCount":a.get_track_count(),"walkChanged":changed,"walkChangedCount":changed.size()}
              r.queue_free()
            donor.free();report.gate="PASS";report.nextGate="SELECT_SKIN_BOUND_SKELETON_AND_CORRECT_RETARGET";report.prodPromotion="HOLD"
            var f=FileAccess.open("/tmp/AGCB-V05181.json",FileAccess.WRITE);f.store_string(JSON.stringify(report,"  "));f.close();print(JSON.stringify(report));quit()
          EOF
          /tmp/g/Godot_v4.5.1-stable_linux.x86_64 --headless --path /tmp/proj --script res://diag.gd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AGCB-V05181-MALE-SKELETON-ROUTING
          path: /tmp/AGCB-V05181.json
          retention-days: 3
