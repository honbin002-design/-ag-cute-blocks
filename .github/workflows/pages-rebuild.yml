name: Pages rebuild

on:
  push:
    branches: [dev-v0.1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: pages-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages-build.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/pages/builds")
          cat /tmp/pages-build.json || true
          test "$code" = "201"
