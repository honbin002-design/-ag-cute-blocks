name: Build V0.5.01 operability and compact world HUD
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v0501-operability.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v0.1
          fetch-depth: 0
      - name: Confirm trigger
        run: echo "V0.5.01 explicit trigger 2"
      - name: Recover and apply patch
        shell: bash
        run: |
          set -euo pipefail
          git show 9d211a6d69ca78f87bf0a747298b6e0388029bcd:.github/workflows/patch-v0501-operability.yml > /tmp/original.yml
          python3 - <<'PY'
          from pathlib import Path
          y=Path('/tmp/original.yml').read_text()
          start=y.index("          python3 - <<'PY'\n")+len("          python3 - <<'PY'\n")
          end=y.index("\n          PY\n      - name: Validate",start)
          body=y[start:end]
          body='\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())+'\n'
          Path('/tmp/patch.py').write_text(body)
          PY
          python3 /tmp/patch.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check app-v0501.js
          node --check bootstrap-v0501.js
          grep -q "V0.5.01" index.html
          grep -q "bootstrap-v0501.js?v=0.5.01" index.html
          grep -q "generateCastle" app-v0501.js
          grep -q "dynamicActorBlocked" app-v0501.js
          grep -q "先用鋤頭挖土" app-v0501.js
          grep -q "worldMapCanvas" app-v0501.js
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v0501.js bootstrap-v0501.js play-v0501.html index.html sw.js
          git commit -m 'release: V0.5.01 compact HUD map castle and operability'
          git push origin HEAD:dev-v0.1
