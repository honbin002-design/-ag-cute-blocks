name: Build V0.5.01 operability and compact world HUD
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v0501-operability.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v0.1
          fetch-depth: 0
      - name: Confirm trigger
        run: echo "V0.5.01 explicit trigger"
      - name: Patch runtime
        shell: bash
        run: |
          git show 9d211a6d69ca78f87bf0a747298b6e0388029bcd:.github/workflows/patch-v0501-operability.yml > /tmp/original.yml
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          y=Path('/tmp/original.yml').read_text()
          m=re.search(r"      - name: Patch runtime\n(.*?)(?=      - name: Validate)",y,re.S)
          if not m: raise SystemExit('cannot recover patch block')
          block=m.group(0)
          script=re.search(r"run: \|\n(.*)",block,re.S).group(1)
          lines=script.splitlines()
          indent=min(len(x)-len(x.lstrip()) for x in lines if x.strip())
          script='\n'.join(x[indent:] for x in lines)
          Path('/tmp/patch.sh').write_text(script+'\n')
          PY
          bash /tmp/patch.sh
      - name: Validate
        run: |
          node --check app-v0501.js
          node --check bootstrap-v0501.js
          grep -q "V0.5.01" index.html
          grep -q "bootstrap-v0501.js?v=0.5.01" index.html
          grep -q "generateCastle" app-v0501.js
          grep -q "dynamicActorBlocked" app-v0501.js
          grep -q "先用鋤頭挖土" app-v0501.js
          grep -q "worldMapCanvas" app-v0501.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v0501.js bootstrap-v0501.js play-v0501.html index.html sw.js
          git commit -m 'release: V0.5.01 compact HUD map castle and operability'
          git push origin HEAD:dev-v0.1
