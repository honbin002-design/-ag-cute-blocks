name: Build V0.5.01 operability and compact world HUD
on:
  push:
    paths:
      - '.github/workflows/patch-v0501-operability.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: control
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: dev-v0.1
          path: work
          fetch-depth: 0
      - name: Recover patch script
        shell: bash
        run: |
          git -C control show 9d211a6d69ca78f87bf0a747298b6e0388029bcd:.github/workflows/patch-v0501-operability.yml > /tmp/v0501-source.yml
          awk 'found && /^          PY$/ {exit} found {sub(/^          /,""); print} /python3 - <<'\''PY'\''/ {found=1}' /tmp/v0501-source.yml > /tmp/patch-v0501.py
          test -s /tmp/patch-v0501.py
      - name: Patch runtime
        working-directory: work
        run: python3 /tmp/patch-v0501.py
      - name: Validate
        working-directory: work
        run: |
          node --check app-v0501.js
          node --check bootstrap-v0501.js
          grep -q "V0.5.01" index.html
          grep -q "bootstrap-v0501.js?v=0.5.01" index.html
          grep -q "generateCastle" app-v0501.js
          grep -q "dynamicActorBlocked" app-v0501.js
          grep -q "先用鋤頭挖土" app-v0501.js
          grep -q "worldMapCanvas" app-v0501.js
      - name: Commit V0.5.01
        working-directory: work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v0501.js bootstrap-v0501.js play-v0501.html index.html sw.js
          git commit -m 'release: V0.5.01 compact HUD map castle and operability'
          git push origin HEAD:dev-v0.1
