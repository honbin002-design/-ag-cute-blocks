name: Catalog Quick Gate
on:
  push:
    branches: [dev-v0.1]
  workflow_dispatch:
jobs:
  catalog-quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalogue quick access remains wired
        run: |
          python - <<'PY'
          from pathlib import Path
          q=Path('catalog-quick-runtime-v0595.js').read_text(encoding='utf-8')
          b=Path('bootstrap-v0510.js').read_text(encoding='utf-8')
          a=Path('app-v0510.js').read_text(encoding='utf-8')
          failures=[]
          for token in ["const VERSION='0.5.95'","agcb_catalog_recent_v0595","agcb_catalog_favorites_v0595","MAX_RECENT=8","MAX_FAV=24","items?.addEventListener('click'","agCatalogRecent","agCatalogFavorites","agCatalogFavoriteToggle","__AGCB_CATALOG_QUICK"]:
              if token not in q: failures.append('catalog quick missing: '+token)
          if 'new MutationObserver' in q: failures.append('catalog quick must not create a MutationObserver')
          if "./catalog-search-runtime-v0594.js?v=0.5.97" not in b: failures.append('search runtime wiring missing')
          if "./catalog-quick-runtime-v0595.js?v=0.5.97" not in b: failures.append('quick runtime wiring missing')
          if "version:'0.5.97'" not in b or "versionOwner:'bootstrap-v0510.js'" not in b: failures.append('bootstrap ownership mismatch')
          if "import './release-version-v0597.js'" not in a or "runtimeVersion:'0.5.97'" not in a: failures.append('wrapper release mismatch')
          r=Path('release-version-v0597.js').read_text(encoding='utf-8')
          if "observerActive:false" not in r or 'new MutationObserver' in r: failures.append('finite release helper contract broken')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('Catalog quick feature remains wired under V0.5.97.')
          PY
