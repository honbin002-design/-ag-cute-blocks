name: Patch SW registration V0.4.91

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-sw-registration-v0491.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded index registration patch
        shell: python
        run: |
          import pathlib,sys
          path=pathlib.Path('index.html')
          src=path.read_text(encoding='utf-8')
          old='<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>\n<script type="module" src="./bootstrap-v045.js?v=0.4.90"></script>'
          new='<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>\n<script src="./service-worker-register.js?v=0.4.91"></script>\n<script type="module" src="./bootstrap-v045.js?v=0.4.91"></script>'
          count=src.count(old)
          if count!=1: sys.exit(f'guard failed: expected exactly 1 bootstrap target, found {count}')
          path.write_text(src.replace(old,new,1),encoding='utf-8')
          print('service worker registration inserted exactly once')
      - name: Verify patched index
        shell: python
        run: |
          import pathlib,sys
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          reg='<script src="./service-worker-register.js?v=0.4.91"></script>'
          boot='<script type="module" src="./bootstrap-v045.js?v=0.4.91"></script>'
          if s.count(reg)!=1: sys.exit('registration script missing or duplicated')
          if s.count(boot)!=1: sys.exit('bootstrap V0.4.91 target missing or duplicated')
          if s.find(reg)>s.find(boot): sys.exit('service worker registration must appear before bootstrap')
          print('index registration order verified')
      - name: Commit patched index
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: register service worker before runtime bootstrap'
          git push
