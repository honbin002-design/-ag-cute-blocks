name: Formal CC0 Visual Frame Capture V0.5.178
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/formal-cc0-visual-frame-capture-v05178.yml']
  workflow_dispatch:
jobs:
  capture:
    name: AGCB-V05178-VISUAL-FRAME-CAPTURE
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Acquire complete pinned adult assets and Godot
        run: |
          set -euo pipefail; mkdir -p /tmp/proj/targets
          API='https://api.github.com/repos/BoQsc/gpu-marching-cubes/contents/models/entities/player/Universal%20Base%20Characters%5BStandard%5D/Base%20Characters/Godot%20-%20UE?ref=54368c0875c5f72be00160fafb040c6ce5c4e760'; curl -fsSL "$API" -o /tmp/list.json
          python3 - <<'PY'
          import json,urllib.request,os,shutil
          p='/tmp/proj/targets'
          for x in json.load(open('/tmp/list.json')):
            n=x['name']
            if n.startswith(('Superhero_Male_FullBody','Superhero_Female_FullBody','T_Hair_','T_Eye_','T_Superhero_Male_','T_Superhero_Female_')): urllib.request.urlretrieve(x['download_url'],p+'/'+n)
          for s,d in {'T_Eye_Normal.png':'T_Eye_Normal_png.png','T_Hair_1_Normal.png':'T_Hair_1_Normal_png.png','T_Hair_2_Normal.png':'T_Hair_2_Normal_png.png'}.items():
            if os.path.exists(p+'/'+s) and not os.path.exists(p+'/'+d): shutil.copyfile(p+'/'+s,p+'/'+d)
          PY
          curl -fsSL 'https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip' -o /tmp/g.zip; unzip -q /tmp/g.zip -d /tmp/g; chmod +x /tmp/g/Godot_v4.5.1-stable_linux.x86_64
          printf '[application]\nconfig/name="AGCB V05178"\nrun/main_scene="res://capture.tscn"\n[display]\nwindow/size/viewport_width=900\nwindow/size/viewport_height=900\n[rendering]\nrenderer/rendering_method="gl_compatibility"\nrenderer/rendering_method.mobile="gl_compatibility"\n' > /tmp/proj/project.godot
          /tmp/g/Godot_v4.5.1-stable_linux.x86_64 --headless --editor --path /tmp/proj --quit-after 25 >/tmp/import.log 2>&1
          ! grep -q "couldn't be loaded" /tmp/import.log; ! grep -q "Can't open file from path" /tmp/import.log
      - name: Build deterministic visual scene and capture male female frames
        run: |
          cat > /tmp/proj/capture.gd <<'EOF'
          extends Node3D
          var queue=["Male","Female"]
          var idx=0
          func _ready():
            var env=WorldEnvironment.new();var e=Environment.new();e.background_mode=Environment.BG_COLOR;e.background_color=Color(0.82,0.84,0.88);e.ambient_light_source=Environment.AMBIENT_SOURCE_COLOR;e.ambient_light_color=Color.WHITE;e.ambient_light_energy=1.2;env.environment=e;add_child(env)
            var light=DirectionalLight3D.new();light.rotation_degrees=Vector3(-35,-25,0);light.light_energy=1.8;add_child(light)
            var cam=Camera3D.new();cam.position=Vector3(0,1.05,3.2);cam.look_at_from_position(cam.position,Vector3(0,1.0,0));add_child(cam)
            call_deferred("capture_next")
          func capture_next():
            if idx>=queue.size():get_tree().quit();return
            var sex=queue[idx];var r=load("res://targets/Superhero_"+sex+"_FullBody.gltf").instantiate();r.name="Subject";add_child(r);await get_tree().process_frame;await get_tree().process_frame
            var img=get_viewport().get_texture().get_image();img.save_png("/tmp/AGCB-V05178-"+sex+"-REST.png");r.queue_free();await get_tree().process_frame;idx+=1;capture_next()
          EOF
          cat > /tmp/proj/capture.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]
          [ext_resource path="res://capture.gd" type="Script" id="1"]
          [node name="Capture" type="Node3D"]
          script = ExtResource("1")
          EOF
          xvfb-run -a /tmp/g/Godot_v4.5.1-stable_linux.x86_64 --path /tmp/proj --editor --quit-after 180 >/tmp/capture.log 2>&1 || true
          test -s /tmp/AGCB-V05178-Male-REST.png
          test -s /tmp/AGCB-V05178-Female-REST.png
          python3 - <<'PY'
          import os,json
          r={'evidenceId':'AGCB-V05178-VISUAL-FRAME-CAPTURE','release':'V0.5.178','environment':'TEST','prodEligible':False,'frames':{},'errors':[]}
          for s in ('Male','Female'):
            p=f'/tmp/AGCB-V05178-{s}-REST.png'; z=os.path.getsize(p); r['frames'][s]={'path':os.path.basename(p),'bytes':z};
            if z<10000:r['errors'].append(s+' frame suspiciously small')
          r['gate']='PASS' if not r['errors'] else 'FAIL';r['nextGate']='VISUAL_REVIEW' if not r['errors'] else 'HOLD';r['prodPromotion']='HOLD'
          open('/tmp/AGCB-V05178-VISUAL-FRAME-CAPTURE.json','w').write(json.dumps(r,indent=2));print(json.dumps(r));raise SystemExit(0 if not r['errors'] else 2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AGCB-V05178-VISUAL-FRAME-CAPTURE
          path: |
            /tmp/AGCB-V05178-*.png
            /tmp/AGCB-V05178-VISUAL-FRAME-CAPTURE.json
            /tmp/capture.log
          retention-days: 3
