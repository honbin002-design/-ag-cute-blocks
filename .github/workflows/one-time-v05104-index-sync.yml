name: One-time V0.5.104 index sync
on:
  push:
    branches: [dev-v0.1]
    paths:
      - '.github/workflows/one-time-v05104-index-sync.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v0.1
      - name: Sync public release markers
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('V0.5.103','V0.5.104').replace('bootstrap-v0510.js?v=0.5.103','bootstrap-v0510.js?v=0.5.104').replace('wardrobe-runtime.js?v=0.5.103','wardrobe-runtime.js?v=0.5.104')
          p.write_text(s,encoding='utf-8')
      - name: Verify
        shell: bash
        run: |
          grep -q '<meta name="ag-runtime-version" content="V0.5.104">' index.html
          grep -q 'AG Cute Blocks <small>V0.5.104</small>' index.html
          grep -q 'bootstrap-v0510.js?v=0.5.104' index.html
      - name: Commit synced index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'release: sync index to V0.5.104'
          git push origin HEAD:dev-v0.1
