name: Build V0.5.03 walkable surfaces and tool clarity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v0503-operability.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v0.1
          fetch-depth: 0
      - name: Patch V0.5.03
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          src=Path('app-v0501.js').read_text()
          if "const VERSION='V0.5.02'" not in src: raise SystemExit('expected V0.5.02 source')
          s=src.replace("const VERSION='V0.5.02'", "const VERSION='V0.5.03'", 1)

          # Make water a real walkable surface and let low solid objects/build pieces act as step surfaces.
          pattern=r"function standSurfaceY\(x,z\)\{.*?\}function dynamicActorBlocked"
          replacement="""const STEP_UP_MAX=.92;function standSurfaceY(x,z){let best=inWater(x,z)?.055:stairSurfaceY(x,z);const bucket=solidGrid.get(solidCellKey(Math.floor(x/SOLID_CELL),Math.floor(z/SOLID_CELL)));if(!bucket)return best;for(const g of bucket){if(g.userData.shape==='stair'||g.userData.shape==='stairs'||g.userData.solid===false)continue;const b=collisionBox.setFromObject(g);if(x>=b.min.x&&x<=b.max.x&&z>=b.min.z&&z<=b.max.z){const y=b.max.y;if(y<=player.position.y+STEP_UP_MAX&&y>=player.position.y-.28&&(best===null||y>best))best=y}}return best}function dynamicActorBlocked"""
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('standSurfaceY patch failed')

          pattern=r"function solidAt\(x,z\)\{.*?\}function movePlayer"
          replacement="""function solidAt(x,z){if(Math.abs(x)>HALF-2||Math.abs(z)>HALF-2)return true;if(dynamicActorBlocked(x,z))return true;const feet=player.position.y,radius=.30;const bucket=solidGrid.get(solidCellKey(Math.floor(x/SOLID_CELL),Math.floor(z/SOLID_CELL)));if(!bucket)return false;for(const g of bucket){if(g===playerState.anchor||g.userData.shape==='stair'||g.userData.shape==='stairs')continue;const b=collisionBox.setFromObject(g);if(b.max.y<=feet+.16||b.min.y>=feet+1.65)continue;const qx=Math.max(b.min.x,Math.min(x,b.max.x)),qz=Math.max(b.min.z,Math.min(z,b.max.z)),ddx=x-qx,ddz=z-qz;if(ddx*ddx+ddz*ddz>=radius*radius)continue;if(b.max.y<=feet+STEP_UP_MAX)continue;return true}return false}function movePlayer"""
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('solidAt patch failed')

          # Visible action labels: icon and function must always match.
          marker="const lifeUI=installLifeUI();"
          labels="""const lifeUI=installLifeUI();\nfunction syncActionLabels(){const defs={add:['＋','放置'],del:['⛏','拆除'],jump:['⬆️','跳躍'],rot:['↻','轉向']};for(const [id,[icon,label]] of Object.entries(defs)){const b=document.getElementById(id);if(!b)continue;b.innerHTML=`<span>${icon}</span><small class=\"actionLabel\">${label}</small>`;b.setAttribute('aria-label',label)}const st=document.createElement('style');st.textContent='.btn{display:flex!important;flex-direction:column;align-items:center;justify-content:center;line-height:1!important}.btn>span{display:block;line-height:1}.actionLabel{display:block;font-size:9px;line-height:10px;margin-top:2px;font-weight:900;color:#42565c}.btn#jump .actionLabel{font-size:10px}@media(max-height:430px){.actionLabel{font-size:8px;line-height:9px}}';document.head.appendChild(st)};syncActionLabels();"""
          if marker not in s: raise SystemExit('lifeUI marker missing')
          s=s.replace(marker,labels,1)

          # Fence chain feedback: repeated + extends the last fence; rotating resets the chain.
          s=s.replace("toast('圍籬已自動接合');return", "toast('圍籬已接合・再按＋可繼續延伸');return", 1)

          Path('app-v0503.js').write_text(s)

          boot=Path('bootstrap-v0501.js').read_text()
          boot=boot.replace('0.5.02','0.5.03').replace("import './app-v0501.js';", "import './app-v0503.js';")
          Path('bootstrap-v0503.js').write_text(boot)

          idx=Path('index.html').read_text()
          idx=idx.replace('V0.5.02','V0.5.03').replace('v=0.5.02','v=0.5.03').replace('bootstrap-v0501.js','bootstrap-v0503.js')
          Path('index.html').write_text(idx)
          Path('play-v0503.html').write_text(idx)

          sw=Path('sw.js').read_text()
          sw=sw.replace("const CACHE='ag-cute-blocks-v0502-runtime1';", "const CACHE='ag-cute-blocks-v0503-runtime1';")
          sw=sw.replace("'./bootstrap-v0501.js','./app-v0501.js'", "'./bootstrap-v0503.js','./app-v0503.js'")
          sw=sw.replace("key.startsWith('ag-cute-blocks-v0502-runtime')", "key.startsWith('ag-cute-blocks-v0502-runtime')||key.startsWith('ag-cute-blocks-v0503-runtime')")
          Path('sw.js').write_text(sw)

          m=Path('mobile-controls-runtime.js').read_text().replace("const href='./mobile-controls.css?v=0.4.94';", "const href='./mobile-controls.css?v=0.5.03';")
          Path('mobile-controls-runtime.js').write_text(m)
          PY
      - name: Validate
        run: |
          set -euo pipefail
          node --check app-v0503.js
          node --check bootstrap-v0503.js
          node --check sw.js
          node --check mobile-controls-runtime.js
          grep -q "V0.5.03" app-v0503.js
          grep -q "bootstrap-v0503.js" index.html
          grep -q "STEP_UP_MAX=.92" app-v0503.js
          grep -q "inWater(x,z)?.055" app-v0503.js
          grep -q "actionLabel" app-v0503.js
          grep -q "再按＋可繼續延伸" app-v0503.js
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v0503.js bootstrap-v0503.js play-v0503.html index.html sw.js mobile-controls-runtime.js
          git commit -m 'release: V0.5.03 improve walkable surfaces and build controls'
          git push origin HEAD:dev-v0.1
