name: Integrate Special Character 5 V0.4.94
on:
  push:
    branches: [dev-v0.1]
    paths:
      - '.github/workflows/integrate-special5-v0494.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v0.1
          fetch-depth: 0
      - name: Validate imported Special5 binary parts
        shell: bash
        run: |
          set -euo pipefail
          test "$(find assets/characters/special5 -maxdepth 1 -name 'model.v094.glb.part*' | wc -l)" = "14"
          python - <<'PY'
          from pathlib import Path
          parts=sorted(Path('assets/characters/special5').glob('model.v094.glb.part*'))
          assert len(parts)==14, len(parts)
          sizes=[p.stat().st_size for p in parts]
          assert sum(sizes)==39650000, (sum(sizes),sizes)
          assert all(x==3000000 for x in sizes[:-1]), sizes
          assert sizes[-1]==650000, sizes[-1]
          print('Special5 verified:',len(parts),'parts',sum(sizes),'bytes')
          PY
      - name: Integrate Special5 runtime UI cache and release chain
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Character asset runtime: binary source, loader routing, role routing and metadata.
          p=Path('character-asset-runtime.js'); s=p.read_text(encoding='utf-8')
          special3="const SPECIAL3_BASE='./assets/characters/special3/model.v051.b64.',SPECIAL3_TOTAL_BYTES=38501928,SPECIAL3_PART_COUNT=13;"
          special5="const SPECIAL5_BASE='./assets/characters/special5/model.v094.glb.part',SPECIAL5_TOTAL_BYTES=39650000,SPECIAL5_PART_COUNT=14;"
          if 'SPECIAL5_BASE=' not in s:
              if special3 not in s: raise SystemExit('SPECIAL3 constant anchor missing')
              s=s.replace(special3,special3+'\n'+special5,1)
          old="const p=(key==='boy'?loadBinaryGltf(GENERAL_BOY_BASE,GENERAL_BOY_PART_COUNT,GENERAL_BOY_TOTAL_BYTES):key==='girl'?loadBinaryGltf(GENERAL_GIRL_BASE,GENERAL_GIRL_PART_COUNT,GENERAL_GIRL_TOTAL_BYTES):key==='special2'?loadBase64Gltf(SPECIAL2_BASE,SPECIAL2_PART_COUNT,SPECIAL2_TOTAL_BYTES):loadBase64Gltf(SPECIAL3_BASE,SPECIAL3_PART_COUNT,SPECIAL3_TOTAL_BYTES)).then(gltf=>{loaded.set(key,gltf);return gltf});"
          new="const p=(key==='boy'?loadBinaryGltf(GENERAL_BOY_BASE,GENERAL_BOY_PART_COUNT,GENERAL_BOY_TOTAL_BYTES):key==='girl'?loadBinaryGltf(GENERAL_GIRL_BASE,GENERAL_GIRL_PART_COUNT,GENERAL_GIRL_TOTAL_BYTES):key==='special2'?loadBase64Gltf(SPECIAL2_BASE,SPECIAL2_PART_COUNT,SPECIAL2_TOTAL_BYTES):key==='special5'?loadBinaryGltf(SPECIAL5_BASE,SPECIAL5_PART_COUNT,SPECIAL5_TOTAL_BYTES):loadBase64Gltf(SPECIAL3_BASE,SPECIAL3_PART_COUNT,SPECIAL3_TOTAL_BYTES)).then(gltf=>{loaded.set(key,gltf);return gltf});"
          if "key==='special5'?loadBinaryGltf" not in s:
              if old not in s: raise SystemExit('loadVariant anchor missing')
              s=s.replace(old,new,1)
          s=s.replace("['special','special2','special3']","['special','special2','special3','special5']")
          oldsrc="u.assetSource=c.role==='special2'?'Meshy_AI_Chibi_Figure_0902142703_texture.glb':c.role==='special'||c.role==='special3'?'Meshy_AI_Meshy_Merged_Animations.glb':c.gender==='boy'?'03_boy.glb (完整分片)':'04_girl.glb (完整分片)'"
          newsrc="u.assetSource=c.role==='special5'?'Meshy_AI_Sweet_Cloud_Hug_0904105730_texture.glb':c.role==='special2'?'Meshy_AI_Chibi_Figure_0902142703_texture.glb':c.role==='special'||c.role==='special3'?'Meshy_AI_Meshy_Merged_Animations.glb':c.gender==='boy'?'03_boy.glb (完整分片)':'04_girl.glb (完整分片)'"
          if 'Meshy_AI_Sweet_Cloud_Hug_0904105730_texture.glb' not in s:
              if oldsrc not in s: raise SystemExit('assetSource anchor missing')
              s=s.replace(oldsrc,newsrc,1)
          if 'special5ChunkBase:' not in s:
              anchor="special3ChunkBase:SPECIAL3_BASE,special3ChunkCount:SPECIAL3_PART_COUNT"
              repl=anchor+",special5ChunkBase:SPECIAL5_BASE,special5ChunkCount:SPECIAL5_PART_COUNT"
              if anchor not in s: raise SystemExit('rigged metadata anchor missing')
              s=s.replace(anchor,repl,1)
              s=s.replace("special3Source:'Meshy_AI_Meshy_Merged_Animations.glb'","special3Source:'Meshy_AI_Meshy_Merged_Animations.glb',special5Source:'Meshy_AI_Sweet_Cloud_Hug_0904105730_texture.glb'",1)
          p.write_text(s,encoding='utf-8')

          # 2) Persistent/offline character integrity: Special5 is on-demand cached, never forced into first-load CORE.
          p=Path('asset-fetch-resilience-runtime.js'); s=p.read_text(encoding='utf-8')
          if "special5:{base:'./assets/characters/special5/model.v094.glb.part',count:14}" not in s:
              anchor="  special3:{base:'./assets/characters/special3/model.v051.b64.',count:13},"
              if anchor not in s: raise SystemExit('offline group anchor missing')
              s=s.replace(anchor,anchor+"\n  special5:{base:'./assets/characters/special5/model.v094.glb.part',count:14},",1)
          s=s.replace('V0.4.91','V0.4.94')
          p.write_text(s,encoding='utf-8')

          # 3) Runtime version chain.
          p=Path('bootstrap-v045.js'); s=p.read_text(encoding='utf-8'); s=s.replace('0.4.93','0.4.94'); p.write_text(s,encoding='utf-8')
          p=Path('character-motion-fix-runtime.js'); s=p.read_text(encoding='utf-8'); s=re.sub(r"const VERSION='V0\.4\.\d+'","const VERSION='V0.4.94'",s,1); s=s.replace('// V0.4.92:','// V0.4.94:'); p.write_text(s,encoding='utf-8')
          p=Path('mobile-controls-runtime.js'); s=p.read_text(encoding='utf-8'); s=re.sub(r"mobile-controls\.css\?v=0\.4\.\d+","mobile-controls.css?v=0.4.94",s,1); p.write_text(s,encoding='utf-8')
          p=Path('service-worker-register.js'); s=p.read_text(encoding='utf-8'); s=re.sub(r'V0\.4\.\d+','V0.4.94',s); p.write_text(s,encoding='utf-8')
          p=Path('sw.js'); s=p.read_text(encoding='utf-8'); s=re.sub(r"ag-cute-blocks-v045-runtime\d+","ag-cute-blocks-v045-runtime154",s,1); p.write_text(s,encoding='utf-8')

          # 4) Entry/UI: add Special Character 5 and align only live version markers/tags.
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'(<meta name="ag-runtime-version" content=")V0\.4\.\d+("\s*/?>)',r'\1V0.4.94\2',s,1)
          s=re.sub(r'(🌈 AG Cute Blocks <small>)V0\.4\.\d+(</small>)',r'\1V0.4.94\2',s,1)
          s=re.sub(r'(service-worker-register\.js\?v=)0\.4\.\d+',r'\g<1>0.4.94',s)
          s=re.sub(r'(bootstrap-v045\.js\?v=)0\.4\.\d+',r'\g<1>0.4.94',s)
          if 'value="special5"' not in s:
              m=re.search(r'(<select[^>]*\bid="avatar"[^>]*>)(.*?)(</select>)',s,re.S)
              if not m: raise SystemExit('avatar select missing')
              body=m.group(2)+'<option value="special5">☁️ 特殊角色 5</option>'
              s=s[:m.start(2)]+body+s[m.end(2):]
          p.write_text(s,encoding='utf-8')

          # 5) Permanent CI must protect Special5 offline group too.
          p=Path('.github/workflows/character-asset-resilience-check.yml'); s=p.read_text(encoding='utf-8')
          if "'special5':(\"./assets/characters/special5/model.v094.glb.part\",14)" not in s:
              anchor="            'special3':(\"./assets/characters/special3/model.v051.b64.\",13),"
              if anchor not in s: raise SystemExit('resilience CI group anchor missing')
              s=s.replace(anchor,anchor+"\n            'special5':(\"./assets/characters/special5/model.v094.glb.part\",14),",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate V0.4.94 integration
        shell: bash
        run: |
          set -euo pipefail
          for f in character-asset-runtime.js asset-fetch-resilience-runtime.js bootstrap-v045.js character-motion-fix-runtime.js mobile-controls-runtime.js service-worker-register.js sw.js; do node --input-type=module --check < "$f"; done
          python - <<'PY'
          from pathlib import Path
          import re
          asset=Path('character-asset-runtime.js').read_text()
          guard=Path('asset-fetch-resilience-runtime.js').read_text()
          boot=Path('bootstrap-v045.js').read_text()
          motion=Path('character-motion-fix-runtime.js').read_text()
          mobile=Path('mobile-controls-runtime.js').read_text()
          register=Path('service-worker-register.js').read_text()
          sw=Path('sw.js').read_text()
          index=Path('index.html').read_text()
          checks={
            'special5 constant':'SPECIAL5_TOTAL_BYTES=39650000' in asset and 'SPECIAL5_PART_COUNT=14' in asset,
            'special5 loader':"key==='special5'?loadBinaryGltf" in asset,
            'special5 source':'Meshy_AI_Sweet_Cloud_Hug_0904105730_texture.glb' in asset,
            'special5 role routing':"['special','special2','special3','special5']" in asset,
            'special5 offline group':"special5:{base:'./assets/characters/special5/model.v094.glb.part',count:14}" in guard,
            'guard version':"version:'V0.4.94'" in guard,
            'bootstrap version':"__AGCB_BOOTSTRAP={version:'0.4.94'" in boot,
            'bootstrap queries':all(v=='0.4.94' for v in re.findall(r"\?v=([0-9.]+)",boot)),
            'motion visible version':"const VERSION='V0.4.94'" in motion,
            'mobile css query':'mobile-controls.css?v=0.4.94' in mobile,
            'sw registration version':"version:'V0.4.94'" in register,
            'runtime cache':'ag-cute-blocks-v045-runtime154' in sw,
            'index meta':'content="V0.4.94"' in index,
            'index badge':'AG Cute Blocks <small>V0.4.94</small>' in index,
            'index special5':'value="special5"' in index,
            'index sw tag':'service-worker-register.js?v=0.4.94' in index,
            'index boot tag':'bootstrap-v045.js?v=0.4.94' in index,
            'permanent CI special5':"'special5':(\"./assets/characters/special5/model.v094.glb.part\",14)" in Path('.github/workflows/character-asset-resilience-check.yml').read_text(),
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('V0.4.94 validation failed: '+', '.join(bad))
          print('V0.4.94 Special5 integration validation passed')
          PY
      - name: Commit V0.4.94 integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add character-asset-runtime.js asset-fetch-resilience-runtime.js bootstrap-v045.js character-motion-fix-runtime.js mobile-controls-runtime.js service-worker-register.js sw.js index.html .github/workflows/character-asset-resilience-check.yml
          git commit -m 'release: V0.4.94 integrate Special Character 5'
          git push origin HEAD:dev-v0.1
