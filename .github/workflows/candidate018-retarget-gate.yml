name: Candidate 018 Retarget Gate
on:
  push:
    branches: [dev-v0.1]
    paths:
      - '.github/workflows/candidate018-retarget-gate.yml'
  workflow_dispatch:
jobs:
  retarget-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned donor and UAL technical base
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://raw.githubusercontent.com/ruslanmv/3D-Avatar-Chatbot/c8c4e13d2c76038e53fdc02bd897d5850eb44cea/vendor/avatars/HairSample_Female.vrm' -o /tmp/donor.vrm
          curl -fL --retry 3 'https://raw.githubusercontent.com/agentkaerf/FreeModels/main/Universal%20Animation%20Library%202%5BStandard%5D/Female%20Mannequin/Unreal-Godot/Mannequin_F.glb' -o /tmp/ual-female.glb
          curl -fL --retry 3 'https://raw.githubusercontent.com/agentkaerf/FreeModels/main/Universal%20Animation%20Library%201%5BStandard%5D/Unreal-Godot/UAL1_Standard.glb' -o /tmp/ual1.glb || \
          curl -fL --retry 3 'https://raw.githubusercontent.com/agentkaerf/FreeModels/main/Universal%20Animation%20Library%201%5BStandard%5D/UAL1_Standard.glb' -o /tmp/ual1.glb
          sha256sum /tmp/donor.vrm /tmp/ual-female.glb /tmp/ual1.glb > /tmp/candidate018-sources.sha256
      - name: Validate semantic bone mapping and animation target compatibility
        shell: python
        run: |
          import json, struct, math, pathlib
          def gltf_json(path):
              raw=pathlib.Path(path).read_bytes()
              if raw[:4]!=b'glTF': raise SystemExit(f'{path}: not GLB')
              off=12
              while off<len(raw):
                  ln,tp=struct.unpack_from('<II',raw,off); data=raw[off+8:off+8+ln]; off+=8+ln
                  if tp==0x4E4F534A: return json.loads(data.decode('utf8').rstrip(' \x00'))
              raise SystemExit(f'{path}: JSON chunk missing')
          donor=gltf_json('/tmp/donor.vrm'); target=gltf_json('/tmp/ual-female.glb'); lib=gltf_json('/tmp/ual1.glb')
          ext=donor.get('extensions',{}).get('VRM',{})
          human=ext.get('humanoid',{}).get('humanBones',[])
          sem_to_node={h.get('bone'):h.get('node') for h in human if h.get('bone') is not None and h.get('node') is not None}
          donor_nodes=donor.get('nodes',[]); target_nodes=target.get('nodes',[])
          target_name_to_node={n.get('name'):i for i,n in enumerate(target_nodes) if n.get('name')}
          M={
            'hips':'pelvis','spine':'spine_01','chest':'spine_02','upperChest':'spine_03','neck':'neck_01','head':'Head',
            'leftShoulder':'clavicle_l','leftUpperArm':'upperarm_l','leftLowerArm':'lowerarm_l','leftHand':'hand_l',
            'rightShoulder':'clavicle_r','rightUpperArm':'upperarm_r','rightLowerArm':'lowerarm_r','rightHand':'hand_r',
            'leftUpperLeg':'thigh_l','leftLowerLeg':'calf_l','leftFoot':'foot_l','leftToes':'ball_l',
            'rightUpperLeg':'thigh_r','rightLowerLeg':'calf_r','rightFoot':'foot_r','rightToes':'ball_r',
            'leftThumbProximal':'thumb_01_l','leftThumbIntermediate':'thumb_02_l','leftThumbDistal':'thumb_03_l',
            'leftIndexProximal':'index_01_l','leftIndexIntermediate':'index_02_l','leftIndexDistal':'index_03_l',
            'leftMiddleProximal':'middle_01_l','leftMiddleIntermediate':'middle_02_l','leftMiddleDistal':'middle_03_l',
            'leftRingProximal':'ring_01_l','leftRingIntermediate':'ring_02_l','leftRingDistal':'ring_03_l',
            'leftLittleProximal':'pinky_01_l','leftLittleIntermediate':'pinky_02_l','leftLittleDistal':'pinky_03_l',
            'rightThumbProximal':'thumb_01_r','rightThumbIntermediate':'thumb_02_r','rightThumbDistal':'thumb_03_r',
            'rightIndexProximal':'index_01_r','rightIndexIntermediate':'index_02_r','rightIndexDistal':'index_03_r',
            'rightMiddleProximal':'middle_01_r','rightMiddleIntermediate':'middle_02_r','rightMiddleDistal':'middle_03_r',
            'rightRingProximal':'ring_01_r','rightRingIntermediate':'ring_02_r','rightRingDistal':'ring_03_r',
            'rightLittleProximal':'pinky_01_r','rightLittleIntermediate':'pinky_02_r','rightLittleDistal':'pinky_03_r'
          }
          core=['hips','spine','chest','neck','head','leftShoulder','leftUpperArm','leftLowerArm','leftHand','rightShoulder','rightUpperArm','rightLowerArm','rightHand','leftUpperLeg','leftLowerLeg','leftFoot','rightUpperLeg','rightLowerLeg','rightFoot']
          rows=[]; missing_donor=[]; missing_target=[]
          for sem,tname in M.items():
              di=sem_to_node.get(sem); ti=target_name_to_node.get(tname)
              if di is None: missing_donor.append(sem)
              if ti is None: missing_target.append(tname)
              rows.append({'semantic':sem,'donorNode':di,'donorName':donor_nodes[di].get('name') if isinstance(di,int) and di<len(donor_nodes) else None,'targetNode':ti,'targetName':tname,'mapped':di is not None and ti is not None})
          core_missing=[s for s in core if sem_to_node.get(s) is None or target_name_to_node.get(M[s]) is None]
          mapped=sum(r['mapped'] for r in rows); coverage=mapped/len(rows)
          # Ensure mapped donor nodes are actually referenced by at least one donor skin.
          donor_skin_joints=set(j for s in donor.get('skins',[]) for j in s.get('joints',[]))
          donor_not_skinned=[r['semantic'] for r in rows if r['mapped'] and r['donorNode'] not in donor_skin_joints]
          # Animation compatibility on UAL1: channels target the same target-node namespace used by the female mannequin.
          animations=[]; mapped_target_nodes=set(r['targetNode'] for r in rows if r['mapped'])
          all_target_names=set(target_name_to_node)
          for a in lib.get('animations',[]):
              channels=a.get('channels',[]); hit=0; named=0
              for ch in channels:
                  ni=ch.get('target',{}).get('node')
                  if isinstance(ni,int) and ni<len(lib.get('nodes',[])):
                      nm=lib['nodes'][ni].get('name'); named += int(bool(nm)); hit += int(nm in all_target_names)
              animations.append({'name':a.get('name'),'channels':len(channels),'targetNameHits':hit,'namedTargets':named})
          required_clips=['Idle_Loop','Walk_Loop','Jog_Fwd_Loop','Sprint_Loop','Jump_Start','Jump_Loop','Jump_Land','Sitting_Enter','Sitting_Idle_Loop','Sitting_Exit','Interact']
          names={a['name'] for a in animations}; missing_clips=[x for x in required_clips if x not in names]
          report={
            'candidate':'018','donor':'VRoid HairSample_Female','donorLicense':'CC0 (official VRoid sample-model FAQ independently verified)',
            'donorNodes':len(donor_nodes),'donorSkins':len(donor.get('skins',[])),'donorHumanBones':len(human),
            'targetNodes':len(target_nodes),'targetSkins':len(target.get('skins',[])),'targetAnimationLibrary':'UAL1 Standard',
            'mappingCount':len(rows),'mappedCount':mapped,'coverage':round(coverage,4),'coreMissing':core_missing,
            'missingDonorSemantics':missing_donor,'missingTargetNames':missing_target,'mappedDonorNodesNotInSkin':donor_not_skinned,
            'requiredClipsMissing':missing_clips,'mapping':rows,'libraryAnimations':animations
          }
          pathlib.Path('/tmp/candidate018-retarget-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf8')
          print(json.dumps({k:report[k] for k in ['mappingCount','mappedCount','coverage','coreMissing','mappedDonorNodesNotInSkin','requiredClipsMissing']},ensure_ascii=False,indent=2))
          errors=[]
          if core_missing: errors.append('core humanoid mapping incomplete')
          if coverage < 0.88: errors.append(f'mapping coverage too low: {coverage:.1%}')
          if donor_not_skinned: errors.append('mapped donor bones not present in donor skin')
          if missing_clips: errors.append('required UAL1 clips missing')
          if errors:
              print('CANDIDATE 018 RETARGET GATE: FAIL'); [print('-',e) for e in errors]; raise SystemExit(1)
          print('CANDIDATE 018 RETARGET GATE: PASS')
          print('NOTE: structural compatibility only; visual deformation is NOT yet PASS')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate018-retarget-gate
          path: |
            /tmp/candidate018-retarget-report.json
            /tmp/candidate018-sources.sha256
          retention-days: 3
