name: Release chain sync

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap-v045.js'
      - 'index.html'
      - '.github/workflows/release-chain-sync.yml'

permissions:
  contents: write

concurrency:
  group: agcb-release-chain-main
  cancel-in-progress: false

jobs:
  sync-release-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync index to bootstrap version
        shell: python
        run: |
          import pathlib,re,sys
          boot=pathlib.Path('bootstrap-v045.js').read_text(encoding='utf-8')
          index_path=pathlib.Path('index.html')
          index=index_path.read_text(encoding='utf-8')
          m=re.search(r"__AGCB_BOOTSTRAP=\{version:'([^']+)'",boot)
          if not m: sys.exit('bootstrap version missing')
          v=m.group(1); vv='V'+v
          index=re.sub(r'(<meta name="ag-runtime-version" content=")V0\.4\.\d+("[^>]*>)',rf'\g<1>{vv}\2',index,count=1)
          index=re.sub(r'(<div class="pill title">🌈 AG Cute Blocks <small>)V0\.4\.\d+(</small>)',rf'\g<1>{vv}\2',index,count=1)
          index=re.sub(r'bootstrap-v045\.js\?v=0\.4\.\d+',f'bootstrap-v045.js?v={v}',index)
          index_path.write_text(index,encoding='utf-8')
          print(f'index synchronized to {vv}')
      - name: Validate synchronized release chain
        shell: python
        run: |
          import pathlib,re,sys
          boot=pathlib.Path('bootstrap-v045.js').read_text(encoding='utf-8')
          index=pathlib.Path('index.html').read_text(encoding='utf-8')
          mobile=pathlib.Path('mobile-controls-runtime.js').read_text(encoding='utf-8')
          m=re.search(r"__AGCB_BOOTSTRAP=\{version:'([^']+)'",boot)
          if not m: sys.exit('bootstrap version missing')
          v=m.group(1); vv='V'+v
          failures=[]
          if f'<meta name="ag-runtime-version" content="{vv}">' not in index: failures.append('index meta mismatch')
          if f'<small>{vv}</small>' not in index: failures.append('index visible version mismatch')
          if f'bootstrap-v045.js?v={v}' not in index: failures.append('index bootstrap query mismatch')
          for target,qv in re.findall(r"import ['\"](\./[^'\"]+)\?v=([0-9.]+)['\"]",boot):
            if qv!=v: failures.append(f'bootstrap query mismatch: {target}?v={qv} != {v}')
          css=re.search(r'mobile-controls\.css\?v=([0-9.]+)',mobile)
          if not css or css.group(1)!=v: failures.append('mobile controls CSS query mismatch')
          if failures:
            print('\n'.join(failures)); sys.exit(1)
          print(f'release chain validated for {vv}')
      - name: Commit synchronized index
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'index already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'chore: sync index release chain to bootstrap'
          if git push; then
            exit 0
          fi
          echo 'push raced with another main update; verifying remote main before deciding failure'
          git fetch origin main
          python - <<'PY'
          import re,subprocess,sys
          boot=subprocess.check_output(['git','show','origin/main:bootstrap-v045.js'],text=True)
          index=subprocess.check_output(['git','show','origin/main:index.html'],text=True)
          m=re.search(r"__AGCB_BOOTSTRAP=\{version:'([^']+)'",boot)
          if not m: sys.exit('remote bootstrap version missing')
          v=m.group(1); vv='V'+v
          checks=[
            f'<meta name="ag-runtime-version" content="{vv}">' in index,
            f'<small>{vv}</small>' in index,
            f'bootstrap-v045.js?v={v}' in index,
          ]
          if all(checks):
            print(f'remote main is already synchronized to {vv}; concurrent push is safe')
            sys.exit(0)
          sys.exit(f'remote main is not synchronized to {vv}; refusing to hide push race')
          PY
