name: Release chain sync

on:
  push:
    branches: [main, dev-v0.1]
    paths:
      - 'bootstrap-v0510.js'
      - 'index.html'
      - '.github/workflows/release-chain-sync.yml'

permissions:
  contents: write

concurrency:
  group: agcb-release-chain-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sync-release-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync index to bootstrap version
        shell: python
        run: |
          import pathlib,re,sys
          boot_path=pathlib.Path('bootstrap-v0510.js')
          boot=boot_path.read_text(encoding='utf-8')
          index_path=pathlib.Path('index.html')
          index=index_path.read_text(encoding='utf-8')
          m=re.search(r"__AGCB_BOOTSTRAP=\{version:'([^']+)'",boot)
          if not m: sys.exit('bootstrap version missing')
          v=m.group(1); vv='V'+v
          index,n1=re.subn(r'(<meta name="ag-runtime-version" content=")V0\.5\.\d+("[^>]*>)',rf'\g<1>{vv}\2',index,count=1)
          index,n2=re.subn(r'(<div class="pill title">🌈 AG Cute Blocks <small>)V0\.5\.\d+(</small>)',rf'\g<1>{vv}\2',index,count=1)
          index,n3=re.subn(r'bootstrap-v0510\.js\?v=0\.5\.\d+',f'bootstrap-v0510.js?v={v}',index,count=1)
          index,n4=re.subn(r'wardrobe-runtime\.js\?v=0\.5\.\d+',f'wardrobe-runtime.js?v={v}',index,count=1)
          index,n5=re.subn(r'const V="V0\.5\.\d+"',f'const V="{vv}"',index,count=1)
          if [n1,n2,n3,n4,n5] != [1,1,1,1,1]: sys.exit(f'index release signatures changed: {[n1,n2,n3,n4,n5]}')
          index_path.write_text(index,encoding='utf-8')
          print(f'index synchronized to {vv}')
      - name: Validate synchronized release chain
        shell: python
        run: |
          import pathlib,re,sys
          boot=pathlib.Path('bootstrap-v0510.js').read_text(encoding='utf-8')
          index=pathlib.Path('index.html').read_text(encoding='utf-8')
          wrapper=pathlib.Path('app-v0510.js').read_text(encoding='utf-8')
          m=re.search(r"__AGCB_BOOTSTRAP=\{version:'([^']+)'",boot)
          if not m: sys.exit('bootstrap version missing')
          v=m.group(1); vv='V'+v; failures=[]
          for token,msg in [
            (f'<meta name="ag-runtime-version" content="{vv}">','index meta mismatch'),
            (f'<small>{vv}</small>','index visible version mismatch'),
            (f'bootstrap-v0510.js?v={v}','index bootstrap query mismatch'),
            (f'wardrobe-runtime.js?v={v}','index wardrobe query mismatch'),
            (f'const V="{vv}"','index version sync script mismatch'),
            (f"const release='{vv}'",'bootstrap release mismatch'),
            (f"__AGCB_BOOTSTRAP={{version:'{v}'",'bootstrap state version mismatch'),
            ("versionOwner:'bootstrap-v0510.js'",'wrapper version ownership mismatch'),
          ]:
            source=index if msg.startswith('index') else boot if msg.startswith('bootstrap') else wrapper
            if token not in source: failures.append(msg)
          for target,qv in re.findall(r"import ['\"](\./[^'\"]+)\?v=([0-9.]+)['\"]",boot):
            if qv!=v: failures.append(f'bootstrap query mismatch: {target}?v={qv} != {v}')
          if failures:
            print('\n'.join(failures)); sys.exit(1)
          print(f'release chain validated for {vv}')
      - name: Commit synchronized index
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'index already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'chore: sync index release chain to bootstrap'
          if git push; then
            exit 0
          fi
          BRANCH="${GITHUB_REF_NAME}"
          echo "push raced with another ${BRANCH} update; verifying remote branch before deciding failure"
          git fetch origin "${BRANCH}"
          python - <<'PY'
          import os,re,subprocess,sys
          branch=os.environ['GITHUB_REF_NAME']
          boot=subprocess.check_output(['git','show',f'origin/{branch}:bootstrap-v0510.js'],text=True)
          index=subprocess.check_output(['git','show',f'origin/{branch}:index.html'],text=True)
          m=re.search(r"__AGCB_BOOTSTRAP=\{version:'([^']+)'",boot)
          if not m: sys.exit('remote bootstrap version missing')
          v=m.group(1); vv='V'+v
          checks=[
            f'<meta name="ag-runtime-version" content="{vv}">' in index,
            f'<small>{vv}</small>' in index,
            f'bootstrap-v0510.js?v={v}' in index,
            f'wardrobe-runtime.js?v={v}' in index,
            f'const V="{vv}"' in index,
          ]
          if all(checks):
            print(f'remote {branch} is already synchronized to {vv}; concurrent push is safe')
            sys.exit(0)
          sys.exit(f'remote {branch} is not synchronized to {vv}; refusing to hide push race')
          PY