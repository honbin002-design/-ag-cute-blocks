name: Patch character pending recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-character-pending-recovery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded pending cleanup patch
        shell: python
        run: |
          import pathlib,sys
          path=pathlib.Path('character-asset-runtime.js')
          src=path.read_text(encoding='utf-8')
          old="pending.set(key,p);return p;"
          new="pending.set(key,p);p.then(()=>{if(pending.get(key)===p)pending.delete(key)},()=>{if(pending.get(key)===p)pending.delete(key)});return p;"
          count=src.count(old)
          if count!=1:
            sys.exit(f'guard failed: expected exactly 1 pending-set target, found {count}')
          path.write_text(src.replace(old,new,1),encoding='utf-8')
          print('pending cleanup patch applied exactly once')
      - name: Verify patched source
        shell: bash
        run: |
          node --input-type=module --check < character-asset-runtime.js
          python - <<'PY'
          import pathlib,sys
          s=pathlib.Path('character-asset-runtime.js').read_text(encoding='utf-8')
          token="p.then(()=>{if(pending.get(key)===p)pending.delete(key)},()=>{if(pending.get(key)===p)pending.delete(key)})"
          if s.count(token)!=1: sys.exit('pending cleanup marker missing or duplicated')
          print('pending cleanup verification passed')
          PY
      - name: Commit patched runtime
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add character-asset-runtime.js
          git commit -m 'fix: clear settled character asset pending promise'
          git push
