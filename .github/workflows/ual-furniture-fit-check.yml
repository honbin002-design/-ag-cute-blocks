name: UAL furniture fit check
on:
  push:
    branches: [dev-v0.1, main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify UAL furniture fitting contract
        run: |
          python - <<'PY'
          from pathlib import Path
          f=Path('ual-furniture-fit-runtime.js').read_text()
          b=Path('bootstrap-v0510.js').read_text()
          l=Path('app-v0504-fixed-loader.js').read_text()
          checks={
            'seat surfaces':"chair:.71" in f and "sofa:.695" in f and "swingGarden:1.005" in f,
            'forced furniture pose':'forcePose(a,mode)' in f and "wanted=mode==='sleep'?'sleep':'sit'" in f,
            'bed surfaces':"bed:.80" in f and "starBed:.80" in f,
            'mattress centering':'targetX=Number(f.x)' in f and 'worldDelta' in f and 'box.min.y' in f,
            'static final sleep pose':'freezeSleep(candidate)' in f and 'action.paused=true' in f,
            'furniture state only':"life.includes('起身')" in f,
            'sit camera unlocked':"playerState.mode!=='sit'" in l and 'furnitureOrbit:true' in l,
            'release':"const release='V0.5.77'" in b and 'ual3-real-furniture-forced-pose' in b and 'sit-sleep-camera-orbit' in b,
            'runtime wired':"await import('./ual-furniture-fit-runtime.js?v=0.5.77')" in b,
          }
          bad=[k for k,v in checks.items() if not v]
          print(checks)
          if bad: raise SystemExit('FAIL: '+', '.join(bad))
          print('PASS UAL3 forced sit/sleep pose, mattress centering and furniture camera orbit contract')
          PY
