name: UAL furniture fit check
on:
  push:
    branches: [dev-v0.1, main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify UAL furniture fitting contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          f=Path('ual-furniture-fit-runtime.js').read_text()
          b=Path('bootstrap-v0510.js').read_text()
          l=Path('app-v0504-fixed-loader.js').read_text()
          m=re.search(r"const release='(V[0-9.]+)'",b)
          release=m.group(1) if m else ''
          version=release[1:] if release.startswith('V') else ''
          checks={
            'exact core bridge':'__AGCB_ACTIVE_FURNITURE_STATE' in l and "get anchor(){return playerState.anchor}" in l and "get mode(){return playerState.mode}" in l,
            'runtime consumes bridge':'__AGCB_ACTIVE_FURNITURE_STATE' in f and 's.anchor' in f and 's.mode' in f,
            'no nearest furniture guess':'nearestFurniture' not in f and 'readWorld' not in f and 'localStorage' not in f,
            'core xz preserved sit':'Preserve X/Z and yaw exactly' in f and 'candidate.root.position.copy(base.position)' in f,
            'forced furniture pose':"wanted=mode==='lie'?'sleep':'sit'" in f and 'forcePose(a,mode)' in f,
            'static sleep pose':'freezeSleep(candidate)' in f and 'action.paused=true' in f,
            'bed long axis':'candidate.root.rotation.y+=Math.PI/2' in f,
            'bed exact anchor center':'player.position.x-c.x' in f and 'player.position.z-c.z' in f,
            'sit lie normal third camera':"source.split(legacyFurnitureCameraBranch).join(\"if(cameraMode==='farm')\")" in l and 'lieUsesNormalThirdCamera:true' in l,
            'movement still core locked':"active-furniture-state-bridge" in l,
            'acceptance thresholds':'SIT_MAX_Y_ERROR=0.03' in f and 'SLEEP_MAX_Y_ERROR=0.03' in f and 'SLEEP_MAX_CENTER_ERROR_XZ=0.05' in f,
            'acceptance api':'getAcceptance' in f and 'SIT_Y_OUT_OF_RANGE' in f and 'SLEEP_ALIGNMENT_OUT_OF_RANGE' in f and "status:'PASS'" in f,
            'release':bool(release) and f"const release='{release}'" in b and 'ual3-exact-core-furniture-anchor' in b and 'sit-lie-normal-third-camera-orbit' in b,
            'runtime wired':bool(version) and f"await import('./ual-furniture-fit-runtime.js?v={version}')" in b,
          }
          bad=[k for k,v in checks.items() if not v]
          print('release',release)
          print(checks)
          if bad: raise SystemExit('FAIL: '+', '.join(bad))
          print('PASS UAL3 exact active-furniture anchor, numeric acceptance thresholds, bed-axis fit and unlocked sit/lie camera contract for '+release)
          PY
