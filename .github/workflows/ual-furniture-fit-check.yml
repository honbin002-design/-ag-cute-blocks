name: UAL furniture fit check
on:
  push:
    branches: [dev-v0.1, main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify UAL furniture fitting contract
        run: |
          python - <<'PY'
          from pathlib import Path
          f=Path('ual-furniture-fit-runtime.js').read_text()
          b=Path('bootstrap-v0510.js').read_text()
          checks={
            'seat surfaces':"chair:.71" in f and "sofa:.695" in f and "swingGarden:1.005" in f,
            'seat butt offset':'SIT_BUTT_OFFSET' in f and 'fitSit(candidate,f)' in f,
            'bed surfaces':"bed:.80" in f and "starBed:.80" in f,
            'core anchor preserved':'candidate.root.position.x=base.position.x' in f and 'candidate.root.position.z=base.position.z' in f,
            'static final sleep pose':'freezeSleepPose(candidate)' in f and 'action.paused=true' in f,
            'furniture state only':"life.includes('起身')" in f,
            'release':'V0.5.76' in b and 'ual3-core-anchor-seat-fit' in b,
            'runtime wired':"await import('./ual-furniture-fit-runtime.js?v=0.5.76')" in b,
          }
          bad=[k for k,v in checks.items() if not v]
          print(checks)
          if bad: raise SystemExit('FAIL: '+', '.join(bad))
          print('PASS UAL3 core-anchor chair/sofa/bed fitting contract')
          PY
