name: Adult female face integration check
on:
  push:
    paths:
      - 'adult-female-face-integration-runtime.js'
      - 'bootstrap-v045.js'
      - '.github/workflows/adult-female-face-integration-check.yml'
  workflow_dispatch:

jobs:
  integration-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate adult female face integration v1
        run: |
          set -euo pipefail
          f='adult-female-face-integration-runtime.js'
          b='bootstrap-v045.js'
          test -f "$f"
          grep -Fq "c?.gender==='girl'&&c?.age==='adult'" "$f"
          grep -Fq "adult-female-balanced-face-v1" "$f"
          grep -Fq "scope:'adult-female-face-integration-only'" "$f"
          grep -Fq "geometry:'balanced-face-v1'" "$f"
          grep -Fq "version:1" "$f"
          grep -Fq "agcb-adult-female-eye-" "$f"
          grep -Fq "agcb-adult-female-brow-" "$f"
          grep -Fq "agcb-adult-female-nose-tip-" "$f"
          grep -Fq "agcb-adult-female-upper-lip-" "$f"
          grep -Fq "agcb-adult-female-eyelash-" "$f"
          grep -Fq "agcb-adult-female-fringe-" "$f"
          grep -Fq "agcb-adult-female-hair-crown-v1" "$f"
          grep -Fq "adult-female-face-integration-runtime.js?v=0.4.92" "$b"
          ! grep -Eq "gender==='boy'.*balanceAdultFemaleFace|age==='child'.*balanceAdultFemaleFace" "$f"
