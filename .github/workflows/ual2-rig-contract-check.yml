name: UAL2 rig contract check

on:
  push:
    branches: [dev-v0.1]
    paths:
      - 'tests/ual2-rig-contract.json'
      - 'tests/character3-final-visual-validation.html'
      - 'tests/character-test-index.html'
      - 'CHARACTER_TEST_REGISTRY.md'
      - '.github/workflows/ual2-rig-contract-check.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download verified UAL2 sources
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/Mannequin_F.glb 'https://raw.githubusercontent.com/agentkaerf/FreeModels/main/Universal%20Animation%20Library%202%5BStandard%5D/Female%20Mannequin/Unreal-Godot/Mannequin_F.glb'
          curl -L --fail --retry 3 -o /tmp/UAL2_Standard.glb 'https://raw.githubusercontent.com/agentkaerf/FreeModels/main/Universal%20Animation%20Library%202%5BStandard%5D/Unreal-Godot/UAL2_Standard.glb'
      - name: Verify frozen contract against GLB contents
        shell: python
        run: |
          import json,struct,pathlib,sys
          def read_glb(path):
              data=pathlib.Path(path).read_bytes()
              if data[:4] != b'glTF': raise SystemExit(f'{path}: invalid GLB')
              version,total=struct.unpack_from('<II',data,4)
              if version != 2: raise SystemExit(f'{path}: expected GLB2, got {version}')
              off=12
              while off < len(data):
                  ln,typ=struct.unpack_from('<II',data,off); off+=8
                  chunk=data[off:off+ln]; off+=ln
                  if typ == 0x4E4F534A:
                      return json.loads(chunk.decode('utf-8').rstrip('\x00 \t\r\n'))
              raise SystemExit(f'{path}: no JSON chunk')
          contract=json.loads(pathlib.Path('tests/ual2-rig-contract.json').read_text(encoding='utf-8'))
          female=read_glb('/tmp/Mannequin_F.glb'); lib=read_glb('/tmp/UAL2_Standard.glb')
          nodes=female.get('nodes',[]); skins=female.get('skins',[])
          joint_ids=[]
          for skin in skins: joint_ids += skin.get('joints',[])
          joint_names=[nodes[i].get('name',f'node_{i}') for i in dict.fromkeys(joint_ids) if 0 <= i < len(nodes)]
          anim_names=[a.get('name',f'Animation_{i+1}') for i,a in enumerate(lib.get('animations',[]))]
          failures=[]
          f=contract['female']; u=contract['ual2Standard']
          actual=(len(nodes),len(skins),len(joint_names),len(female.get('meshes',[])))
          expected=(f['nodes'],f['skins'],f['joints'],f['meshes'])
          if actual != expected: failures.append(f'female counts drifted actual={actual} expected={expected}')
          if joint_names != f['jointNames']: failures.append('female joint names/order drifted')
          if len(lib.get('nodes',[])) != u['nodes'] or len(lib.get('skins',[])) != u['skins']: failures.append('UAL2 node/skin counts drifted')
          if len(anim_names) != u['animationCount']: failures.append(f'UAL2 animation count drifted: {len(anim_names)} != {u["animationCount"]}')
          if anim_names != u['animationNames']: failures.append('UAL2 animation names/order drifted')
          actual_set=set(anim_names)
          for action,names in contract['agActionMap'].items():
              for ref in names:
                  source,name=(ref.split(':',1)+[''])[:2] if ':' in ref else ('UAL2',ref)
                  if source=='UAL2' and name not in actual_set: failures.append(f'action {action} points to missing UAL2 clip {name}')
          expected_pending={'run','sit','swim','genericInteract','dodge','fish','sleep'}
          if contract.get('missingRequiredActions') != []: failures.append('required action gap must remain zero')
          if set(contract.get('visualPendingRequiredActions',[])) != expected_pending: failures.append('visual-pending action set drifted')
          native=contract.get('agNativeCandidates',{})
          if native.get('fish',{}).get('clipName')!='AG_Fish_Rod_Loop': failures.append('AG Fish candidate contract drifted')
          if native.get('sleep',{}).get('clipName')!='AG_Sleep_Side_Loop': failures.append('AG Sleep candidate contract drifted')
          if failures:
              print('\n'.join(failures)); sys.exit(1)
          print(f'PASS: female {len(joint_names)} joints; UAL2 {len(anim_names)} clips; missing actions 0; visual pending 7.')
      - name: Validate concentrated visual-test module syntax and contract tokens
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,re,sys
          page=pathlib.Path('tests/character3-final-visual-validation.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>',page,re.S)
          if not m: sys.exit('concentrated validation module script missing')
          pathlib.Path('/tmp/character3-validation.mjs').write_text(m.group(1),encoding='utf-8')
          required=['Sprint_Loop','Sitting_Idle_Loop','Swim_Fwd_Loop','Interact','Roll','AG_Fish_Rod_Loop','AG_Sleep_Side_Loop','attachRod()','bed.visible=true','VISUAL_PENDING','d.pct-100']
          missing=[x for x in required if x not in page]
          if missing: sys.exit('concentrated validation tokens missing: '+', '.join(missing))
          index=pathlib.Path('tests/character-test-index.html').read_text(encoding='utf-8')
          if 'character3-final-visual-validation.html' not in index: sys.exit('character test index missing final validation link')
          registry=pathlib.Path('CHARACTER_TEST_REGISTRY.md').read_text(encoding='utf-8')
          for token in ['missingRequiredActions`：0','visualPendingRequiredActions','Run、Sit、Swim、Generic Interact、Dodge、Fish、Sleep','character3-final-visual-validation.html']:
              if token not in registry: sys.exit('registry state missing: '+token)
          print('Validation page/index/registry contract tokens passed.')
          PY
          node --check /tmp/character3-validation.mjs
          echo 'Concentrated character-3 validation module syntax passed.'
