name: One-time V0.5.68 index sync

on:
  push:
    branches: [dev-v0.1]
    paths:
      - '.github/workflows/one-time-v0568-index-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v0.1
      - name: Sync index release tokens
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='0.5.67'; new='0.5.68'
          n=s.count(old)
          if n < 5:
              raise SystemExit(f'Expected at least 5 V{old} index tokens, found {n}')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          print(f'Replaced {n} index release tokens: {old} -> {new}')
      - name: Commit sync
        run: |
          if git diff --quiet -- index.html; then
            echo 'index already synced'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'chore: sync index release chain to V0.5.68'
          git push origin HEAD:dev-v0.1
