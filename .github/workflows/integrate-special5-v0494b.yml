name: Integrate Special Character 5 V0.4.94 B
on:
  push:
    branches: [dev-v0.1]
    paths:
      - '.github/workflows/integrate-special5-v0494b.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v0.1
          fetch-depth: 0
      - name: Patch and validate V0.4.94
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          parts=sorted(Path('assets/characters/special5').glob('model.v094.glb.part*'))
          assert len(parts)==14 and sum(p.stat().st_size for p in parts)==39650000

          p=Path('character-asset-runtime.js'); s=p.read_text()
          s3="const SPECIAL3_BASE='./assets/characters/special3/model.v051.b64.',SPECIAL3_TOTAL_BYTES=38501928,SPECIAL3_PART_COUNT=13;"
          s5="const SPECIAL5_BASE='./assets/characters/special5/model.v094.glb.part',SPECIAL5_TOTAL_BYTES=39650000,SPECIAL5_PART_COUNT=14;"
          if 'SPECIAL5_BASE=' not in s: s=s.replace(s3,s3+'\n'+s5,1)
          old="const p=(key==='boy'?loadBinaryGltf(GENERAL_BOY_BASE,GENERAL_BOY_PART_COUNT,GENERAL_BOY_TOTAL_BYTES):key==='girl'?loadBinaryGltf(GENERAL_GIRL_BASE,GENERAL_GIRL_PART_COUNT,GENERAL_GIRL_TOTAL_BYTES):key==='special2'?loadBase64Gltf(SPECIAL2_BASE,SPECIAL2_PART_COUNT,SPECIAL2_TOTAL_BYTES):loadBase64Gltf(SPECIAL3_BASE,SPECIAL3_PART_COUNT,SPECIAL3_TOTAL_BYTES)).then(gltf=>{loaded.set(key,gltf);return gltf});"
          new="const p=(key==='boy'?loadBinaryGltf(GENERAL_BOY_BASE,GENERAL_BOY_PART_COUNT,GENERAL_BOY_TOTAL_BYTES):key==='girl'?loadBinaryGltf(GENERAL_GIRL_BASE,GENERAL_GIRL_PART_COUNT,GENERAL_GIRL_TOTAL_BYTES):key==='special2'?loadBase64Gltf(SPECIAL2_BASE,SPECIAL2_PART_COUNT,SPECIAL2_TOTAL_BYTES):key==='special5'?loadBinaryGltf(SPECIAL5_BASE,SPECIAL5_PART_COUNT,SPECIAL5_TOTAL_BYTES):loadBase64Gltf(SPECIAL3_BASE,SPECIAL3_PART_COUNT,SPECIAL3_TOTAL_BYTES)).then(gltf=>{loaded.set(key,gltf);return gltf});"
          if "key==='special5'?loadBinaryGltf" not in s: s=s.replace(old,new,1)
          s=s.replace("['special','special2','special3']","['special','special2','special3','special5']")
          oldsrc="u.assetSource=c.role==='special2'?'Meshy_AI_Chibi_Figure_0902142703_texture.glb':c.role==='special'||c.role==='special3'?'Meshy_AI_Meshy_Merged_Animations.glb':c.gender==='boy'?'03_boy.glb (完整分片)':'04_girl.glb (完整分片)'"
          newsrc="u.assetSource=c.role==='special5'?'Meshy_AI_Sweet_Cloud_Hug_0904105730_texture.glb':c.role==='special2'?'Meshy_AI_Chibi_Figure_0902142703_texture.glb':c.role==='special'||c.role==='special3'?'Meshy_AI_Meshy_Merged_Animations.glb':c.gender==='boy'?'03_boy.glb (完整分片)':'04_girl.glb (完整分片)'"
          if 'Meshy_AI_Sweet_Cloud_Hug_0904105730_texture.glb' not in s: s=s.replace(oldsrc,newsrc,1)
          if 'special5ChunkBase:' not in s:
              a="special3ChunkBase:SPECIAL3_BASE,special3ChunkCount:SPECIAL3_PART_COUNT"
              s=s.replace(a,a+",special5ChunkBase:SPECIAL5_BASE,special5ChunkCount:SPECIAL5_PART_COUNT",1)
              s=s.replace("special3Source:'Meshy_AI_Meshy_Merged_Animations.glb'","special3Source:'Meshy_AI_Meshy_Merged_Animations.glb',special5Source:'Meshy_AI_Sweet_Cloud_Hug_0904105730_texture.glb'",1)
          p.write_text(s)

          p=Path('asset-fetch-resilience-runtime.js'); s=p.read_text()
          if "special5:{base:'./assets/characters/special5/model.v094.glb.part',count:14}" not in s:
              a="  special3:{base:'./assets/characters/special3/model.v051.b64.',count:13},"
              s=s.replace(a,a+"\n  special5:{base:'./assets/characters/special5/model.v094.glb.part',count:14},",1)
          s=s.replace('V0.4.91','V0.4.94'); p.write_text(s)

          p=Path('bootstrap-v045.js'); s=p.read_text().replace('0.4.93','0.4.94'); p.write_text(s)
          p=Path('character-motion-fix-runtime.js'); s=p.read_text(); s=re.sub(r"const VERSION='V0\.4\.\d+'","const VERSION='V0.4.94'",s,1); p.write_text(s)
          p=Path('mobile-controls-runtime.js'); s=p.read_text(); s=re.sub(r"mobile-controls\.css\?v=0\.4\.\d+","mobile-controls.css?v=0.4.94",s,1); p.write_text(s)
          p=Path('service-worker-register.js'); s=p.read_text(); s=re.sub(r'V0\.4\.\d+','V0.4.94',s); p.write_text(s)
          p=Path('sw.js'); s=p.read_text(); s=re.sub(r"ag-cute-blocks-v045-runtime\d+","ag-cute-blocks-v045-runtime154",s,1); p.write_text(s)

          p=Path('index.html'); s=p.read_text()
          s=re.sub(r'(<meta name="ag-runtime-version" content=")V0\.4\.\d+("\s*/?>)',r'\1V0.4.94\2',s,1)
          s=re.sub(r'(🌈 AG Cute Blocks <small>)V0\.4\.\d+(</small>)',r'\1V0.4.94\2',s,1)
          s=re.sub(r'(service-worker-register\.js\?v=)0\.4\.\d+',r'\g<1>0.4.94',s)
          s=re.sub(r'(bootstrap-v045\.js\?v=)0\.4\.\d+',r'\g<1>0.4.94',s)
          if 'value="special5"' not in s:
              m=re.search(r'(<select[^>]*\bid="avatar"[^>]*>)(.*?)(</select>)',s,re.S)
              assert m,'avatar select missing'
              s=s[:m.start(2)]+m.group(2)+'<option value="special5">☁️ 特殊角色 5</option>'+s[m.end(2):]
          p.write_text(s)

          assert 'SPECIAL5_TOTAL_BYTES=39650000' in Path('character-asset-runtime.js').read_text()
          assert "key==='special5'?loadBinaryGltf" in Path('character-asset-runtime.js').read_text()
          assert "special5:{base:'./assets/characters/special5/model.v094.glb.part',count:14}" in Path('asset-fetch-resilience-runtime.js').read_text()
          assert "__AGCB_BOOTSTRAP={version:'0.4.94'" in Path('bootstrap-v045.js').read_text()
          assert 'value="special5"' in Path('index.html').read_text()
          PY
          for f in character-asset-runtime.js asset-fetch-resilience-runtime.js bootstrap-v045.js character-motion-fix-runtime.js mobile-controls-runtime.js service-worker-register.js sw.js; do node --input-type=module --check < "$f"; done
      - name: Commit V0.4.94 live files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add character-asset-runtime.js asset-fetch-resilience-runtime.js bootstrap-v045.js character-motion-fix-runtime.js mobile-controls-runtime.js service-worker-register.js sw.js index.html
          git commit -m 'release: V0.4.94 integrate Special Character 5'
          git push origin HEAD:dev-v0.1
