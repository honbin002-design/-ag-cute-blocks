name: Diagnose V0.4.95 once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-v0495-once.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v0.1
      - name: Print exact avatar handlers
        shell: python
        run: |
          from pathlib import Path
          s=Path('app-v043.js').read_text()
          for n in ["ui.avatar.addEventListener","ui.avatar.onchange","ui.avatar.value","role:ui.avatar","avatarCustomization.role=","role==='special3'","role==='special2'"]:
            print('\n====',n,'====')
            start=0; c=0
            while True:
              i=s.find(n,start)
              if i<0 or c>=10: break
              print(s[max(0,i-600):min(len(s),i+1400)].replace(';',';\n'))
              start=i+len(n); c+=1
