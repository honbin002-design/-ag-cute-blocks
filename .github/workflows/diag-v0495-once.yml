name: Diagnose V0.4.95 once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-v0495-once.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v0.1
      - name: Print avatar selection contexts
        shell: python
        run: |
          from pathlib import Path
          s=Path('app-v043.js').read_text()
          for n in ['avatarCustomization','ui.avatar','avatarStyle','settings.avatar','createCuteChildAvatar','AGCB_LIVE_AVATARS']:
            print('\n====',n,'====')
            start=0
            while True:
              i=s.find(n,start)
              if i<0: break
              print(s[max(0,i-900):min(len(s),i+1800)].replace(';',';\n'))
              start=i+len(n)
