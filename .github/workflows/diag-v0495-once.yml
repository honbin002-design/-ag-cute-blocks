name: Diagnose V0.4.95 once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-v0495-once.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v0.1
      - name: Find sleep and avatar integration sources
        shell: python
        run: |
          from pathlib import Path
          terms=['睡到天亮','睡覺','sleep','morning','advanceDailyRecord','playerState.mode','special5','V0.4.94']
          for p in Path('.').rglob('*'):
            if not p.is_file() or '.git' in p.parts or p.stat().st_size>2_000_000: continue
            try:s=p.read_text(errors='ignore')
            except:continue
            hits=[t for t in terms if t in s]
            if not hits: continue
            print(f'\n### FILE {p} HITS {hits}')
            for t in hits:
              start=0; count=0
              while True:
                i=s.find(t,start)
                if i<0 or count>=5: break
                print(f'-- {t} --')
                print(s[max(0,i-500):min(len(s),i+1200)].replace(';',';\n'))
                start=i+len(t); count+=1
