name: One-time V0.5.108 TEST Drive diagnostics
on:
  push:
    branches: [dev-v0.1]
    paths:
      - '.github/workflows/one-time-v05108-test-drive-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v0.1
      - name: Patch V0.5.108 TEST runtime
        shell: python
        run: |
          from pathlib import Path
          # index: visible version + bootstrap cache query only
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('V0.5.104','V0.5.108')
          s=s.replace('bootstrap-v0510.js?v=0.5.104','bootstrap-v0510.js?v=0.5.108')
          p.write_text(s,encoding='utf-8')

          # app: finite release helper and runtime version
          p=Path('app-v0510.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("./release-version-v05104.js","./release-version-v05108.js")
          s=s.replace("runtimeVersion:'0.5.104'","runtimeVersion:'0.5.108'")
          s=s.replace('V0.5.104 keeps bootstrap','V0.5.108 keeps bootstrap')
          p.write_text(s,encoding='utf-8')

          # bootstrap: visible owner + cache bust + new Drive bridge
          p=Path('bootstrap-v0510.js'); s=p.read_text(encoding='utf-8')
          s=s.replace('V0.5.104 bootstrap','V0.5.108 bootstrap')
          s=s.replace("const release='V0.5.104'","const release='V0.5.108'")
          s=s.replace("version:'0.5.104'","version:'0.5.108'",1)
          s=s.replace('./save-drive-bridge-v05103.js?v=0.5.104','./save-drive-bridge-v05108.js?v=0.5.108')
          s=s.replace('?v=0.5.104','?v=0.5.108')
          p.write_text(s,encoding='utf-8')
      - name: Verify V0.5.108 patch
        shell: bash
        run: |
          grep -q 'V0.5.108' index.html
          grep -q 'bootstrap-v0510.js?v=0.5.108' index.html
          grep -q "release-version-v05108.js" app-v0510.js
          grep -q "runtimeVersion:'0.5.108'" app-v0510.js
          grep -q "const release='V0.5.108'" bootstrap-v0510.js
          grep -q "save-drive-bridge-v05108.js?v=0.5.108" bootstrap-v0510.js
          node --check save-drive-bridge-v05108.js
          node --check release-version-v05108.js
      - name: Commit V0.5.108 patch
        shell: bash
        run: |
          if git diff --quiet -- index.html app-v0510.js bootstrap-v0510.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app-v0510.js bootstrap-v0510.js
          git commit -m 'fix(test-drive): activate V0.5.108 endpoint fallback diagnostics'
          git push origin HEAD:dev-v0.1
