name: Adult female full silhouette check

on:
  push:
    paths:
      - 'adult-female-full-silhouette-runtime.js'
      - 'bootstrap-v045.js'
      - '.github/workflows/adult-female-full-silhouette-check.yml'
  pull_request:
    paths:
      - 'adult-female-full-silhouette-runtime.js'
      - 'bootstrap-v045.js'
      - '.github/workflows/adult-female-full-silhouette-check.yml'

jobs:
  full-silhouette-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate adult female full silhouette v1
        shell: bash
        run: |
          set -euo pipefail
          test -f adult-female-full-silhouette-runtime.js
          grep -Fq "c?.gender==='girl'&&c?.age==='adult'" adult-female-full-silhouette-runtime.js
          grep -Fq "scope:'adult-female-full-silhouette-only'" adult-female-full-silhouette-runtime.js
          grep -Fq "geometry:'full-silhouette-v1'" adult-female-full-silhouette-runtime.js
          grep -Fq "garmentFit:'slot-compensation-v1'" adult-female-full-silhouette-runtime.js
          grep -Fq "agcb-thigh-l" adult-female-full-silhouette-runtime.js
          grep -Fq "agcb-shin-r" adult-female-full-silhouette-runtime.js
          grep -Fq "bone-inherited-no-double-scale-v1" adult-female-full-silhouette-runtime.js
          grep -Fq "bone-inherited-plus-paper-doll-slot-compensation-v1" adult-female-full-silhouette-runtime.js
          grep -Fq "adult-female-full-silhouette-runtime.js?v=0.4.92" bootstrap-v045.js
          ! grep -Eq "gender==='boy'|age==='child'" adult-female-full-silhouette-runtime.js
