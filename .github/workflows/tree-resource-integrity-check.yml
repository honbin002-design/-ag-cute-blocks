name: Tree resource integrity check

on:
  push:
    branches: [dev-v0.1]
  pull_request:
    branches: [main]

jobs:
  tree-resource-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify V0.5.90 tree resource contract
        shell: python
        run: |
          import pathlib,sys
          preload=pathlib.Path('tree-resource-integrity-preload-v0588.js').read_text(encoding='utf-8')
          wrapper=pathlib.Path('app-v0510.js').read_text(encoding='utf-8')
          boot=pathlib.Path('bootstrap-v0510.js').read_text(encoding='utf-8')
          loader=pathlib.Path('app-v0504-fixed-loader.js').read_text(encoding='utf-8')
          status=pathlib.Path('tree-regrowth-status-runtime-v0587.js').read_text(encoding='utf-8')
          failures=[]
          required_preload=[
            "'appleTree','🍎','蘋果樹'",
            "'orangeTree','🍊','橘子樹'",
            "['tree','🌳','樹木']",
            "const REPLACEMENT=\"'果樹':[['appleTree','🍎','蘋果樹'],['orangeTree','🍊','橘子樹']]\"",
            "app-v0504\\.js",
            "if(count!==1)",
            "globalThis.fetch=nativeFetch",
            "status:'FREE_NORMAL_TREE_PLACEMENT_BLOCKED'",
            "naturalTreeChopPreserved:true",
            "fruitTreesPreserved:true",
            "noNewStorage:true"
          ]
          for token in required_preload:
            if token not in preload: failures.append('preload missing '+token)
          replacement=preload.split('const REPLACEMENT=',1)[1].split(';',1)[0] if 'const REPLACEMENT=' in preload else ''
          if "['tree','🌳','樹木']" in replacement:
            failures.append('replacement must exclude free normal tree')
          first=wrapper.find("import './tree-resource-integrity-preload-v0588.js';")
          second=wrapper.find("import './app-v0504-fixed-loader.js';")
          if first<0 or second<0 or first>second: failures.append('preload must load before guarded core loader')
          if "persistent-realtime-1to3min-tree-stump-regrowth" not in boot:
            failures.append('bootstrap missing persistent realtime tree-regrowth target')
          for token in [
            "function chopTreeById",
            "addInventory(economy,'wood',1)",
            "o.userData.treeState='stump'",
            "o.userData.regrowAt=Date.now()+regrowMs",
            "TREE_REGROW_MIN_MS=60000",
            "TREE_REGROW_MAX_MS=180000",
            "function processTreeRegrowth(now=Date.now())",
            "__AGCB_TREE_REGROWTH_TIMER=setInterval",
            "version:4",
            "AUTHORITATIVE_CORE_WITH_PERSISTENT_REALTIME_TREE_REGROWTH"
          ]:
            if token not in loader: failures.append('authoritative realtime chop/regrowth contract missing '+token)
          for forbidden in ["o.userData.regrowDay=worldDay+TREE_REGROW_DAYS","TREE_REGROW_DAYS=3"]:
            if forbidden in loader: failures.append('legacy day-based regrowth still authoritative: '+forbidden)
          for token in ["version:'0.5.90'","remainingMs","READ_ONLY_REALTIME_EXISTING_WORLD_SAVE","formatRemaining"]:
            if token not in status: failures.append('realtime forest status missing '+token)
          if failures:
            print('\n'.join(failures));sys.exit(1)
          print('V0.5.90 tree subsystem contract passed under the current overall release.')
