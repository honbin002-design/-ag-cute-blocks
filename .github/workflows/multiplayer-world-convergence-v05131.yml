name: Multiplayer World Convergence V0.5.132
on:
  push:
    branches: [dev-v0.1]
    paths:
      - 'multiplayer-webrtc-test-v05123.js'
      - 'multiplayer-hub-v05126.js'
      - 'multiplayer-world-convergence-v05131.js'
      - '.github/workflows/multiplayer-world-convergence-v05131.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  three-worlds:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify three real browser TEST worlds converge
        run: |
          cat > ./agcb-world-v05132.mjs <<'NODE'
          import {chromium} from 'playwright';import http from 'node:http';import fs from 'node:fs';
          const files={};for(const f of ['multiplayer-webrtc-test-v05123.js','multiplayer-hub-v05126.js','multiplayer-world-convergence-v05131.js'])files['/'+f]=fs.readFileSync(f,'utf8');
          const server=http.createServer((q,r)=>{if(files[q.url]){r.setHeader('Content-Type','text/javascript');return r.end(files[q.url])}r.setHeader('Content-Type','text/html');r.end(`<script type="module">import{AGCBPeerSession}from'/multiplayer-webrtc-test-v05123.js';import{AGCBMultiplayerHostHub}from'/multiplayer-hub-v05126.js';import{installAGCBMultiplayerWorldConvergence}from'/multiplayer-world-convergence-v05131.js';window.seen=[];window.world=installAGCBMultiplayerWorldConvergence();window.applyLocal=(type,payload)=>document.dispatchEvent(new CustomEvent(type==='building-mutation'?'agcb:remote-building-mutation':'agcb:remote-farming-mutation',{detail:payload}));window.guest=()=>window.s=new AGCBPeerSession({onMessage:m=>{seen.push(m);if(m.type==='building-mutation')applyLocal(m.type,m.payload);if(m.type==='farming-mutation')applyLocal(m.type,m.payload)}});window.host=()=>window.h=new AGCBMultiplayerHostHub({hostId:'H',onMessage:x=>{seen.push(x.message);const m=x.message;if(m.type==='building-mutation')applyLocal(m.type,m.payload);if(m.type==='farming-mutation')applyLocal(m.type,m.payload)}});window.ready=true;</script>`)});await new Promise(r=>server.listen(0,'127.0.0.1',r));
          const browser=await chromium.launch({headless:true}),url=`http://127.0.0.1:${server.address().port}/`;const cs=await Promise.all([0,1,2].map(()=>browser.newContext()));const [H,A,B]=await Promise.all(cs.map(async c=>{const p=await c.newPage();await p.goto(url);await p.waitForFunction(()=>ready);return p}));await H.evaluate(()=>host());await A.evaluate(()=>guest());await B.evaluate(()=>guest());
          async function connect(id,p){const o=await H.evaluate(id=>h.createGuestOffer(id),id),a=await p.evaluate(o=>s.acceptHostOffer(o),o);await H.evaluate(x=>h.acceptGuestAnswer(x.id,x.a),{id,a})}await connect('A',A);await connect('B',B);await Promise.all([H.waitForFunction(()=>[...h.guests.values()].length===2&&[...h.guests.values()].every(s=>s.channel?.readyState==='open'),null,{timeout:15000}),A.waitForFunction(()=>s.channel?.readyState==='open',null,{timeout:15000}),B.waitForFunction(()=>s.channel?.readyState==='open',null,{timeout:15000})]);
          await A.evaluate(()=>{const b={peerId:'A',mutationId:'build-a',event:{op:'place',id:'house-a',kind:'wood'}},f={peerId:'A',mutationId:'farm-a',event:{op:'plant',id:'plot-a',crop:'turnip'}};applyLocal('building-mutation',b);applyLocal('farming-mutation',f);s.sendBuildingMutation(b);s.sendFarmingMutation(f)});await Promise.all([H.waitForFunction(()=>world.state.buildings.has('house-a')&&world.state.farms.has('plot-a'),null,{timeout:10000}),B.waitForFunction(()=>world.state.buildings.has('house-a')&&world.state.farms.has('plot-a'),null,{timeout:10000})]);
          await B.evaluate(()=>{const b={peerId:'B',mutationId:'build-b',event:{op:'place',id:'house-b',kind:'stone'}},f={peerId:'B',mutationId:'farm-b',event:{op:'plant',id:'plot-b',crop:'corn'}};applyLocal('building-mutation',b);applyLocal('farming-mutation',f);s.sendBuildingMutation(b);s.sendFarmingMutation(f)});await Promise.all([H.waitForFunction(()=>world.state.buildings.has('house-b')&&world.state.farms.has('plot-b'),null,{timeout:10000}),A.waitForFunction(()=>world.state.buildings.has('house-b')&&world.state.farms.has('plot-b'),null,{timeout:10000})]);
          await B.evaluate(()=>{const b={peerId:'B',mutationId:'remove-a',event:{op:'remove',id:'house-a'}},f={peerId:'B',mutationId:'harvest-a',event:{op:'harvest',id:'plot-a'}};applyLocal('building-mutation',b);applyLocal('farming-mutation',f);s.sendBuildingMutation(b);s.sendFarmingMutation(f)});await Promise.all([H.waitForFunction(()=>!world.state.buildings.has('house-a')&&!world.state.farms.has('plot-a'),null,{timeout:10000}),A.waitForFunction(()=>!world.state.buildings.has('house-a')&&!world.state.farms.has('plot-a'),null,{timeout:10000})]);
          const snaps=await Promise.all([H,A,B].map(p=>p.evaluate(()=>world.snapshot())));const canonical=x=>JSON.stringify({environment:x.environment,buildings:[...x.buildings].sort(),farms:[...x.farms].sort()});if(new Set(snaps.map(canonical)).size!==1)throw new Error('THREE_WORLD_CONVERGENCE_MISMATCH '+JSON.stringify(snaps));if(snaps.some(x=>x.environment!=='TEST'))throw new Error('ENVIRONMENT_LEAK');console.log('REAL_CHROMIUM_THREE_WORLD_CONVERGENCE_PASS');console.log(JSON.stringify(snaps[0]));await browser.close();server.close();
          NODE
          node ./agcb-world-v05132.mjs
