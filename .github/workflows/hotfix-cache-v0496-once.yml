name: Hotfix cache V0.4.96 once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/hotfix-cache-v0496-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v0.1
          fetch-depth: 0
      - name: Patch visible version chain
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('app-v043.js')
          s=p.read_text()
          if "const VERSION='V0.4.95'" in s:
              s=s.replace("const VERSION='V0.4.95'","const VERSION='V0.4.96'",1)
          elif "const VERSION='V0.4.96'" not in s:
              raise SystemExit('app version anchor missing')
          p.write_text(s)
          p=Path('index.html')
          s=p.read_text()
          if 'V0.4.95' in s or 'v=0.4.95' in s:
              s=s.replace('V0.4.95','V0.4.96').replace('v=0.4.95','v=0.4.96')
          if 'V0.4.96' not in s or 'service-worker-register.js?v=0.4.96' not in s:
              raise SystemExit('index version update failed')
          p.write_text(s)
          PY
      - name: Validate hotfix
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "const VERSION='V0.4.96'" app-v043.js
          grep -Fq 'content="V0.4.96"' index.html
          grep -Fq 'service-worker-register.js?v=0.4.96' index.html
          grep -Fq "runtime156" sw.js
          grep -Fq "request.mode==='navigate'" sw.js
          grep -Fq "V0.4.96" service-worker-register.js
          grep -Fq "version:'0.4.96'" bootstrap-v045.js
          node --check app-v043.js
          node --check service-worker-register.js
          node --check bootstrap-v045.js
          node --check sw.js
      - name: Commit visible version chain
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v043.js index.html
          if git diff --cached --quiet; then
            echo 'No version-chain changes needed'
          else
            git commit -m 'release: V0.4.96 expose cache hotfix version'
            git push origin HEAD:dev-v0.1
          fi
