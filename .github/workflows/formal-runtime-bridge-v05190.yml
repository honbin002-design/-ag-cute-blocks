name: AGCB V0.5.190 Formal Runtime Bridge Gate
on:
  push:
    branches: [gate/runtime-integration-v05186]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify authoritative core and existing overlay integration contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          core=Path('app-v0504.js').read_text()
          integ=Path('test-character-game-integration.js').read_text()
          boot=Path('bootstrap-v0510.js').read_text()
          checks={
            'core_loop':'function loop(t){requestAnimationFrame(loop)' in core,
            'core_movement_mode':"let movementMode=settings.movementMode==='run'?'run':'walk'" in core,
            'core_jump':'const JUMP_VELOCITY=.17' in core and 'onGround=true' in core,
            'core_animation_call':"animateCuteCharacter(player,t,moving,movementMode==='run'?1.45:1.15)" in core,
            'live_avatar_bridge':'globalThis.__AGCB_LIVE_AVATARS' in integ,
            'overlay_update':'overlay.update(dt)' in integ,
            'overlay_walk_run':"locomotionState=moving?(running?'run':'walk'):'idle'" in integ,
            'overlay_jump':"overlay.play('jump')" in integ,
            'candidate_before_integration':boot.find("await import('./candidate018-game-runtime.js") < boot.find("await import('./test-character-game-integration.js")
          }
          print(json.dumps(checks,indent=2))
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('contract mismatch: '+','.join(bad))
          Path('/tmp/AGCB-V05190.json').write_text(json.dumps({'evidenceId':'AGCB-V05190-FORMAL-RUNTIME-BRIDGE','gate':'PASS','checks':checks,'decision':'USE_EXISTING_OVERLAY_INTEGRATION_NOT_WORLD_CORE_PATCH','prodPromotion':'HOLD'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AGCB-V05190-FORMAL-RUNTIME-BRIDGE
          path: /tmp/AGCB-V05190.json
          retention-days: 3
