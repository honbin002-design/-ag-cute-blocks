<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>動漫牧場人物驗收 V1</title><style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#91d8f2;touch-action:none;font-family:-apple-system,sans-serif}#g{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#8ed6f3 0 28%,#86c66c 28% 100%)}.hill{position:absolute;left:-10%;right:-10%;top:28%;height:32%;background:#79b95f;border-radius:50% 50% 0 0}.path{position:absolute;left:22%;top:48%;width:70%;height:60%;background:#d8bc7c;transform:rotate(-8deg);border-radius:48%}.house{position:absolute;left:6%;top:28%;width:29%;height:31%;background:#e7c98d;border:5px solid #785b43;border-radius:12px}.roof{position:absolute;left:-7%;top:-18%;width:114%;height:27%;background:#b95e50;transform:skew(-8deg);border-radius:12px}.door{position:absolute;left:40%;bottom:0;width:30%;height:48%;background:#73513c;border-radius:15px 15px 0 0}.field{position:absolute;right:5%;top:43%;width:34%;height:27%;background:#79573c;border:5px solid #90694a;border-radius:28%}.field:after{content:'🌱   🌱   🌱\A\A  🌱   🌱   🌱';white-space:pre;position:absolute;inset:10px;color:#55a938;font-size:28px}.pond{position:absolute;left:-4%;bottom:-3%;width:38%;height:27%;background:#69b7d0;border:5px solid #58998c;border-radius:50%}.tree{position:absolute;font-size:64px;right:5%;top:27%}.shadow{position:absolute;width:62px;height:18px;border-radius:50%;background:#0003;transform:translate(-50%,-50%);z-index:4}#p{position:absolute;width:74px;height:164px;transform:translate(-50%,-88%);z-index:5;filter:drop-shadow(0 5px 4px #0004)}#p.walk{animation:bob .18s infinite alternate ease-in-out}@keyframes bob{to{margin-top:-5px}}#joy{position:absolute;left:22px;bottom:25px;width:132px;height:132px;border-radius:50%;border:3px solid #fff9;background:#203a4250;z-index:10}#knob{position:absolute;left:40px;top:40px;width:48px;height:48px;border-radius:50%;background:#ffffffe8;border:2px solid #fff}.tag{position:absolute;left:12px;top:max(12px,env(safe-area-inset-top));z-index:10;background:#0007;color:#fff;padding:8px 12px;border-radius:12px;font-weight:700}.run{position:absolute;right:24px;bottom:35px;width:74px;height:74px;border-radius:50%;border:3px solid #fff9;background:#203a4277;color:#fff;font-size:20px;font-weight:800;z-index:10}.note{position:absolute;right:12px;top:max(12px,env(safe-area-inset-top));z-index:10;background:#fffde8dd;color:#345;padding:7px 10px;border-radius:10px;font-size:12px;font-weight:700}</style></head><body><div id="g"><div class="hill"></div><div class="path"></div><div class="house"><div class="roof"></div><div class="door"></div></div><div class="field"></div><div class="pond"></div><div class="tree">🌳</div><div class="tag">動漫人物實際走動驗收 V1</div><div class="note">左下搖桿移動</div><div id="s" class="shadow"></div><img id="p" src="front.webp" alt="日系動漫女孩"><div id="joy"><div id="knob"></div></div><button id="run" class="run">跑</button></div><script>const p=document.getElementById('p'),s=document.getElementById('s'),j=document.getElementById('joy'),k=document.getElementById('knob'),r=document.getElementById('run');let x=.52,y=.64,vx=0,vy=0,drag=false,fast=false,last=performance.now();function draw(){p.style.left=x*100+'%';p.style.top=y*100+'%';s.style.left=x*100+'%';s.style.top=(y*100+1)+'%';if(vx<-.05)p.style.scale='-1 1';else if(vx>.05)p.style.scale='1 1'}function loop(t){let dt=Math.min(35,t-last);last=t;let m=Math.hypot(vx,vy);if(m>.05){let q=(fast?.00038:.00023)*dt;x=Math.max(.08,Math.min(.92,x+vx/m*q));y=Math.max(.38,Math.min(.88,y+vy/m*q));p.classList.add('walk')}else p.classList.remove('walk');draw();requestAnimationFrame(loop)}function mv(e){let b=j.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=40,d=Math.hypot(dx,dy)||1;if(d>max){dx*=max/d;dy*=max/d}k.style.transform=`translate(${dx}px,${dy}px)`;vx=dx/max;vy=dy/max}j.onpointerdown=e=>{drag=true;j.setPointerCapture(e.pointerId);mv(e)};j.onpointermove=e=>{if(drag)mv(e)};function stop(){drag=false;vx=vy=0;k.style.transform=''}j.onpointerup=stop;j.onpointercancel=stop;r.onpointerdown=()=>fast=true;r.onpointerup=r.onpointercancel=r.onpointerleave=()=>fast=false;draw();requestAnimationFrame(loop)</script></body></html>
